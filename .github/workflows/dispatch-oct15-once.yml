name: One-Time AI Tech Lab October 15 Research Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/run-once/daily-research-oct15.txt"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-research:
    if: ${{ github.event.head_commit.message == 'RUN-AI-TECH-LAB-OCT15-ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout marker file
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate target date and dispatch normal research workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TARGET_DATE="$(tr -d '[:space:]' < .github/run-once/daily-research-oct15.txt)"
          test "$TARGET_DATE" = "2026-10-15" || { echo "Unexpected target date; dispatch blocked."; exit 1; }
          jq -n --arg ref "main" --arg target_date "$TARGET_DATE" \
            '{ref:$ref,inputs:{target_date:$target_date}}' > dispatch.json
          CODE=$(curl -sS --max-time 45 -o dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @dispatch.json \
            "$GH_API/repos/$GH_REPO/actions/workflows/daily-content-research.yml/dispatches")
          if [ "$CODE" != "204" ]; then
            echo "Could not start normal workflow_dispatch research run (HTTP $CODE)."
            jq '{message,errors}' dispatch_response.json || true
            exit 1
          fi
          echo "Accepted workflow_dispatch research run for US Eastern publish date $TARGET_DATE."
          echo "Protected automatic production handoff will follow only if research succeeds."
