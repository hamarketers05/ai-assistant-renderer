name: AI Assistant Renderer

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "Content ID"
        required: true
        type: string
      audio_url:
        description: "Optional direct audio URL"
        required: false
        type: string
      content_format:
        description: "AI Tech Lab video format"
        required: true
        type: choice
        options:
          - LONG_VIDEO
          - SHORT
        default: LONG_VIDEO
      title:
        description: "Video title"
        required: true
        type: string
      script:
        description: "Complete English video script"
        required: true
        type: string
      description:
        description: "YouTube description"
        required: false
        type: string
      tags:
        description: "Comma-separated YouTube tags"
        required: false
        type: string
      publish_at:
        description: "Optional UTC publish time"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: renderer-${{ inputs.content_id }}
  cancel-in-progress: false

jobs:
  render:
    name: Render AI Tech Lab Video
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CONTENT_ID: ${{ inputs.content_id }}
      CONTENT_FORMAT: ${{ inputs.content_format }}
      INPUT_TITLE: ${{ inputs.title }}
      INPUT_SCRIPT: ${{ inputs.script }}
      INPUT_DESCRIPTION: ${{ inputs.description }}
      INPUT_TAGS: ${{ inputs.tags }}
      INPUT_PUBLISH_AT: ${{ inputs.publish_at }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install editing tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq imagemagick python3 python3-venv fonts-dejavu-core
          if sudo apt-get install -y rubberband-cli; then
            echo "Rubber Band is available for optional pitch shaping."
          else
            echo "Rubber Band unavailable; safely skipping optional pitch shaping."
          fi
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy scipy pillow matplotlib opencv-python-headless pydub faster-whisper
          # Faster-Whisper 1.2.1 still passes metadata_errors to av.open; PyAV 19 removed that argument.
          .venv/bin/pip install 'av<19'
          .venv/bin/python -c 'import av; major=int(av.__version__.split(".")[0]); assert major < 19, av.__version__; print("PyAV/Faster-Whisper compatibility confirmed:", av.__version__)'
          mkdir -p work output scenes assets

      - name: Validate configuration and approved voice gate
        env:
          WORKER_URL: ${{ vars.NEW_PRODUCTION_WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          set -euo pipefail
          [[ "$CONTENT_ID" =~ ^[0-9]+$ ]] || { echo "Content ID must be numeric."; exit 1; }
          [[ "$CONTENT_FORMAT" == "LONG_VIDEO" || "$CONTENT_FORMAT" == "SHORT" ]] || { echo "Unsupported video format."; exit 1; }
          test -n "$INPUT_TITLE"
          test "${#INPUT_SCRIPT}" -ge 300
          test -n "$WORKER_URL"
          test -n "$WORKER_TOKEN"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          [[ "$AUDIO_URL" == https://* ]] || { echo "APPROVED VOICE GATE: a valid HTTPS URL for the manually uploaded/approved narration is required. Upload the voice first; rendering and scheduling are blocked."; exit 1; }
          test -n "${{ secrets.VECTEEZY_API_KEY }}"
          test -n "${{ secrets.VECTEEZY_ACCOUNT_ID }}"
          echo "Configuration validation passed."

      - name: Request production manifest
        env:
          WORKER_URL: ${{ vars.NEW_PRODUCTION_WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          set -euo pipefail
          jq -n \
            --arg content_id "$CONTENT_ID" \
            --arg brand_id "AI_TECH_LAB" \
            --arg platform "YouTube" \
            --arg language "english" \
            --arg title "$INPUT_TITLE" \
            --arg script "$INPUT_SCRIPT" \
            --arg audio_url "$AUDIO_URL" \
            --arg content_format "$CONTENT_FORMAT" \
            '{content_id:$content_id,brand_id:$brand_id,platform:$platform,language:$language,title:$title,script:$script,audio_url:$audio_url,content_format:$content_format}' \
            > work/production_request.json

          CODE=$(curl -sS --max-time 180 -o work/production_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $WORKER_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @work/production_request.json \
            "${WORKER_URL%/}/produce")

          if [ "$CODE" != "200" ]; then
            jq '{error,message,status}' work/production_response.json || true
            echo "Manifest request failed: HTTP $CODE"
            exit 1
          fi

          jq -e '.status == "production_ready" and (.production | type == "object")' \
            work/production_response.json >/dev/null
          jq '.production' work/production_response.json > work/production_manifest.json
          jq -e '.scenes | type == "array" and length > 0' \
            work/production_manifest.json >/dev/null

      - name: Prepare metadata and scene plan
        run: |
          set -euo pipefail
          jq -r '.seo.title // empty' work/production_manifest.json > work/manifest_title.txt
          jq -r '.seo.description // empty' work/production_manifest.json > work/manifest_description.txt

          TITLE=$(cat work/manifest_title.txt)
          DESCRIPTION=$(cat work/manifest_description.txt)
          [ -n "$TITLE" ] || TITLE="$INPUT_TITLE"
          [ -n "$DESCRIPTION" ] || DESCRIPTION="$INPUT_DESCRIPTION"

          printf '%s' "${TITLE:0:100}" > work/title.txt
          printf '%s' "${DESCRIPTION:0:4900}" > work/description.txt
          printf '%s' "$INPUT_SCRIPT" > work/script.txt

          if [ -n "$INPUT_TAGS" ]; then
            printf '%s' "$INPUT_TAGS" > work/tags.txt
          else
            jq -r '.seo.tags // [] | join(",")' work/production_manifest.json > work/tags.txt
          fi

          jq -r '.scenes[] | [
            (.scene // .id // 0 | tostring),
            (.start // 0 | tostring),
            (.end // 0 | tostring),
            (.duration // 0 | tostring),
            (.visual.type // "generated"),
            (.visual.query // .visual.description // .narration // ""),
            (.overlay.text // "")
          ] | @tsv' work/production_manifest.json > work/scenes.tsv

          test -s work/scenes.tsv

      - name: Fetch and validate approved narration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          set -euo pipefail
          [[ "$AUDIO_URL" == https://* ]] || { echo "Approved voice URL is missing; production is blocked."; exit 1; }
          curl -fLsS --retry 3 --retry-all-errors --max-time 180 "$AUDIO_URL" -o voice_input
          test -s voice_input
          ffprobe -v error voice_input
          ffmpeg -y -i voice_input -vn -ac 2 -ar 44100 -c:a pcm_s16le voice.wav
          test -s voice.wav
          .venv/bin/python - <<'PY'
          import json, subprocess
          from pathlib import Path
          source = subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","csv=p=0","voice.wav"],text=True).strip()
          seconds = float(source)
          if seconds < 30:
              raise SystemExit("Approved narration is too short for a long-form video.")
          report = {"approved_audio_url_supplied": True, "decoded": True, "duration_seconds": round(seconds,2),
                    "gate": "manual voice audio is required; no synthetic fallback is used during rendering"}
          Path("work/approved_voice_report.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report))
          PY

      - name: Discover and download Vecteezy footage
        env:
          VECTEEZY_API_KEY: ${{ secrets.VECTEEZY_API_KEY }}
          VECTEEZY_ACCOUNT_ID: ${{ secrets.VECTEEZY_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          cat > work/fetch_vecteezy.py <<'PY'
          import json, os, re, urllib.parse, urllib.request
          from pathlib import Path

          API_KEY = os.getenv("VECTEEZY_API_KEY", "").strip()
          ACCOUNT_ID = os.getenv("VECTEEZY_ACCOUNT_ID", "").strip()
          BASE = "https://api.vecteezy.com/v2"

          Path("assets").mkdir(exist_ok=True)
          Path("work/asset_sources.jsonl").write_text("", encoding="utf-8")

          if not API_KEY or not ACCOUNT_ID:
              raise SystemExit("Vecteezy credentials are required.")

          def api_get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {API_KEY}",
                      "Accept": "application/json",
                      "User-Agent": "AI-Tech-Lab-Renderer/1.0",
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.loads(response.read().decode("utf-8"))

          def resource_list(data):
              if isinstance(data, list):
                  return [x for x in data if isinstance(x, dict)]
              if isinstance(data, dict):
                  for key in ("resources", "data", "results", "items"):
                      if isinstance(data.get(key), list):
                          return [x for x in data[key] if isinstance(x, dict)]
              return []

          def resource_id(item):
              for key in ("id", "resource_id", "resourceId"):
                  if item.get(key) is not None:
                      return item[key]
              return None

          def find_url(obj):
              if isinstance(obj, dict):
                  for key in ("download_url", "downloadUrl", "signed_url", "signedUrl", "direct_download_url", "download_link", "downloadLink", "file_url", "fileUrl"):
                      value = obj.get(key)
                      if isinstance(value, str) and value.startswith("https://"):
                          return value
                  for value in obj.values():
                      found = find_url(value)
                      if found:
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = find_url(value)
                      if found:
                          return found
              return None

          def text_value(value):
              if isinstance(value, str):
                  return value.strip()
              if isinstance(value, (int, float)):
                  return str(value)
              if isinstance(value, dict):
                  for key in ("name", "full_name", "display_name", "username", "title", "label", "value"):
                      candidate = text_value(value.get(key))
                      if candidate:
                          return candidate
              return ""

          def find_value(obj, keys):
              wanted = {key.lower() for key in keys}
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key.lower() in wanted:
                          candidate = text_value(value)
                          if candidate:
                              return candidate
                  for value in obj.values():
                      candidate = find_value(value, wanted)
                      if candidate:
                          return candidate
              elif isinstance(obj, list):
                  for value in obj:
                      candidate = find_value(value, wanted)
                      if candidate:
                          return candidate
              return ""

          try:
              api_get(f"{BASE}/{ACCOUNT_ID}/account/info")
          except Exception as exc:
              raise SystemExit(f"Vecteezy account check failed: {str(exc)[:180]}")

          with open("work/scenes.tsv", encoding="utf-8") as source:
              rows = [line.rstrip("\n").split("\t") for line in source]

          downloaded = 0
          search_calls = 0
          download_calls = 0
          max_search_calls = 10
          max_downloads = 6
          max_download_calls = 6
          seen_queries = set()

          for row in rows:
              if len(row) < 7:
                  continue
              if (downloaded >= max_downloads or download_calls >= max_download_calls
                      or search_calls >= max_search_calls):
                  break

              scene, start, end, duration, kind, query, overlay = row[:7]
              scene = re.sub(r"[^a-zA-Z0-9_-]", "_", scene)[:80]
              query = re.sub(r"\s+", " ", query).strip()[:120]

              if len(query) < 3 or query.lower() in seen_queries:
                  continue
              seen_queries.add(query.lower())

              search_url = f"{BASE}/{ACCOUNT_ID}/resources?" + urllib.parse.urlencode({
                  "term": query,
                  "content_type": "video",
                  "page": 1,
                  "per_page": 5
              })

              try:
                  search_calls += 1
                  results = resource_list(api_get(search_url))
              except Exception as exc:
                  print(f"Vecteezy search failed for {scene}: {str(exc)[:120]}")
                  continue

              for item in results:
                  if downloaded >= max_downloads or download_calls >= max_download_calls:
                      break
                  rid = resource_id(item)
                  if rid is None:
                      continue
                  try:
                      download_calls += 1
                      details = api_get(
                          f"{BASE}/{ACCOUNT_ID}/resources/"
                          f"{urllib.parse.quote(str(rid), safe='')}/download"
                      )
                      combined = {"search_result": item, "download_response": details}
                      url = find_url(details)
                      if not url:
                          continue

                      # Free-tier stock requires attribution. Skip assets explicitly
                      # marked editorial-only or Pro/premium, and never guess a creator.
                      creator = find_value(combined, {
                          "creator_name", "author_name", "contributor_name", "artist_name",
                          "creator", "author", "contributor", "artist", "username", "byline"
                      })
                      source_url = find_value(combined, {
                          "source_url", "page_url", "resource_url", "permalink", "web_url", "url"
                      })
                      source_host = urllib.parse.urlparse(source_url or "").netloc.lower()
                      if not creator or not source_url or not source_host.endswith("vecteezy.com") or source_host.startswith("api."):
                          print(f"Skipping {rid}: creator/source attribution metadata is missing.")
                          continue
                      license_label = find_value(combined, {
                          "license_name", "license_type", "licence_name", "licence_type", "license", "licence"
                      })
                      license_lower = re.sub(r"\s+", " ", (license_label or "").strip().lower())
                      # Accept only a clear API license label; "free download" or
                      # an unknown/mixed label is not proof of a Free License.
                      explicitly_free = license_lower in {"free license", "free"}
                      if not explicitly_free or any(term in license_lower for term in ("editorial", "pro", "premium", "paid")):
                          print(f"Skipping {rid}: an explicit Free License was not verified; using original generated visuals.")
                          continue

                      req = urllib.request.Request(
                          url, headers={"User-Agent": "AI-Tech-Lab-Renderer/1.0"}
                      )
                      with urllib.request.urlopen(req, timeout=120) as response:
                          data = response.read()

                      if len(data) < 10000:
                          continue

                      target = Path(f"assets/scene_{scene}.mp4")
                      target.write_bytes(data)

                      metadata = {
                          "scene": scene,
                          "provider": "Vecteezy",
                          "asset_id": str(rid),
                          "query": query,
                          "creator": creator,
                          "source_url": source_url,
                          "license_label": license_label or "License label not supplied by API; review linked source",
                          "license_reference": "https://www.vecteezy.com/licensing-agreement"
                      }
                      with open("work/asset_sources.jsonl", "a", encoding="utf-8") as log:
                          log.write(json.dumps(metadata) + "\n")

                      downloaded += 1
                      print(f"Vecteezy clip downloaded for scene {scene}")
                      break
                  except Exception as exc:
                      print(f"Vecteezy download failed for {scene}: {str(exc)[:120]}")

          print(f"Vecteezy download endpoint calls: {download_calls}; clips saved: {downloaded}")
          print("Only assets permitted by the applicable license may be published.")
          PY

          .venv/bin/python work/fetch_vecteezy.py

      - name: Find additional free, topic-matched Wikimedia Commons footage
        run: |
          set -euo pipefail
          .venv/bin/python tools/fetch_free_video.py
          test -s work/commons_media_report.json
          cat work/commons_media_report.json

      - name: Add stock creator and license attribution
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          source_file = Path("work/asset_sources.jsonl")
          description_file = Path("work/description.txt")
          lines = source_file.read_text(encoding="utf-8").splitlines() if source_file.exists() else []
          credits, seen = [], set()
          for line in lines:
              try:
                  item = json.loads(line)
              except json.JSONDecodeError:
                  continue
              creator = str(item.get("creator") or "").strip()
              url = str(item.get("source_url") or "").strip()
              provider = str(item.get("provider") or "Stock media").strip()
              asset_title = str(item.get("asset_title") or "").strip()
              license_label = str(item.get("license_label") or "License details").strip()
              license_url = str(item.get("license_url") or "").strip()
              key = (provider, creator, url)
              if creator and url and key not in seen:
                  seen.add(key)
                  name = f" — {asset_title}" if asset_title else ""
                  credits.append(f"- {provider}{name} — {creator} | {license_label}: {url}")
                  if license_url:
                      credits.append(f"  License: {license_url}")
          base = description_file.read_text(encoding="utf-8").strip()
          if credits:
              attribution = "\n\nSTOCK MEDIA CREDITS & LICENSES\n" + "\n".join(credits)
              base = (base[:max(0, 4900-len(attribution))].rstrip() + attribution)[:4900]
              description_file.write_text(base, encoding="utf-8")
              print(f"Added {len(seen)} stock-media credit(s) with license references.")
          else:
              print("No stock footage was downloaded; the quality gate will prevent upload.")
          PY

      - name: Create original graphics
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import cv2

          Path("assets").mkdir(exist_ok=True)
          font = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          import re
          raw_title = Path("work/title.txt").read_text(encoding="utf-8").strip()
          topic = re.sub(r"\s+", " ", raw_title).upper()[:36] or "FUTURE TECHNOLOGY"
          labels = [
              topic, "INSIDE THE TECHNOLOGY", "HOW IT WORKS",
              "REAL-WORLD APPLICATIONS", "THE BIG PICTURE", "WHAT COMES NEXT"
          ]

          for i, label in enumerate(labels):
              img = Image.new("RGB", (1920, 1080), (5, 16 + i, 37 + i * 3))
              draw = ImageDraw.Draw(img)
              for x in range(0, 1920, 160):
                  draw.line((x, 0, x - 220, 1080), fill=(8, 50 + i, 83 + i), width=2)
              draw.rounded_rectangle((100, 110, 1820, 970), radius=32, outline=(0, 210, 245), width=4)
              draw.text((150, 180), label, font=ImageFont.truetype(font, 76), fill="white")
              draw.text((150, 300), "AI TECH LAB  |  2026", font=ImageFont.truetype(font, 35), fill=(0, 220, 255))
              img.save(f"assets/generated_{i+1}.png")

          fig, ax = plt.subplots(figsize=(12, 6))
          ax.plot(["Research", "Plan", "Act", "Review"], [1, 2, 3, 4], marker="o", linewidth=3)
          ax.set_title("Illustrative AI Agent Workflow (Not a Statistical Dataset)")
          ax.set_ylabel("Illustrative stage — not measured data")
          ax.grid(True, alpha=0.25)
          fig.tight_layout()
          fig.savefig("assets/agent_workflow.png", dpi=150)
          plt.close(fig)

          for path in Path("assets").glob("*.png"):
              image = cv2.imread(str(path))
              if image is None:
                  raise SystemExit(f"Image validation failed: {path}")
          print("Original visual assets validated.")
          PY

      - name: Generate only evidence-supported data charts
        run: |
          set -euo pipefail
          .venv/bin/python tools/make_evidence_charts.py
          test -s work/evidence_charts_report.json
          cat work/evidence_charts_report.json

      - name: Generate script-matched illustrated scenes
        run: |
          set -euo pipefail
          .venv/bin/python tools/generate_scene_art.py
          test "$(find assets -maxdepth 1 -name 'generated_scene_*.png' | wc -l)" -ge 4

      - name: Generate topic-matched 3D hero overlay
        run: |
          set -euo pipefail
          .venv/bin/python tools/make_3d_hero_overlay.py work/title.txt assets/ai_security_3d_hero.png
          if [ -f assets/ai_security_3d_hero.png ]; then
            test "$(identify -format '%wx%h' assets/ai_security_3d_hero.png)" = "720x720"
            echo "Transparent topic-matched 3D hero generated and validated."
          else
            echo "No topic-specific 3D hero is required for this title."
          fi

      - name: Render scenes
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import csv, os, re, subprocess
          from pathlib import Path

          def run(args):
              subprocess.run(args, check=True)

          def safe(value):
              return re.sub(r"[^a-zA-Z0-9_-]", "_", str(value))[:80]

          is_short = os.getenv("CONTENT_FORMAT", "LONG_VIDEO").upper() == "SHORT"
          width, height = (1080, 1920) if is_short else (1920, 1080)
          # Slightly vary digital camera framing by shot, then animate a restrained pan/roll.
          # The per-shot filter is built inside the scene loop to avoid shared framing.
          def shot_filter(i):
              shot_scale = 1.06 + (i % 4) * 0.015
              scaled_w, scaled_h = int(width * shot_scale), int(height * shot_scale)
              drift = -1 if i % 2 else 1
              roll = (0.0015 + (i % 3) * 0.0010) * drift
              return (
                  f"rotate='{roll}*sin(t*0.34)':c=black@0.0:ow=rotw(iw):oh=roth(ih),"
                  f"scale={scaled_w}:{scaled_h}:force_original_aspect_ratio=increase,"
                  f"crop={width}:{height}:x='(in_w-out_w)*(0.5+0.26*sin(t*0.58+{i}))':"
                  f"y='(in_h-out_h)*(0.5+0.18*cos(t*0.43+{i * 0.7}))',setsar=1"
              )

          with open("work/scenes.tsv", encoding="utf-8") as f:
              rows = list(csv.reader(f, delimiter="\t"))

          if not rows:
              raise SystemExit("No scenes found.")

          for i, row in enumerate(rows):
              if len(row) < 7:
                  continue
              scene = safe(row[0])
              try:
                  duration = max(3.0, min(float(row[3]), 35.0))
              except Exception:
                  duration = 8.0

              stock = Path(f"assets/scene_{scene}.mp4")
              target = Path(f"scenes/scene_{scene}.mp4")
              graphic = Path(f"assets/generated_scene_{scene}.png") if Path(f"assets/generated_scene_{scene}.png").exists() else Path(f"assets/generated_{(i % 6) + 1}.png")
              chart = Path(f"assets/evidence_chart_{(i % 4) + 1}.png")
              if chart.exists() and any(token in (row[4] + " " + row[5]).lower() for token in ("chart", "graph", "statistic", "data visualization", "evidence chart")):
                  graphic = chart

              resize = shot_filter(i)
              if stock.exists() and stock.stat().st_size > 10000:
                  run([
                      "ffmpeg", "-y", "-stream_loop", "-1", "-i", str(stock),
                      "-t", str(duration), "-vf",
                      f"{resize},eq=contrast=1.08:saturation=1.08,unsharp=5:5:0.45:3:3:0.0",
                      "-an", "-c:v", "libx264", "-preset", "veryfast",
                      "-crf", "23", "-pix_fmt", "yuv420p", str(target)
                  ])
              else:
                  run([
                      "ffmpeg", "-y", "-loop", "1", "-i", str(graphic),
                      "-t", str(duration), "-vf",
                      f"{resize},zoompan=z='min(zoom+0.0005,1.08)':x='iw/2-(iw/zoom/2)+sin(on/70)*20':y='ih/2-(ih/zoom/2)+cos(on/85)*12':d=1:s={width}x{height}:fps=30,eq=contrast=1.05:saturation=1.06",
                      "-an", "-c:v", "libx264", "-preset", "veryfast",
                      "-crf", "23", "-pix_fmt", "yuv420p", str(target)
                  ])

              if not target.exists() or target.stat().st_size < 1000:
                  raise SystemExit(f"Scene render failed: {scene}")

              # Add a restrained, topic-matched 3D hero to the opening scene only.
              # Original footage, narration, and later scenes remain untouched.
              if i == 0 and Path("assets/ai_security_3d_hero.png").exists():
                  temp_target = target.with_name(target.stem + "_3d.mp4")
                  run([
                      "ffmpeg", "-y", "-i", str(target), "-loop", "1", "-i", "assets/ai_security_3d_hero.png",
                      "-filter_complex",
                      "[1:v]format=rgba,scale=720:720[hero];[0:v][hero]overlay=x=W-w-90:y=H-h-90:shortest=1:format=auto,format=yuv420p[v]",
                      "-map", "[v]", "-map", "0:a?", "-c:v", "libx264", "-preset", "veryfast",
                      "-crf", "22", "-pix_fmt", "yuv420p", "-an", str(temp_target)
                  ])
                  temp_target.replace(target)
