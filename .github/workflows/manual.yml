      - name: QA rendered production
        run: |
          set -euo pipefail
          VIDEO="output/AI_TECH_LAB_${CONTENT_ID}.mp4"
          THUMBNAIL="output/thumbnail_${CONTENT_ID}.jpg"
          ffprobe -v error "$VIDEO"
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          SIZE=$(stat -c%s "$VIDEO")
          AUDIO_DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/voice_edited.wav)
          .venv/bin/python - "$CONTENT_FORMAT" "$DURATION" "$SIZE" "$AUDIO_DURATION" "$VIDEO" "$THUMBNAIL" <<'PY'
          import sys, json
          import cv2
          import numpy as np
          from pathlib import Path
          from PIL import Image

          fmt = sys.argv[1].upper()
          duration, size, audio_duration = float(sys.argv[2]), int(sys.argv[3]), float(sys.argv[4])
          video_path, thumb_path = sys.argv[5], sys.argv[6]
          if fmt == "SHORT":
              if not 20 <= duration <= 60:
                  raise SystemExit(f"Short QA failed: duration {duration:.2f}s is outside 20-60 seconds.")
          elif not 244 <= duration <= 364:
              raise SystemExit(f"Long QA failed: duration {duration:.2f}s is outside 4-6 minutes.")
          if size < 100000:
              raise SystemExit("QA failed: output video is too small.")
          if abs(duration - audio_duration - 4.0) > 1.5:
              raise SystemExit(f"QA failed: expected 4-second intro plus {audio_duration:.2f}s narration, got {duration:.2f}s total.")
          cap = cv2.VideoCapture(video_path)
          ok, frame = cap.read()
          width = int(cap.get(cv2.CAP_PROP_FRAME_WIDTH))
          height = int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
          fps = float(cap.get(cv2.CAP_PROP_FPS) or 0)
          if not ok or frame is None or width < 720 or height < 720 or fps <= 0:
              cap.release()
              raise SystemExit(f"OpenCV frame/dimensions/FPS QA failed: {width}x{height}, fps={fps}.")
          if fmt == "SHORT" and height <= width:
              cap.release()
              raise SystemExit(f"Short must be vertical, got {width}x{height}.")
          if fmt != "SHORT" and width <= height:
              cap.release()
              raise SystemExit(f"Long video must be landscape, got {width}x{height}.")
          # Sample the full timeline to catch black screens and near-static placeholder renders.
          sample_count = max(12, min(80, int(duration / 4.0)))
          gray_frames, brightness = [], []
          for sec in np.linspace(1.0, max(1.1, duration - 1.0), sample_count):
              cap.set(cv2.CAP_PROP_POS_MSEC, float(sec) * 1000.0)
              read_ok, sample = cap.read()
              if not read_ok or sample is None:
                  continue
              small = cv2.cvtColor(cv2.resize(sample, (64, 36)), cv2.COLOR_BGR2GRAY)
              gray_frames.append(small)
              brightness.append((float(np.mean(small)), float(np.std(small))))
          cap.release()
          if len(gray_frames) < 8:
              raise SystemExit(f"OpenCV visual QA failed: only {len(gray_frames)} sample frames decoded.")
          black_ratio = sum(1 for mean, std in brightness if mean < 4.0 and std < 2.0) / len(brightness)
          changes = [float(np.mean(cv2.absdiff(gray_frames[i-1], gray_frames[i]))) for i in range(1, len(gray_frames))]
          active_ratio = sum(1 for value in changes if value >= 0.8) / max(1, len(changes))
          mean_change = float(np.mean(changes)) if changes else 0.0
          if black_ratio > 0.55:
              raise SystemExit(f"OpenCV visual QA failed: {black_ratio:.0%} of sampled frames are almost black.")
          if active_ratio < 0.25:
              raise SystemExit(f"OpenCV visual QA failed: scene variation too low ({active_ratio:.0%} active sample transitions).")
          with Image.open(thumb_path) as im:
              if im.size != (1280, 720):
                  raise SystemExit(f"Thumbnail dimensions wrong: {im.size}.")
              im.verify()
          report = {"format":fmt,"resolution":f"{width}x{height}","duration_seconds":round(duration,2),
                    "narration_seconds":round(audio_duration,2),"file_bytes":size,
                    "sample_frames":len(gray_frames),"almost_black_frame_ratio":round(black_ratio,3),
                    "active_sample_transition_ratio":round(active_ratio,3),"mean_frame_difference":round(mean_change,3),
                    "thumbnail":"valid"}
          Path("work/opencv_visual_qa.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print("OpenCV visual QA passed:", json.dumps(report))
          PY


      - name: Verify narration, music, captions, and premium thumbnail assets
        run: |
          set -euo pipefail
          VIDEO="output/AI_TECH_LAB_${CONTENT_ID}.mp4"
          THUMBNAIL="output/thumbnail_${CONTENT_ID}.jpg"
