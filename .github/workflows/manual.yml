name: AI Assistant Renderer

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "Content ID to render"
        required: true
        type: string
      audio_url:
        description: "Temporary audio URL"
        required: false
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare
        run: |
          mkdir -p work
          mkdir -p output

      - name: Download voice
        if: ${{ inputs.audio_url != '' }}
        run: |
          curl -fL --retry 3 --retry-all-errors \
            -H "User-Agent: AI-Assistant-Factory" \
            "${{ inputs.audio_url }}" \
            -o voice.mp3

          ls -lh voice.mp3
          file voice.mp3
          ffprobe -v error voice.mp3

      - name: Render video
        run: |
          if [ -f voice.mp3 ]; then
            ffmpeg \
              -f lavfi \
              -i "color=c=0x050914:s=1920x1080:r=30" \
              -i voice.mp3 \
              -filter_complex "
              drawbox=x=0:y=0:w=1920:h=1080:color=0x07152f@1:t=fill,
              drawbox=x='mod(t*80,2200)-200':y=120:w=420:h=4:color=0x00d9ff@0.65:t=fill,
              drawbox=x='mod(t*55,2300)-300':y=850:w=520:h=3:color=0x7c3aed@0.55:t=fill,
              drawbox=x=120:y=180:w=1680:h=720:color=0x00d9ff@0.16:t=3,
              drawbox=x=180:y=240:w=1560:h=600:color=0x7c3aed@0.10:t=2,
              drawtext=text='AI TECH LAB':fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:fontsize=92:fontcolor=white:x=(w-text_w)/2:y=390,
              drawtext=text='AI • FUTURE TECHNOLOGY • INNOVATION':fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:fontsize=32:fontcolor=0x9be7ff:x=(w-text_w)/2:y=510,
              drawtext=text='CONTENT ID ${{ inputs.content_id }}':fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:fontsize=24:fontcolor=0x7c3aed:x=80:y=100,
              drawtext=text='AI ASSISTANT FACTORY':fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:fontsize=22:fontcolor=0x00d9ff:x=80:y=1010
              " \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 192k \
              -shortest \
              output/AI_TECH_LAB_${{ inputs.content_id }}.mp4
          else
            ffmpeg \
              -f lavfi \
              -i "color=c=0x050914:s=1920x1080:r=30" \
              -f lavfi \
              -i anullsrc=r=48000:cl=stereo \
              -t 10 \
              -c:v libx264 \
              -pix_fmt yuv420p \
              -c:a aac \
              output/AI_TECH_LAB_${{ inputs.content_id }}.mp4
          fi

      - name: Validate video
        run: |
          test -s output/AI_TECH_LAB_${{ inputs.content_id }}.mp4
          ffprobe -v error output/AI_TECH_LAB_${{ inputs.content_id }}.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ inputs.content_id }}
          path: output/AI_TECH_LAB_${{ inputs.content_id }}.mp4

      - name: Upload video to Supabase
        run: |
          curl -fL \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: video/mp4" \
            --data-binary "@output/AI_TECH_LAB_${{ inputs.content_id }}.mp4" \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/ai-assistant-audio/videos/AI_TECH_LAB/${{ inputs.content_id }}/video.mp4"

          echo "Video uploaded to Supabase successfully."
