name: AI Assistant Renderer

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "Content ID to render"
        required: true
        type: string
      audio_url:
        description: "Optional temporary audio URL"
        required: false
        type: string
      title:
        description: "SEO title"
        required: false
        type: string
      script:
        description: "Content script"
        required: true
        type: string
      description:
        description: "SEO description"
        required: false
        type: string
      tags:
        description: "Comma-separated SEO tags"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: renderer-${{ inputs.content_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CONTENT_ID: ${{ inputs.content_id }}
      INPUT_TITLE: ${{ inputs.title }}
      INPUT_SCRIPT: ${{ inputs.script }}
      INPUT_DESCRIPTION: ${{ inputs.description }}
      INPUT_TAGS: ${{ inputs.tags }}

    steps:
      - name: Install production tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq imagemagick python3 python3-pip
          mkdir -p work output scenes assets

      - name: Validate inputs and configuration
        env:
          WORKER_URL: ${{ vars.NEW_PRODUCTION_WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$CONTENT_ID" || {
            echo "Missing content_id"
            exit 1
          }

          test -n "$INPUT_SCRIPT" || {
            echo "Missing script"
            exit 1
          }

          test "${#INPUT_SCRIPT}" -ge 300 || {
            echo "Script must contain at least 300 characters"
            exit 1
          }

          test -n "$WORKER_URL" || {
            echo "NEW_PRODUCTION_WORKER_URL is missing"
            exit 1
          }

          test -n "$WORKER_TOKEN" || {
            echo "WORKER_AUTH_TOKEN is missing"
            exit 1
          }

          case "$CONTENT_ID" in
            *[!a-zA-Z0-9_-]*)
              echo "Invalid content_id characters"
              exit 1
              ;;
          esac

          echo "Input validation passed."

      - name: Request production manifest
        env:
          WORKER_URL: ${{ vars.NEW_PRODUCTION_WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          set -euo pipefail

          jq -n \
            --arg content_id "$CONTENT_ID" \
            --arg brand_id "AI_TECH_LAB" \
            --arg platform "YouTube" \
            --arg language "english" \
            --arg title "$INPUT_TITLE" \
            --arg script "$INPUT_SCRIPT" \
            --arg audio_url "$AUDIO_URL" \
            '{
              content_id: $content_id,
              brand_id: $brand_id,
              platform: $platform,
              language: $language,
              title: $title,
              script: $script,
              audio_url: $audio_url
            }' > production_request.json

          CODE=$(curl -sS --max-time 180 \
            -o production_response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $WORKER_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @production_request.json \
            "${WORKER_URL%/}/produce")

          if [ "$CODE" != "200" ]; then
            echo "Production Worker returned HTTP $CODE"
            jq '{error, message, status}' production_response.json || true
            exit 1
          fi

          jq -e '.status == "production_ready" and (.production | type == "object")' \
            production_response.json >/dev/null || {
              echo "Production Worker response does not match the expected schema."
              exit 1
            }

          jq '.production' production_response.json > production_manifest.json

          jq -e '.scenes | type == "array" and length > 0' \
            production_manifest.json >/dev/null || {
              echo "Manifest contains no scenes."
              exit 1
            }

          echo "Production manifest received."

      - name: Prepare SEO metadata and scene plan
        run: |
          set -euo pipefail

          jq -r '.seo.title // empty' production_manifest.json > work/manifest_title.txt
          jq -r '.seo.description // empty' production_manifest.json > work/manifest_description.txt

          TITLE=$(cat work/manifest_title.txt)
          DESCRIPTION=$(cat work/manifest_description.txt)

          [ -n "$TITLE" ] || TITLE="$INPUT_TITLE"
          [ -n "$DESCRIPTION" ] || DESCRIPTION="$INPUT_DESCRIPTION"

          printf '%s' "$TITLE" > work/title.txt
          printf '%s' "$DESCRIPTION" > work/description.txt
          printf '%s' "$INPUT_SCRIPT" > work/script.txt

          if [ -n "$INPUT_TAGS" ]; then
            printf '%s' "$INPUT_TAGS" > work/tags.txt
          else
            jq -r '.seo.tags // [] | join(",")' production_manifest.json > work/tags.txt
          fi

          jq -r '
            .scenes[] |
            [
              (.scene // .id // 0 | tostring),
              (.start // 0 | tostring),
              (.end // 0 | tostring),
              (.duration // 0 | tostring),
              (.visual.type // "generated"),
              (.visual.query // .visual.description // .narration // ""),
              (.overlay.text // "")
            ] | @tsv
          ' production_manifest.json > work/scenes.tsv

          test -s work/scenes.tsv
          echo "Scene plan prepared."

      - name: Download narration from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          VOICE_PATH="voices/AI_TECH_LAB/${CONTENT_ID}/chunk_1.mp3"

          jq -n --arg path "$VOICE_PATH" '{path: $path}' > work/voice_request.json

          SIGN_RESPONSE=$(curl -sS --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"expiresIn":3600}' \
            "${SUPABASE_URL%/}/storage/v1/object/sign/ai-assistant-audio/$VOICE_PATH")

          SIGNED_PATH=$(echo "$SIGN_RESPONSE" | jq -r '.signedURL // empty')

          if [ -z "$SIGNED_PATH" ]; then
            echo "No signed voice URL returned."
            jq '{statusCode, error, message}' <<< "$SIGN_RESPONSE" || true
            exit 1
          fi

          case "$SIGNED_PATH" in
            http://*|https://*) AUDIO_URL="$SIGNED_PATH" ;;
            /*) AUDIO_URL="${SUPABASE_URL%/}/storage/v1${SIGNED_PATH}" ;;
            *) AUDIO_URL="${SUPABASE_URL%/}/storage/v1/${SIGNED_PATH}" ;;
          esac

          curl -fLsS --retry 3 --retry-all-errors \
            "$AUDIO_URL" -o voice.mp3

          test -s voice.mp3
          ffprobe -v error voice.mp3

          echo "Narration downloaded successfully."

      - name: Discover licensed stock visuals
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail

          cat > work/fetch_visuals.py <<'PY'
          import json, os, re, subprocess, urllib.parse, urllib.request
          from pathlib import Path

          Path("assets").mkdir(exist_ok=True)
          Path("work/asset_sources.jsonl").write_text("", encoding="utf-8")

          pexels = os.getenv("PEXELS_API_KEY", "").strip()
          pixabay = os.getenv("PIXABAY_API_KEY", "").strip()

          def request_json(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def download(url, target):
              req = urllib.request.Request(
                  url, headers={"User-Agent": "AI-Assistant-Factory/1.0"}
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
              if len(data) < 1000:
                  raise ValueError("Asset too small")
              Path(target).write_bytes(data)

          def search(query):
              query = re.sub(r"[^a-zA-Z0-9 \-]", " ", query).strip()[:100]
              if len(query) < 3:
                  query = "technology innovation"

              if pexels:
                  url = "https://api.pexels.com/videos/search?" + urllib.parse.urlencode({
                      "query": query, "per_page": 5, "orientation": "landscape"
                  })
                  try:
                      data = request_json(url, {"Authorization": pexels})
                      for item in data.get("videos", []):
                          files = sorted(
                              item.get("video_files", []),
                              key=lambda f: (
                                  f.get("width", 0) < 1280,
                                  abs(f.get("width", 0) - 1920)
                              )
                          )
                          for f in files:
                              link = f.get("link", "")
                              if link.startswith("https://") and f.get("width", 0) >= 640:
                                  return link, {
                                      "provider": "Pexels",
                                      "page": item.get("url"),
                                      "asset_id": item.get("id"),
                                      "license_reference": "https://www.pexels.com/license/"
                                  }
                  except Exception as exc:
                      print("Pexels search unavailable:", str(exc)[:200])

              if pixabay:
                  url = "https://pixabay.com/api/videos/?" + urllib.parse.urlencode({
                      "key": pixabay, "q": query, "per_page": 5
                  })
                  try:
                      data = request_json(url)
                      for item in data.get("hits", []):
                          variants = item.get("videos", {})
                          for quality in ("large", "medium", "small", "tiny"):
                              link = variants.get(quality, {}).get("url")
                              if link and link.startswith("https://"):
                                  return link, {
                                      "provider": "Pixabay",
                                      "page": item.get("pageURL"),
                                      "asset_id": item.get("id"),
                                      "license_reference": "https://pixabay.com/service/license-summary/"
                                  }
                  except Exception as exc:
                      print("Pixabay search unavailable:", str(exc)[:200])

              return None, None

          rows = []
          with open("work/scenes.tsv", encoding="utf-8") as source:
              for line in source:
                  cols = line.rstrip("\n").split("\t")
                  if len(cols) < 7:
                      continue
                  scene, start, end, duration, kind, query, overlay = cols[:7]
                  scene = re.sub(r"[^a-zA-Z0-9_-]", "_", scene)
                  target = Path(f"assets/scene_{scene}.mp4")
                  metadata = None

                  if kind.lower() in ("stock", "video", "stock_video", "pexels", "pixabay"):
                      link, metadata = search(query)
                      if link:
                          try:
                              download(link, target)
                          except Exception as exc:
                              print("Asset download failed:", str(exc)[:200])
                              target.unlink(missing_ok=True)
                              metadata = None

                  if metadata:
                      row = {"scene": scene, **metadata, "query": query}
                      with open("work/asset_sources.jsonl", "a", encoding="utf-8") as log:
                          log.write(json.dumps(row, ensure_ascii=False) + "\n")
                      print(f"Scene {scene}: stock asset downloaded from {metadata['provider']}")
                  else:
                      print(f"Scene {scene}: original animated fallback will be used")
          PY

          python3 work/fetch_visuals.py

      - name: Generate scene videos and overlays
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import csv, json, re, subprocess
          from pathlib import Path

          def run(args):
              subprocess.run(args, check=True)

          def safe_name(value):
              return re.sub(r"[^a-zA-Z0-9_-]", "_", value)[:80]

          def duration_value(value):
              try:
                  return max(1.0, min(float(value), 120.0))
              except Exception:
                  return 8.0

          with open("work/scenes.tsv", encoding="utf-8") as f:
              scenes = list(csv.reader(f, delimiter="\t"))

          if not scenes:
              raise SystemExit("No scenes to render")

          for row in scenes:
              if len(row) < 7:
                  continue

              scene, start, end, duration, kind, query, overlay = row[:7]
              scene = safe_name(scene)
              duration = duration_value(duration)
              source = Path(f"assets/scene_{scene}.mp4")
              target = Path(f"scenes/scene_{scene}.mp4")

              overlay = re.sub(r"\s+", " ", overlay).strip()[:90]
              if not overlay:
                  overlay = query.strip()[:90] or "AI AND FUTURE TECHNOLOGY"

              # Escape drawtext text for FFmpeg filter syntax.
              escaped = (
                  overlay.replace("\\", "\\\\")
                         .replace(":", "\\:")
                         .replace("'", "\\'")
                         .replace("%", "\\%")
                         .replace(",", "\\,")
                         .replace("[", "\\[")
                         .replace("]", "\\]")
              )

              if source.exists() and source.stat().st_size > 1000:
                  run([
                      "ffmpeg", "-y", "-stream_loop", "-1", "-i", str(source),
                      "-t", str(duration),
                      "-vf",
                      "scale=1920:1080:force_original_aspect_ratio=increase,"
                      "crop=1920:1080,setsar=1,"
                      "drawbox=x=0:y=820:w=1920:h=260:color=black@0.48:t=fill,"
                      f"drawtext=text='{escaped}':fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:"
                      "fontsize=48:fontcolor=white:x=(w-text_w)/2:y=870",
                      "-an", "-c:v", "libx264", "-preset", "veryfast",
                      "-crf", "23", "-pix_fmt", "yuv420p", str(target)
                  ])
              else:
                  # Original motion graphics fallback; no third-party footage.
                  run([
                      "ffmpeg", "-y",
                      "-f", "lavfi", "-i", "color=c=0x07152f:s=1920x1080:r=30",
                      "-t", str(duration),
                      "-vf",
                      "drawbox=x=0:y=0:w=1920:h=1080:color=0x07152f@1:t=fill,"
                      "drawbox=x='mod(t*100,2200)-200':y=180:w=600:h=5:color=0x00d9ff@0.8:t=fill,"
                      "drawbox=x=110:y=120:w=1700:h=840:color=0x00d9ff@0.12:t=3,"
                      f"drawtext=text='{escaped}':fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:"
                      "fontsize=56:fontcolor=white:x=(w-text_w)/2:y=(h-text_h)/2,"
                      "drawtext=text='AI TECH LAB':fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:"
                      "fontsize=28:fontcolor=0x00d9ff:x=100:y=70",
                      "-an", "-c:v", "libx264", "-preset", "veryfast",
                      "-crf", "23", "-pix_fmt", "yuv420p", str(target)
                  ])

              if not target.exists() or target.stat().st_size < 1000:
                  raise SystemExit(f"Scene render failed: {scene}")

          with open("work/concat.txt", "w", encoding="utf-8") as out:
              for file in sorted(Path("scenes").glob("scene_*.mp4")):
                  out.write(f"file '{file.resolve()}'\n")

          if not Path("work/concat.txt").stat().st_size:
              raise SystemExit("No rendered scene files")
          PY

      - name: Combine scenes and generate approximate captions
        run: |
          set -euo pipefail

          ffmpeg -y -f concat -safe 0 -i work/concat.txt \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
            -an work/visual_track.mp4

          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          script = Path("work/script.txt").read_text(encoding="utf-8").split()
          if not script:
              raise SystemExit("Script is empty")

          duration = float(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1", "voice.mp3"
          ], text=True).strip())

          def stamp(seconds):
              millis = int((seconds % 1) * 1000)
              whole = int(seconds)
              return f"{whole//3600:02}:{(whole%3600)//60:02}:{whole%60:02},{millis:03}"

          words_per_caption = 8
          blocks = []
          chunks = [script[i:i+words_per_caption] for i in range(0, len(script), words_per_caption)]

          for index, words in enumerate(chunks):
              start = duration * index / len(chunks)
              end = duration * (index + 1) / len(chunks)
              blocks.append(
                  f"{index+1}\n{stamp(start)} --> {stamp(end)}\n{' '.join(words)}\n"
              )

          Path("work/captions.srt").write_text("\n".join(blocks), encoding="utf-8")
          PY

      - name: Render final video and thumbnail
        run: |
          set -euo pipefail

          AUDIO_DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 voice.mp3)

          ffmpeg -y \
            -i work/visual_track.mp4 \
            -i voice.mp3 \
            -filter_complex \
            "[0:v]subtitles=work/captions.srt:force_style='FontName=DejaVu Sans,FontSize=22,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Alignment=2,MarginV=55'[v]" \
            -map "[v]" -map 1:a \
            -t "$AUDIO_DURATION" \
            -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart \
            "output/AI_TECH_LAB_${CONTENT_ID}.mp4"

          TITLE=$(cat work/title.txt)
          SAFE_TITLE=$(printf '%s' "$TITLE" | cut -c1-55)

          convert -size 1280x720 gradient:'#050914-#151a3d' \
            -gravity center -font DejaVu-Sans-Bold -pointsize 56 \
            -fill white -stroke '#00d9ff' -strokewidth 1 \
            -annotate +0+0 "$SAFE_TITLE" \
            -gravity south -pointsize 30 -fill '#9be7ff' -stroke none \
            -annotate +0+45 "AI TECH LAB" \
            "output/thumbnail_${CONTENT_ID}.jpg"

          test -s "output/AI_TECH_LAB_${CONTENT_ID}.mp4"
          test -s "output/thumbnail_${CONTENT_ID}.jpg"

      - name: Validate rendered production
        run: |
          set -euo pipefail

          VIDEO="output/AI_TECH_LAB_${CONTENT_ID}.mp4"

          ffprobe -v error \
            -
