name: AI Assistant Renderer

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "Content ID to render"
        required: true
        type: string
      audio_url:
        description: "Temporary audio URL"
        required: false
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare
        run: |
          mkdir -p work
          mkdir -p output

      - name: Download voice
        run: |
          VOICE_PATH="voices/AI_TECH_LAB/${{ inputs.content_id }}/chunk_1.mp3"

          RESPONSE=$(curl -sS \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{"expiresIn":86400}' \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/sign/ai-assistant-audio/${VOICE_PATH}")

          echo "Supabase signed URL response:"
          echo "$RESPONSE"

          SIGNED_PATH=$(echo "$RESPONSE" | jq -r '.signedURL // empty')

          if [ -z "$SIGNED_PATH" ]; then
            echo "ERROR: Supabase did not return a signed URL."
            exit 1
          fi

          if [[ "$SIGNED_PATH" == /* ]]; then
            AUDIO_URL="${{ secrets.SUPABASE_URL }}${SIGNED_PATH}"
          else
            AUDIO_URL="$SIGNED_PATH"
          fi

          curl -fL --retry 3 --retry-all-errors \
            -H "User-Agent: AI-Assistant-Factory" \
            "$AUDIO_URL" \
            -o voice.mp3

          test -s voice.mp3

          ls -lh voice.mp3
          file voice.mp3
          ffprobe -v error voice.mp3

      - name: Render video
        run: |
          if [ -f voice.mp3 ]; then
            ffmpeg \
              -f lavfi \
              -i "color=c=0x050914:s=1920x1080:r=30" \
              -i voice.mp3 \
              -filter_complex "
              drawbox=x=0:y=0:w=1920:h=1080:color=0x07152f@1:t=fill,
              drawbox=x='mod(t*80,2200)-200':y=120:w=420:h=4:color=0x00d9ff@0.65:t=fill,
              drawbox=x='mod(t*55,2300)-300':y=850:w=520:h=3:color=0x7c3aed@0.55:t=fill,
              drawbox=x=120:y=180:w=1680:h=720:color=0x00d9ff@0.16:t=3,
              drawbox=x=180:y=240:w=1560:h=600:color=0x7c3aed@0.10:t=2,
              drawtext=text='AI TECH LAB':fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:fontsize=92:fontcolor=white:x=(w-text_w)/2:y=390,
              drawtext=text='AI • FUTURE TECHNOLOGY • INNOVATION':fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:fontsize=32:fontcolor=0x9be7ff:x=(w-text_w)/2:y=510,
              drawtext=text='CONTENT ID ${{ inputs.content_id }}':fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:fontsize=24:fontcolor=0x7c3aed:x=80:y=100,
              drawtext=text='AI ASSISTANT FACTORY':fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:fontsize=22:fontcolor=0x00d9ff:x=80:y=1010
              " \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 192k \
              -shortest \
              output/AI_TECH_LAB_${{ inputs.content_id }}.mp4
          else
            ffmpeg \
              -f lavfi \
              -i "color=c=0x050914:s=1920x1080:r=30" \
              -f lavfi \
              -i anullsrc=r=48000:cl=stereo \
              -t 10 \
              -c:v libx264 \
              -pix_fmt yuv420p \
              -c:a aac \
              output/AI_TECH_LAB_${{ inputs.content_id }}.mp4
          fi

      - name: Validate video
        run: |
          test -s output/AI_TECH_LAB_${{ inputs.content_id }}.mp4
          ffprobe -v error output/AI_TECH_LAB_${{ inputs.content_id }}.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ inputs.content_id }}
          path: output/AI_TECH_LAB_${{ inputs.content_id }}.mp4
          
      - name: Upload and schedule video on YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "Getting YouTube access token..."

          TOKEN_RESPONSE=$(curl -sS \
            -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=$YOUTUBE_CLIENT_ID" \
            --data-urlencode "client_secret=$YOUTUBE_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$YOUTUBE_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token)

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "YouTube access token generation failed."
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          echo "Access token received."

          VIDEO_FILE="output/AI_TECH_LAB_${{ inputs.content_id }}.mp4"

          if [ ! -s "$VIDEO_FILE" ]; then
            echo "Video file not found."
            exit 1
          fi

          echo "Calculating USA publish time..."

          PUBLISH_AT=$(node -e '
            const now = new Date();

            const parts = new Intl.DateTimeFormat("en-US", {
              timeZone: "America/New_York",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false
            }).formatToParts(now);

            const get = (type) => parts.find(p => p.type === type).value;

            let year = Number(get("year"));
            let month = Number(get("month"));
            let day = Number(get("day"));
            let hour = Number(get("hour"));

            if (hour === 24) hour = 0;

            const extraMinutes = Math.floor(Math.random() * 31);

            let target = new Date(
              Date.UTC(year, month - 1, day, 18, extraMinutes, 0)
            );

            if (target.getTime() <= now.getTime()) {
              target.setUTCDate(target.getUTCDate() + 1);
            }

            console.log(target.toISOString());
          ')

          echo "Scheduled publish time: $PUBLISH_AT"

          cat > youtube_metadata.json <<EOF
          {
            "snippet": {
              "title": "AI Tech Lab - AI & Future Technology - Content ${{ inputs.content_id }}",
              "description": "AI, artificial intelligence, future technology, latest AI trends and technology insights from AI Tech Lab.",
              "categoryId": "28"
            },
            "status": {
              "privacyStatus": "private",
              "publishAt": "$PUBLISH_AT",
              "selfDeclaredMadeForKids": false
            }
          }
          EOF

          echo "Starting YouTube resumable upload..."

          HEADERS_FILE="youtube_headers.txt"

          curl -sS -D "$HEADERS_FILE" \
            -o /dev/null \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -H "X-Upload-Content-Type: video/mp4" \
            -H "X-Upload-Content-Length: $(stat -c%s "$VIDEO_FILE")" \
            --data-binary @youtube_metadata.json \
            "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status"

          UPLOAD_URL=$(grep -i "^location:" "$HEADERS_FILE" | cut -d' ' -f2- | tr -d '\r')

          if [ -z "$UPLOAD_URL" ]; then
            echo "YouTube upload URL was not received."
            cat "$HEADERS_FILE"
            exit 1
          fi

          echo "Uploading video file..."

          UPLOAD_RESPONSE=$(curl -sS \
            -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: video/mp4" \
            --data-binary "@$VIDEO_FILE" \
            "$UPLOAD_URL")

          echo "$UPLOAD_RESPONSE" > youtube_upload_response.json

          VIDEO_ID=$(echo "$UPLOAD_RESPONSE" | jq -r '.id')

          if [ -z "$VIDEO_ID" ] || [ "$VIDEO_ID" = "null" ]; then
            echo "YouTube upload failed."
            cat youtube_upload_response.json
            exit 1
          fi

          echo "YouTube video uploaded successfully."
          echo "Video ID: $VIDEO_ID"
          echo "Privacy: PRIVATE"
          echo "Scheduled publish time: $PUBLISH_AT"
          
      - name: Upload video to Supabase
        run: |
          curl -sS \
            -X PUT \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: video/mp4" \
            --data-binary "@output/AI_TECH_LAB_${{ inputs.content_id }}.mp4" \
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/ai-assistant-audio/videos/AI_TECH_LAB/${{ inputs.content_id }}/video.mp4"

          echo "Video uploaded to Supabase successfully."
