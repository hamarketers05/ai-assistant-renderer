name: AI Assistant Renderer

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "Content ID"
        required: true
        type: string
      audio_url:
        description: "Legacy compatibility only; ignored. Kokoro generates the narration automatically."
        required: false
        type: string
      content_format:
        description: "AI Tech Lab video format"
        required: true
        type: choice
        options:
          - LONG_VIDEO
          - SHORT
        default: LONG_VIDEO
      stereo_output:
        description: "Required 3D format; the generated 3D file, not the 2D source, is uploaded and scheduled."
        required: false
        type: choice
        options:
          - SBS
          - TB
          - ANAGLYPH
        default: SBS
      title:
        description: "Video title"
        required: true
        type: string
      script:
        description: "Complete English video script"
        required: true
        type: string
      description:
        description: "YouTube description"
        required: false
        type: string
      tags:
        description: "Comma-separated YouTube tags"
        required: false
        type: string
      editorial_category:
        description: "AI Tech Lab seven-day US editorial category"
        required: false
        type: string
      publish_at:
        description: "Optional UTC publish time"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: renderer-${{ inputs.content_id }}
  cancel-in-progress: false

jobs:
  render:
    name: Render AI Tech Lab Video
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      CONTENT_ID: ${{ inputs.content_id }}
      CONTENT_FORMAT: ${{ inputs.content_format }}
      INPUT_TITLE: ${{ inputs.title }}
      INPUT_SCRIPT: ${{ inputs.script }}
      INPUT_DESCRIPTION: ${{ inputs.description }}
      INPUT_TAGS: ${{ inputs.tags }}
      INPUT_PUBLISH_AT: ${{ inputs.publish_at }}
      EDITORIAL_CATEGORY: ${{ inputs.editorial_category }}
      # ai_text_client.py verifies this exact trusted workflow run before using
      # the existing Cloudflare Workers AI fallback. Expose context job-wide so
      # every AI-backed stage—not just the final reviewer—can use the free fallback.
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install editing tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq imagemagick python3 python3-venv fonts-dejavu-core espeak-ng
          if sudo apt-get install -y rubberband-cli; then
            echo "Rubber Band is available for optional pitch shaping."
          else
            echo "Rubber Band unavailable; safely skipping optional pitch shaping."
          fi
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch
          .venv/bin/pip install numpy scipy pillow matplotlib opencv-python-headless pydub faster-whisper soundfile kokoro librosa==0.11.0
          # Faster-Whisper 1.2.1 still passes metadata_errors to av.open; PyAV 19 removed that argument.
          .venv/bin/pip install 'av<19'
          .venv/bin/python -c 'import av; major=int(av.__version__.split(".")[0]); assert major < 19, av.__version__; print("PyAV/Faster-Whisper compatibility confirmed:", av.__version__)'
          mkdir -p work output scenes assets

      - name: Validate configuration and Kokoro voice pipeline
        env:
          WORKER_URL: ${{ vars.NEW_PRODUCTION_WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          [[ "$CONTENT_ID" =~ ^[0-9]+$ ]] || { echo "Content ID must be numeric."; exit 1; }
          [[ "$CONTENT_FORMAT" == "LONG_VIDEO" || "$CONTENT_FORMAT" == "SHORT" ]] || { echo "Unsupported video format."; exit 1; }
          test -n "$INPUT_TITLE"
          test "${#INPUT_SCRIPT}" -ge 300
          SCRIPT_WORDS=$(python3 -c 'import re,sys; print(len(re.findall(r"\b[\w-]+\b", sys.argv[1])))' "$INPUT_SCRIPT")
          if [ "$CONTENT_FORMAT" = "LONG_VIDEO" ]; then
            if [ "$SCRIPT_WORDS" -lt 850 ] || [ "$SCRIPT_WORDS" -gt 1000 ]; then
              echo "SCRIPT LENGTH GATE BLOCKED: LONG_VIDEO requires 850-1000 spoken words (received $SCRIPT_WORDS); no narration or media jobs will run."
              exit 1
            fi
          else
            if [ "$SCRIPT_WORDS" -lt 100 ] || [ "$SCRIPT_WORDS" -gt 135 ]; then
              echo "SCRIPT LENGTH GATE BLOCKED: SHORT requires 100-135 spoken words (received $SCRIPT_WORDS); no narration or media jobs will run."
              exit 1
            fi
          fi
          echo "Preflight script word-count passed: $SCRIPT_WORDS words ($CONTENT_FORMAT)."
          test -n "$INPUT_PUBLISH_AT" || { echo "SCHEDULE GATE: publish_at is required; refusing an unscheduled/private-only upload."; exit 1; }
          python3 - "$INPUT_PUBLISH_AT" <<'PY'
          import sys
          from datetime import datetime, timezone, timedelta
          raw = sys.argv[1].strip()
          try:
              dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
          except ValueError:
              raise SystemExit("SCHEDULE GATE: publish_at must be ISO 8601 with a timezone.")
          if dt.tzinfo is None:
              raise SystemExit("SCHEDULE GATE: publish_at must include Z or a timezone offset.")
          if dt.astimezone(timezone.utc) <= datetime.now(timezone.utc) + timedelta(minutes=2):
              raise SystemExit("SCHEDULE GATE: publish_at must be at least 2 minutes in the future.")
          print("Future scheduled-publication time validated.")
          PY
          test -n "$WORKER_URL"
          test -n "$WORKER_TOKEN"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "${{ secrets.VECTEEZY_API_KEY }}"
          test -n "${{ secrets.VECTEEZY_ACCOUNT_ID }}"
          printf '%s' "$INPUT_SCRIPT" > work/script.txt
          echo "Configuration validation passed."

      - name: Generate, master and validate Kokoro narration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -s work/script.txt
          .venv/bin/python tools/generate_kokoro_voice.py --script work/script.txt --output work/kokoro_voice.wav --voice af_heart --speed 1.0
          test -s work/kokoro_voice.wav
          ffmpeg -y -i work/kokoro_voice.wav -af "highpass=f=75,lowpass=f=12000,acompressor=threshold=-18dB:ratio=2.0:attack=15:release=180,loudnorm=I=-16:TP=-1.5:LRA=9" -ar 44100 -ac 2 -c:a pcm_s16le voice.wav
          test -s voice.wav
          .venv/bin/python - <<'PY'
          import json, subprocess
          from pathlib import Path
          duration=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","csv=p=0","voice.wav"],text=True).strip())
          streams=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-of","json","voice.wav"],text=True))["streams"]
          audio=next((s for s in streams if s.get("codec_type")=="audio"),None)
          if not audio or int(audio.get("sample_rate",0))!=44100 or duration<30:
              raise SystemExit("Kokoro audio quality gate failed: missing audio, wrong sample rate, or narration shorter than 30 seconds.")
          report={"engine":"Kokoro-82M","voice":"af_heart","post_processing":["high-pass 75 Hz","low-pass 12 kHz","light compression","EBU loudness normalization"],"duration_seconds":round(duration,2),"sample_rate":44100,"manual_voice_approval_required":False,"quality_gate":"passed"}
          Path("work/kokoro_audio_quality.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report))
          PY
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          # Keep the lossless WAV locally for editing; store a compact MP3 hand-off.
          # Supabase Free limits individual uploads to 50 MB; this narration WAV is ~71 MB.
          ffmpeg -hide_banner -loglevel error -y -i voice.wav -vn -c:a libmp3lame -b:a 128k -ar 44100 -ac 2 work/kokoro_upload.mp3
          test -s work/kokoro_upload.mp3
          UPLOAD_BYTES=$(stat -c%s work/kokoro_upload.mp3)
          [ "$UPLOAD_BYTES" -lt $((20*1024*1024)) ] || { echo "Compressed Kokoro hand-off unexpectedly exceeds 20 MiB."; exit 1; }
          OBJECT_PATH="ai-tech-lab/$CONTENT_ID/kokoro.mp3"
          UPLOAD_CODE=$(curl -sS --retry 3 --retry-delay 2 --max-time 180 -X POST \
            -o work/kokoro_upload.json -w "%{http_code}" \
            "$SUPABASE_URL/storage/v1/object/ai-assistant-audio/$OBJECT_PATH" \
            -H "Authorization: Bearer $SUPABASE_KEY" -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: audio/mpeg" -H "x-upsert: true" --data-binary @work/kokoro_upload.mp3)
          if [ "$UPLOAD_CODE" != "200" ] && [ "$UPLOAD_CODE" != "201" ]; then
            echo "Supabase audio upload failed: HTTP $UPLOAD_CODE."
            jq '{statusCode,error,message}' work/kokoro_upload.json || cat work/kokoro_upload.json
            exit 1
          fi
          SIGN_CODE=$(curl -sS --retry 3 --retry-delay 2 --max-time 60 -X POST \
            -o work/kokoro_signed_url.json -w "%{http_code}" \
            "$SUPABASE_URL/storage/v1/object/sign/ai-assistant-audio/$OBJECT_PATH" \
            -H "Authorization: Bearer $SUPABASE_KEY" -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" --data '{"expiresIn":604800}')
          if [ "$SIGN_CODE" != "200" ]; then
            echo "Supabase signed URL creation failed: HTTP $SIGN_CODE."
            jq '{statusCode,error,message}' work/kokoro_signed_url.json || cat work/kokoro_signed_url.json
            exit 1
          fi
          SIGNED_PATH=$(jq -r '.signedURL // .signedUrl // empty' work/kokoro_signed_url.json)
          test -n "$SIGNED_PATH" || { echo "Could not create signed URL for Kokoro narration."; exit 1; }
          if [[ "$SIGNED_PATH" == https://* ]]; then
            AUDIO_URL="$SIGNED_PATH"
          elif [[ "$SIGNED_PATH" == /storage/v1/* ]]; then
            AUDIO_URL="${SUPABASE_URL%/}$SIGNED_PATH"
          else
            AUDIO_URL="${SUPABASE_URL%/}/storage/v1/${SIGNED_PATH#/}"
          fi
          [[ "$AUDIO_URL" == https://* ]] || { echo "Generated Kokoro audio URL is invalid."; exit 1; }
          echo "AUDIO_URL=$AUDIO_URL" >> "$GITHUB_ENV"
          echo "Kokoro narration generated, mastered, validated and stored; manual voice approval is not required."

      - name: Request production manifest
        env:
          WORKER_URL: ${{ vars.NEW_PRODUCTION_WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          jq -n \
            --arg content_id "$CONTENT_ID" \
            --arg brand_id "AI_TECH_LAB" \
            --arg platform "YouTube" \
            --arg language "english" \
            --arg title "$INPUT_TITLE" \
            --arg script "$INPUT_SCRIPT" \
            --arg audio_url "$AUDIO_URL" \
            --arg content_format "$CONTENT_FORMAT" \
            '{content_id:$content_id,brand_id:$brand_id,platform:$platform,language:$language,title:$title,script:$script,audio_url:$audio_url,content_format:$content_format}' \
            > work/production_request.json

          CODE=$(curl -sS --max-time 180 -o work/production_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $WORKER_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @work/production_request.json \
            "${WORKER_URL%/}/produce")

          if [ "$CODE" != "200" ]; then
            jq '{error,message,status}' work/production_response.json || true
            echo "Manifest request failed: HTTP $CODE"
            exit 1
          fi

          jq -e '.status == "production_ready" and (.production | type == "object")' \
            work/production_response.json >/dev/null
          jq '.production' work/production_response.json > work/production_manifest.json
          jq -e '.scenes | type == "array" and length > 0' \
            work/production_manifest.json >/dev/null

      - name: Prepare metadata and scene plan
        run: |
          set -euo pipefail
          jq -r '.seo.title // empty' work/production_manifest.json > work/manifest_title.txt
          jq -r '.seo.description // empty' work/production_manifest.json > work/manifest_description.txt

          TITLE=$(cat work/manifest_title.txt)
          # Preserve the research-backed description delivered through the existing D1
          # handoff. The production Worker may also return internal audio/storage URLs;
          # its description is fallback-only and will be sanitized by seo_metadata.py.
          DESCRIPTION="$INPUT_DESCRIPTION"
          [ -n "$TITLE" ] || TITLE="$INPUT_TITLE"
          [ -n "$DESCRIPTION" ] || DESCRIPTION="$(cat work/manifest_description.txt)"

          printf '%s' "${TITLE:0:100}" > work/title.txt
          printf '%s' "${DESCRIPTION:0:4900}" > work/description.txt
          printf '%s' "$INPUT_SCRIPT" > work/script.txt

          if [ -n "$INPUT_TAGS" ]; then
            printf '%s' "$INPUT_TAGS" > work/tags.txt
          else
            jq -r '.seo.tags // [] | join(",")' work/production_manifest.json > work/tags.txt
          fi

          jq -r '.scenes[] | [
            (.scene // .id // 0 | tostring),
            (.start // 0 | tostring),
            (.end // 0 | tostring),
            (.duration // 0 | tostring),
            (.visual.type // "generated"),
            (.visual.query // .visual.description // .narration // ""),
            (.overlay.text // "")
          ] | @tsv' work/production_manifest.json > work/scenes.tsv

          test -s work/scenes.tsv

      - name: Validate Kokoro narration before scene timing
        run: |
          set -euo pipefail
          test -s voice.wav
          test -s work/kokoro_tts_report.json
          test -s work/kokoro_audio_quality.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          tts=json.loads(Path("work/kokoro_tts_report.json").read_text(encoding="utf-8"))
          qa=json.loads(Path("work/kokoro_audio_quality.json").read_text(encoding="utf-8"))
          if tts.get("engine")!="Kokoro-82M" or qa.get("quality_gate")!="passed":
              raise SystemExit("Kokoro narration did not pass the automated audio gate.")
          print(json.dumps({"engine":tts["engine"],"voice":tts["voice"],"duration_seconds":qa["duration_seconds"],"manual_approval":False}))
          PY

      - name: Edit generated narration, add pauses and script cues, and generate captions
        run: |
          set -euo pipefail
          test -s voice.wav
          test -s work/script.txt
          .venv/bin/python tools/voice_editor.py
          test -s work/voice_edited.wav
          test -s work/captions.srt
          test -s work/voice_edit_report.json
          cat work/voice_edit_report.json
          .venv/bin/python - "$CONTENT_FORMAT" <<'PY'
          import json, sys
          from pathlib import Path
          fmt = sys.argv[1]
          report = json.loads(Path("work/voice_edit_report.json").read_text(encoding="utf-8"))
          duration = float(report.get("edited_duration_seconds") or 0)
          if fmt == "LONG_VIDEO":
              # Final assembly adds about four seconds of transition effects; leave enough
              # narration for the strict 300-364s final-master budget without rendering assets.
              if not 296 <= duration <= 360:
                  raise SystemExit(
                      f"DURATION GATE BLOCKED: edited LONG_VIDEO narration is {duration:.2f}s; "
                      "required 296-360s before final assembly. Increase/repair the script; no media render/upload."
                  )
          else:
              if not 20 <= duration <= 56:
                  raise SystemExit(
                      f"DURATION GATE BLOCKED: edited SHORT narration is {duration:.2f}s; "
                      "required 20-56s before final assembly. Correct the script; no media render/upload."
                  )
          print(f"Edited narration duration gate passed: {duration:.2f}s ({fmt}).")
          PY

      - name: Apply optional topic-aware Rubber Band pitch shaping
        run: |
          set -euo pipefail
          mkdir -p work
          if command -v rubberband >/dev/null 2>&1; then
            LOWER_TITLE=$(printf '%s %s' "$INPUT_TITLE" "$INPUT_SCRIPT" | tr '[:upper:]' '[:lower:]')
            if [[ "$LOWER_TITLE" =~ (security|risk|privacy|serious|safety) ]]; then
              PITCH="-0.12"
            elif [[ "$LOWER_TITLE" =~ (tool|launch|breakthrough|exciting|agent) ]]; then
              PITCH="0.12"
            else
              PITCH="0.05"
            fi
            if rubberband --pitch "$PITCH" work/voice_edited.wav work/voice_pitch.wav; then
              ORIGINAL_SECONDS=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/voice_edited.wav)
              PITCHED_SECONDS=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/voice_pitch.wav)
              .venv/bin/python - "$ORIGINAL_SECONDS" "$PITCHED_SECONDS" <<'PY'
          import sys
          a,b=map(float,sys.argv[1:])
          if abs(a-b)>0.5:
              raise SystemExit("Pitch stage changed narration duration unexpectedly.")
          PY
              mv work/voice_pitch.wav work/voice_edited.wav
              .venv/bin/python - "$PITCH" "$ORIGINAL_SECONDS" "$PITCHED_SECONDS" <<'PY'
          import json,sys
          from pathlib import Path
          pitch,original,pitched=sys.argv[1:]
          Path("work/rubberband_report.json").write_text(json.dumps({
              "status":"used","pitch_semitones":float(pitch),
              "original_duration_seconds":round(float(original),3),
              "pitched_duration_seconds":round(float(pitched),3),
              "duration_preserved":abs(float(original)-float(pitched))<=0.5,
          },indent=2)+"\n",encoding="utf-8")
          PY
              echo "Validated subtle topic-aware pitch shaping."
            else
              rm -f work/voice_pitch.wav
              printf '%s\n' '{"status":"skipped","reason":"Rubber Band command failed; unmodified voice retained."}' > work/rubberband_report.json
              echo "Rubber Band failed; retaining clean narration."
            fi
          else
            printf '%s\n' '{"status":"skipped","reason":"Rubber Band CLI unavailable on the free hosted runner; clean narration retained."}' > work/rubberband_report.json
            echo "Rubber Band unavailable; retaining clean narration."
          fi
          test -s work/rubberband_report.json


      - name: Build sentence-by-sentence visual direction
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test -s work/voice_word_timestamps.json
          VOICE_SECONDS=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/voice_edited.wav)
          if [ "$CONTENT_FORMAT" = "SHORT" ]; then MAX_SCENES=20; else MAX_SCENES=90; fi
          .venv/bin/python tools/scene_director.py --script work/script.txt --duration "$VOICE_SECONDS" --max-scenes "$MAX_SCENES" --timestamps work/voice_word_timestamps.json
          test -s work/scene_director_report.json
          cat work/scene_director_report.json
          jq -e '.exact_word_timing == true and .sequence_similarity >= 0.55 and .timestamp_word_count >= 5' work/scene_director_report.json >/dev/null
          if [ "$CONTENT_FORMAT" = "SHORT" ]; then
            jq -e '.planned_visual_scenes >= 8 and .planned_visual_scenes <= 30' work/scene_director_report.json >/dev/null
          else
            jq -e '.planned_visual_scenes >= 80 and .planned_visual_scenes <= 90' work/scene_director_report.json >/dev/null
          fi
          echo "Scene timing verified; long videos require 80–90 voice-aligned visual scenes."

      - name: Discover and download Vecteezy footage
        env:
          VECTEEZY_API_KEY: ${{ secrets.VECTEEZY_API_KEY }}
          VECTEEZY_ACCOUNT_ID: ${{ secrets.VECTEEZY_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          cat > work/fetch_vecteezy.py <<'PY'
          import json, os, re, subprocess, urllib.parse, urllib.request
          from pathlib import Path

          API_KEY = os.getenv("VECTEEZY_API_KEY", "").strip()
          ACCOUNT_ID = os.getenv("VECTEEZY_ACCOUNT_ID", "").strip()
          BASE = "https://api.vecteezy.com/v2"

          Path("assets").mkdir(exist_ok=True)
          Path("work/asset_sources.jsonl").write_text("", encoding="utf-8")

          if not API_KEY or not ACCOUNT_ID:
              raise SystemExit("Vecteezy credentials are required.")

          def api_get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {API_KEY}",
                      "Accept": "application/json",
                      "User-Agent": "AI-Tech-Lab-Renderer/1.0",
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.loads(response.read().decode("utf-8"))

          def resource_list(data):
              if isinstance(data, list):
                  return [x for x in data if isinstance(x, dict)]
              if isinstance(data, dict):
                  for key in ("resources", "data", "results", "items"):
                      if isinstance(data.get(key), list):
                          return [x for x in data[key] if isinstance(x, dict)]
              return []

          def resource_id(item):
              for key in ("id", "resource_id", "resourceId"):
                  if item.get(key) is not None:
                      return item[key]
              return None

          def find_url(obj):
              if isinstance(obj, dict):
                  for key in ("download_url", "downloadUrl", "signed_url", "signedUrl", "direct_download_url", "download_link", "downloadLink", "file_url", "fileUrl"):
                      value = obj.get(key)
                      if isinstance(value, str) and value.startswith("https://"):
                          return value
                  for value in obj.values():
                      found = find_url(value)
                      if found:
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = find_url(value)
                      if found:
                          return found
              return None

          def text_value(value):
              if isinstance(value, str):
                  return value.strip()
              if isinstance(value, (int, float)):
                  return str(value)
              if isinstance(value, dict):
                  for key in ("name", "full_name", "display_name", "username", "title", "label", "value"):
                      candidate = text_value(value.get(key))
                      if candidate:
                          return candidate
              return ""

          def find_value(obj, keys):
              wanted = {key.lower() for key in keys}
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key.lower() in wanted:
                          candidate = text_value(value)
                          if candidate:
                              return candidate
                  for value in obj.values():
                      candidate = find_value(value, wanted)
                      if candidate:
                          return candidate
              elif isinstance(obj, list):
                  for value in obj:
                      candidate = find_value(value, wanted)
                      if candidate:
                          return candidate
              return ""

          
          STOP_WORDS = set("the and for with from into that this these those then than have has had are was were can could will would should about after before your you our their they them its how what when where why which while explain explained latest trend news future technology artificial intelligence".split())
          GENERIC_MEDIA_TERMS = set("data information info sharing share tutorial training presentation slides overview introduction guide manual file files image images video media content platform service services device devices product products general basics basic digital technology system systems management example examples quality development using used use lab source sources health public epi series packaging education teaching course courses report reports".split())
          SPECIFIC_MEDIA_TERMS = set("chip chiplet silicon semiconductor semiconductors processor processors cpu gpu gpus accelerator accelerators nvidia maia inference megawatt megawatts server servers rack racks cooling electricity power silicon wafer wafer wafers circuit circuits transistor transistors network networking bandwidth memory motherboard".split())

          def significant_terms(text):
              terms = []
              for word in re.findall(r"[A-Za-z][A-Za-z0-9-]{2,}", str(text or "").lower()):
                  if word not in STOP_WORDS and word not in terms:
                      terms.append(word)
              return terms[:12]

          def semantic_terms(text):
              tokens = set(significant_terms(str(text or "").replace("-", " "))) - GENERIC_MEDIA_TERMS
              aliases = {
                  "microchip": {"chip", "processor"}, "microchips": {"chip", "processor"},
                  "cpu": {"processor"}, "gpu": {"processor", "accelerator"}, "gpus": {"processor", "accelerator"},
                  "silicon": {"chip", "semiconductor"}, "semiconductor": {"chip"}, "semiconductors": {"chip"},
                  "datacenter": {"data", "center", "server"}, "datacenters": {"data", "center", "server"},
                  "server": {"rack"}, "servers": {"rack"}, "rack": {"server"}, "racks": {"server"},
                  "chiplets": {"chiplet", "chip", "silicon"}, "processors": {"processor", "chip"},
                  "transistors": {"transistor", "chip"}, "circuits": {"circuit", "hardware"}
              }
              for token in list(tokens):
                  tokens.update(aliases.get(token, set()))
              return tokens - GENERIC_MEDIA_TERMS

          def relevance(query, title, description):
              # Generic catalogue words never count as evidence. Two distinctive matches are
              # required; one single-token match is allowed only for a specific hardware anchor.
              needed = semantic_terms(query)
              available = semantic_terms(str(title or "") + " " + str(description or ""))
              matching = sorted(needed & available)
              if len(matching) < 2 and not (set(matching) & SPECIFIC_MEDIA_TERMS):
                  return 0.0, matching
              score = len(matching) / max(1, len(needed))
              if len(matching) < 2:
                  score = min(score, 0.40)
              return round(score, 3), matching

          def focused_search_query(scene_text):
              lower = re.sub(r"\s+", " ", str(scene_text or "").lower())
              # Specific asset terms improve recall while keeping each choice grounded in the scene.
              if re.search(r"\b(chiplet|chiplets|silicon wafer|semiconductor fabrication|wafer fabrication)\b", lower):
                  return "semiconductor chip silicon"
              if re.search(r"\b(nvidia|gpu|gpus|graphics processor|accelerator)\b", lower):
                  return "GPU processor accelerator"
              if re.search(r"\b(data center|datacenter|server|servers|rack|racks)\b", lower):
                  return "data center server rack"
              if re.search(r"\b(megawatt|megawatts|kilowatt|electricity|cooling|energy|power budget)\b", lower):
                  return "data center power cooling"
              if re.search(r"\b(memory|networking|bandwidth|data movement|chip to chip)\b", lower):
                  return "data center networking memory"
              if re.search(r"\b(inference|throughput|latency|tokens|ai chip|maia|chip|processor|silicon)\b", lower):
                  return "AI chip processor"
              return ""

          try:
              account_info = api_get(f"{BASE}/{ACCOUNT_ID}/account/info")
          except Exception as exc:
              print(f"Vecteezy account check failed ({str(exc)[:120]}).")
              print("Skipping Vecteezy downloads; use the verified free-license Commons source instead.")
              raise SystemExit(0)

          plan_name = find_value(account_info, {
              "plan_name", "plan", "pricing_plan", "subscription_plan",
              "subscription_tier", "account_plan", "billing_plan", "tier", "account_type"
          })
          if "free" not in plan_name.lower():
              print("Vecteezy API plan was not positively identified as Free; no resource download endpoints will be called.")
              print("Skipping Vecteezy downloads to prevent unexpected charges.")
              raise SystemExit(0)
          print("Vecteezy Free plan explicitly confirmed; applying strict Free License, creator, source and relevance checks.")

          with open("work/scenes.tsv", encoding="utf-8") as source:
              rows = [line.rstrip("\n").split("\t") for line in source]

          downloaded = 0
          search_calls = 0
          download_calls = 0
          max_search_calls = 18
          # Vecteezy API Free plan permits 500 downloads/month: budget 10 per long video
          # and 6 per Short so one daily pair stays under 500 in a 31-day month.
          max_downloads = 6 if os.getenv("CONTENT_FORMAT", "LONG_VIDEO").strip().upper() == "SHORT" else 10
          max_download_calls = 24
          query_pages = {}

          for row in rows:
              if len(row) < 7:
                  continue
              if (downloaded >= max_downloads or download_calls >= max_download_calls
                      or search_calls >= max_search_calls):
                  break

              scene, start, end, duration, kind, raw_query, overlay = row[:7]
              scene = re.sub(r"[^a-zA-Z0-9_-]", "_", scene)[:80]
              scene_context = re.sub(r"\s+", " ", f"{raw_query} {overlay}").strip()[:400]
              query = focused_search_query(scene_context)

              # Do not search generic/abstract scenes for unrelated stock footage.
              if not query:
                  continue
              query_key = query.lower()
              page_number = query_pages.get(query_key, 0) + 1
              if page_number > 3:
                  continue
              query_pages[query_key] = page_number

              search_url = f"{BASE}/{ACCOUNT_ID}/resources?" + urllib.parse.urlencode({
                  "term": query,
                  "content_type": "video",
                  "page": page_number,
                  "per_page": 5
              })

              try:
                  search_calls += 1
                  results = resource_list(api_get(search_url))
              except Exception as exc:
                  print(f"Vecteezy search failed for {scene}: {str(exc)[:120]}")
                  continue

              for item in results:
                  if downloaded >= max_downloads or download_calls >= max_download_calls:
                      break
                  rid = resource_id(item)
                  if rid is None:
                      continue
                  asset_title = find_value(item, {"title", "name", "resource_title", "asset_title", "display_name"})
                  asset_description = find_value(item, {"description", "summary", "keywords", "tags", "category"})
                  relevance_score, matching_terms = relevance(query, asset_title, asset_description)
                  if not asset_title or relevance_score < 0.45 or len(matching_terms) < 2:
                      print(f"Skipping {rid}: weak/too-generic scene relevance ({relevance_score:.3f}); query={query!r}; title={asset_title!r}; matching={matching_terms}")
                      continue
                  try:
                      download_calls += 1
                      details = api_get(
                          f"{BASE}/{ACCOUNT_ID}/resources/"
                          f"{urllib.parse.quote(str(rid), safe='')}/download"
                      )
                      combined = {"search_result": item, "download_response": details}
                      url = find_url(details)
                      if not url:
                          continue

                      # Free-tier stock requires attribution. Skip assets explicitly
                      # marked editorial-only or Pro/premium, and never guess a creator.
                      creator = find_value(combined, {
                          "creator_name", "author_name", "contributor_name", "artist_name",
                          "creator", "author", "contributor", "artist", "username", "byline"
                      })
                      source_url = find_value(combined, {
                          "source_url", "page_url", "resource_url", "permalink", "web_url", "url"
                      })
                      source_host = urllib.parse.urlparse(source_url or "").netloc.lower()
                      if not creator or not source_url or not source_host.endswith("vecteezy.com") or source_host.startswith("api."):
                          print(f"Skipping {rid}: creator/source attribution metadata is missing.")
                          continue
                      license_label = find_value(combined, {
                          "license_name", "license_type", "licence_name", "licence_type", "license", "licence"
                      })
                      license_lower = re.sub(r"\s+", " ", (license_label or "").strip().lower())
                      # Accept only a clear API license label; "free download" or
                      # an unknown/mixed label is not proof of a Free License.
                      explicitly_free = license_lower in {"free license", "free"}
                      if not explicitly_free or any(term in license_lower for term in ("editorial", "pro", "premium", "paid")):
                          print(f"Skipping {rid}: an explicit Free License was not verified; using original generated visuals.")
                          continue

                      req = urllib.request.Request(
                          url, headers={"User-Agent": "AI-Tech-Lab-Renderer/1.0"}
                      )
                      with urllib.request.urlopen(req, timeout=120) as response:
                          data = response.read()

                      if len(data) < 10000:
                          continue

                      target = Path(f"assets/scene_{scene}.mp4")
                      target.write_bytes(data)
                      try:
                          probe = subprocess.run(
                              ["ffprobe", "-v", "error", "-select_streams", "v:0",
                               "-show_entries", "stream=width,height", "-of", "csv=s=x:p=0", str(target)],
                              capture_output=True, text=True, check=True, timeout=20
                          ).stdout.strip()
                          dims = probe.split("x")
                          if len(dims) != 2 or int(dims[0]) < 1920 or int(dims[1]) < 1080:
                              print(f"Skipping {rid}: native source is not Full HD ({probe or 'unknown dimensions'}).")
                              target.unlink(missing_ok=True)
                              continue
                          source_width, source_height = int(dims[0]), int(dims[1])
                      except Exception as exc:
                          target.unlink(missing_ok=True)
                          print(f"Skipping {rid}: source resolution could not be verified ({str(exc)[:100]}).")
                          continue

                      metadata = {
                          "scene": scene,
                          "provider": "Vecteezy",
                          "asset_id": str(rid),
                          "asset_title": asset_title,
                          "asset_description": asset_description[:300],
                          "relevance_score": relevance_score,
                          "matching_terms": matching_terms,
                          "query": query,
                          "creator": creator,
                          "source_url": source_url,
                          "license_label": license_label,
                          "license_reference": "https://www.vecteezy.com/licensing-agreement",
                          "commercial_use_allowed": True,
                          "commercial_use_basis": "Vecteezy API Free plan explicitly confirmed and exact Free License label accepted; linked source/creator retained.",
                          "asset_path": str(target),
                          "source_width": source_width,
                          "source_height": source_height,
                          "output_resolution": "1920x1080"
                      }
                      with open("work/asset_sources.jsonl", "a", encoding="utf-8") as log:
                          log.write(json.dumps(metadata) + "\n")

                      downloaded += 1
                      print(f"Vecteezy clip downloaded for scene {scene}; query={query!r}; relevance={relevance_score:.3f}")
                      break
                  except Exception as exc:
                      print(f"Vecteezy download failed for {scene}: {str(exc)[:120]}")

          print(f"Vecteezy download endpoint calls: {download_calls}; clips saved: {downloaded}")
          print("Only assets permitted by the applicable license may be published.")
          PY

          .venv/bin/python work/fetch_vecteezy.py

