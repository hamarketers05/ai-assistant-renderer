          if "-->" not in captions or len(captions.splitlines()) < 8:
              raise SystemExit("QA failed: captions are missing/too sparse.")
          print(json.dumps({"audio_video_streams":"pass","thumbnail":"1280x720 valid","captions":"present","music":"present"}))
          PY

