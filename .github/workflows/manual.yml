      - name: Require script-relevant licensed footage before upload
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json, re
          from pathlib import Path

          source_file = Path("work/asset_sources.jsonl")
          records = []
          if source_file.exists():
              for line in source_file.read_text(encoding="utf-8").splitlines():
                  try:
                      item = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  provider = str(item.get("provider") or "")
                  label = str(item.get("license_label") or "").lower()
                  license_url = str(item.get("license_url") or "").lower()
                  source_url = str(item.get("source_url") or "")
                  creator = str(item.get("creator") or "")
                  if not (provider and source_url.startswith("https://") and creator):
                      continue
                  if provider == "Vecteezy":
                      licensed = label.strip() in {"free", "free license"} and "vecteezy.com" in source_url.lower()
                  elif provider == "Wikimedia Commons":
                      licensed = bool(item.get("commercial_use_allowed")) and (
                          "creativecommons.org/licenses/by/" in license_url
                          or "creativecommons.org/licenses/by-sa/" in license_url
                          or "creativecommons.org/publicdomain/" in license_url
                          or "public domain" in label
                          or "cc0" in label
                          or "pd-usgov" in label
                      ) and not any(term in label + " " + license_url for term in ("by-nc", "by-nd", "noncommercial", "non-commercial"))
                  else:
                      licensed = False
                  scene = str(item.get("scene") or "")
                  rendered_scene = Path(f"scenes/scene_{scene}.mp4") if scene else None
                  if licensed and rendered_scene and rendered_scene.is_file() and rendered_scene.stat().st_size > 10000:
                      records.append(item)

          unique = {(str(x.get("provider")), str(x.get("scene"))) for x in records}
          scenes_with_motion = list(Path("scenes").glob("scene_*.mp4"))
          print(json.dumps({
              "verified_commercial_use_clips": len(unique),
              "rendered_scene_videos": len(scenes_with_motion),
              "providers": sorted({str(x.get("provider")) for x in records}),
              "license_audit": "pass" if len(unique) >= 4 else "blocked"
          }))
          if len(unique) < 4:
              raise SystemExit(
                  "UPLOAD BLOCKED: fewer than four scene-matched commercial-use clips with verified licenses "
                  "and attribution records. Do not publish a generated-card-only video."
              )
          PY

      - name: Check existing YouTube upload
        id: youtube_state
        env:
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          WORKER_URL: https://dark-sunset-a2a1.hamarketers05.workers.dev
        run: |
          set -euo pipefail
          jq -n --arg id "$CONTENT_ID" '{content_id:($id|tonumber)}' > work/state_request.json
          CODE=$(curl -sS --max-time 30 -o work/state.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $WORKER_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @work/state_request.json "$WORKER_URL/youtube/upload-state")
          if [ "$CODE" != "200" ]; then
            echo "Upload state check failed; upload blocked."
            exit 1
          fi
          echo "already_uploaded=$(jq -r '.already_uploaded // false' work/state.json)" >> "$GITHUB_OUTPUT"
          echo "video_id=$(jq -r '.video_id // empty' work/state.json)" >> "$GITHUB_OUTPUT"

      - name: Get YouTube access token
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        env:
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          WORKER_URL: https://dark-sunset-a2a1.hamarketers05.workers.dev
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 45 -o work/token.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $WORKER_AUTH_TOKEN" \
            -H "Content-Type: application/json" "$WORKER_URL/youtube/access-token")
          if [ "$CODE" != "200" ]; then
            jq '{ok,error,provider_error}' work/token.json || true
            exit 1
          fi
          TOKEN=$(jq -r '.access_token // empty' work/token.json)
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "YOUTUBE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          rm -f work/token.json

      - name: Prepare YouTube metadata and schedule
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          title = Path("work/title.txt").read_text(encoding="utf-8").strip()[:100]
          description = Path("work/description.txt").read_text(encoding="utf-8").strip()[:4900]
          # SEO stage has already curated the topic-specific tag list. Prefer it over
          # the initial generic D1 tags passed in INPUT_TAGS; fall back only if absent.
          tag_file = Path("work/tags.txt")
          if tag_file.is_file() and tag_file.read_text(encoding="utf-8").strip():
              tags = [x.strip() for x in tag_file.read_text(encoding="utf-8").split(",") if x.strip()]
          else:
              raw = os.getenv("INPUT_TAGS", "").strip()
              tags = [x.strip() for x in raw.split(",") if x.strip()]
          tags = tags[:30]
          while tags and sum(map(len, tags)) > 450:
              tags.pop()

          status = {"privacyStatus": "private"}
          requested = os.getenv("INPUT_PUBLISH_AT", "").strip()
          normalized = ""
          if requested:
              try:
                  dt = datetime.fromisoformat(requested.replace("Z", "+00:00"))
              except ValueError:
                  raise SystemExit("publish_at must be ISO 8601 with timezone.")
              if dt.tzinfo is None:
                  raise SystemExit("publish_at must include Z or a timezone offset.")
              dt = dt.astimezone(timezone.utc)
              if dt <= datetime.now(timezone.utc) + timedelta(minutes=2):
                  raise SystemExit("publish_at must be at least 2 minutes in the future.")
              normalized = dt.isoformat(timespec="seconds").replace("+00:00", "Z")
              status["publishAt"] = normalized

          Path("work/youtube_metadata.json").write_text(json.dumps({
              "snippet": {
                  "title": title, "description": description, "tags": tags,
                  "categoryId": "28", "defaultLanguage": "en"
              },
              "status": status
          }), encoding="utf-8")
          Path("work/publish_at_normalized.txt").write_text(normalized, encoding="utf-8")
          PY

      - name: Upload video using YouTube Data API
        id: youtube_upload
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        run: |
          set -euo pipefail
          VIDEO="output/AI_TECH_LAB_${CONTENT_ID}.mp4"
          SIZE=$(stat -c%s "$VIDEO")

          INIT_CODE=$(curl -sS --max-time 60 -D work/upload_headers.txt \
            -o work/upload_init.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $YOUTUBE_ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -H "X-Upload-Content-Type: video/mp4" \
            -H "X-Upload-Content-Length: $SIZE" \
            --data-binary @work/youtube_metadata.json \
            "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status")

          if [ "$INIT_CODE" != "200" ] && [ "$INIT_CODE" != "201" ]; then
            jq '{error:{code:.error.code,message:.error.message}}' work/upload_init.json || true
            exit 1
          fi

          LOCATION=$(grep -i '^location:' work/upload_headers.txt | tail -n 1 | sed 's/^[^:]*:[[:space:]]*//' | tr -d '\r')
          test -n "$LOCATION"

          UPLOAD_CODE=$(curl -sS --max-time 1200 -o work/upload_result.json -w "%{http_code}" \
            -X PUT -H "Authorization: Bearer $YOUTUBE_ACCESS_TOKEN" \
            -H "Content-Type: video/mp4" --data-binary @"$VIDEO" "$LOCATION")

          if [ "$UPLOAD_CODE" != "200" ] && [ "$UPLOAD_CODE" != "201" ]; then
            jq '{error:{code:.error.code,message:.error.message}}' work/upload_result.json || true
            exit 1
          fi

          VIDEO_ID=$(jq -r '.id // empty' work/upload_result.json)
          test -n "$VIDEO_ID"
          echo "video_id=$VIDEO_ID" >> "$GITHUB_OUTPUT"

      - name: Record uploaded video and schedule
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        env:
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          WORKER_URL: https://dark-sunset-a2a1.hamarketers05.workers.dev
        run: |
          set -euo pipefail
          VIDEO_ID="${{ steps.youtube_upload.outputs.video_id }}"
          PUBLISH_AT=$(cat work/publish_at_normalized.txt)
          jq -n --arg id "$CONTENT_ID" --arg video "$VIDEO_ID" --arg at "$PUBLISH_AT" \
            '{content_id:($id|tonumber),video_id:$video,publish_at:$at}' > work/upload_record.json

          CODE=$(curl -sS --max-time 45 -o work/upload_record_response.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $WORKER_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @work/upload_record.json "$WORKER_URL/youtube/upload-result")

          if [ "$CODE" != "200" ] || [ "$(jq -r '.ok // false' work/upload_record_response.json)" != "true" ]; then
            jq '{ok,error}' work/upload_record_response.json || true
            echo "Upload succeeded but recording failed; do not rerun blindly."
            exit 1
          fi

      - name: Set custom thumbnail
        if: steps.youtube_state.outputs.already_uploaded != 'true' && inputs.content_format != 'SHORT'
        run: |
          set -euo pipefail
          VIDEO_ID="${{ steps.youtube_upload.outputs.video_id }}"
          CODE=$(curl -sS --max-time 90 -o work/thumbnail_result.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $YOUTUBE_ACCESS_TOKEN" \
            -H "Content-Type: image/jpeg" \
            --data-binary @"output/thumbnail_${CONTENT_ID}.jpg" \
            "https://www.googleapis.com/upload/youtube/v3/thumbnails/set?videoId=$VIDEO_ID")
          if [ "$CODE" != "200" ]; then
            jq '{error:{code:.error.code,message:.error.message}}' work/thumbnail_result.json || true
            exit 1
          fi

      - name: Report existing upload
        if: steps.youtube_state.outputs.already_uploaded == 'true'
        run: |
          echo "Content $CONTENT_ID already has video ID ${{ steps.youtube_state.outputs.video_id }}."
          echo "Duplicate upload skipped. Do not delete the old scheduled video."
