      - name: Render scenes
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import csv, json, os, re, subprocess
          from pathlib import Path

          def run(args):
              subprocess.run(args, check=True)

          def safe(value):
              return re.sub(r"[^a-zA-Z0-9_-]", "_", str(value))[:80]

          is_short = os.getenv("CONTENT_FORMAT", "LONG_VIDEO").upper() == "SHORT"
          width, height = (1080, 1920) if is_short else (1920, 1080)
          # Slightly vary digital camera framing by shot, then animate a restrained pan/roll.
          # The per-shot filter is built inside the scene loop to avoid shared framing.
          def shot_filter(i):
              shot_scale = 1.06 + (i % 4) * 0.015
              scaled_w, scaled_h = int(width * shot_scale), int(height * shot_scale)
              drift = -1 if i % 2 else 1
              roll = (0.0015 + (i % 3) * 0.0010) * drift
              return (
                  f"rotate='{roll}*sin(t*0.34)':c=black@0.0:ow=rotw(0.005):oh=roth(0.005),"
                  f"scale={scaled_w}:{scaled_h}:force_original_aspect_ratio=increase,"
                  f"crop={width}:{height}:x='(in_w-out_w)*(0.5+0.26*sin(t*0.58+{i}))':"
                  f"y='(in_h-out_h)*(0.5+0.18*cos(t*0.43+{i * 0.7}))',setsar=1"
              )

          with open("work/scenes.tsv", encoding="utf-8") as f:
              rows = list(csv.reader(f, delimiter="\t"))

          if not rows:
              raise SystemExit("No scenes found.")

          chart_report = json.loads(Path("work/evidence_charts_report.json").read_text(encoding="utf-8"))
          chart_files = [Path(p) for p in (chart_report.get("charts_created") or []) if Path(p).is_file()]
          chart_details = {Path(item.get("path", "")).name: item for item in (chart_report.get("chart_details") or []) if isinstance(item, dict) and item.get("path")}
          overlay_report = json.loads(Path("work/chart_overlay_report.json").read_text(encoding="utf-8"))
          chart_overlay_map = {str(item.get("scene")): item for item in (overlay_report.get("chart_assignments") or []) if isinstance(item, dict) and item.get("scene")}
          used_chart_names = set()
          chart_uses = []
          rendered_asset_records = []
          if is_short:
              overlay_target_count = min(len(rows), min(10, max(4, round(len(rows) / 3))))
          else:
              overlay_target_count = min(len(rows), min(30, max(25, round(len(rows) / 3))))
          overlay_indices = {
              min(len(rows) - 1, (index * len(rows)) // overlay_target_count)
              for index in range(overlay_target_count)
          } if rows and overlay_target_count > 0 else set()
          stop_words = set("the and for with from into that this these those then than have has had are was were can could will would should about after before your you our their they them its how what when where why which while explain explained latest trend news future technology".split())

          def meaningful_terms(value):
              return {word for word in re.findall(r"[A-Za-z0-9]+", str(value).lower())
                      if word not in stop_words and (len(word) > 2 or word in {"ai", "gpu", "cpu", "us"})}

          def number_keys(value):
              keys = set()
              for item in re.findall(r"(?<![A-Za-z])\d[\d,]*(?:\.\d+)?%?(?![A-Za-z])", str(value)):
                  try:
                      keys.add(f"{float(item.replace(',', '').replace('%', '')):g}")
                  except ValueError:
                      pass
              return keys

          def chart_matches(scene_text, detail):
              reference = " ".join([str(detail.get("title") or ""), *[str(x) for x in (detail.get("labels") or [])]])
              shared = meaningful_terms(scene_text) & meaningful_terms(reference)
              value_match = bool(number_keys(scene_text) & number_keys(" ".join(str(x) for x in (detail.get("values") or []))))
              return len(shared) >= 2 or (len(shared) >= 1 and value_match)

          for i, row in enumerate(rows):
              if len(row) < 7:
                  continue
              scene = safe(row[0])
              try:
                  duration = max(0.8, min(float(row[3]), 35.0))
              except Exception:
                  raise SystemExit(f"Invalid duration in voice-aligned scene {scene}.")

              stock = Path(f"assets/scene_{scene}.mp4")
              target = Path(f"scenes/scene_{scene}.mp4")
              graphic = Path(f"assets/generated_scene_{scene}.png") if Path(f"assets/generated_scene_{scene}.png").exists() else Path(f"assets/generated_{(i % 6) + 1}.png")
              flux_graphic = Path(f"assets/flux_scene_{scene}.png")
              free_media_graphic = Path(f"assets/free_media_scene_{scene}.jpg")
              scene_text = " ".join(str(x) for x in row[4:7])
              chart_meta = chart_overlay_map.get(scene)
              chart_selected = bool(chart_meta)
              chart_name = str((chart_meta or {}).get("chart") or "")
              composite_overlay_path = Path(f"assets/composite_overlay_scene_{scene}.png")
              scene_overlay_path = Path(f"assets/scene_overlay_{scene}.png")
              chart_overlay_path = Path(f"assets/chart_overlay_scene_{scene}.png")
              should_apply_overlay = i in overlay_indices or chart_selected
              hud_overlay_applied = bool(should_apply_overlay and composite_overlay_path.is_file() and scene_overlay_path.is_file())
              chart_overlay_applied = bool(should_apply_overlay and chart_selected and composite_overlay_path.is_file() and chart_overlay_path.is_file())
              if chart_selected:
                  used_chart_names.add(chart_name)
                  chart_uses.append({
                      "scene": scene, "chart": chart_name,
                      "title": str(chart_meta.get("title") or ""),
                      "source_url": str(chart_meta.get("source_url") or ""),
                      "overlay_path": str(chart_meta.get("overlay_path") or "")
                  })

              resize = shot_filter(i)
              has_stock = stock.exists() and stock.stat().st_size > 10000
              has_flux = (not has_stock) and flux_graphic.is_file()
              has_external_image = (not has_stock) and (not has_flux) and free_media_graphic.is_file()
              if has_flux:
                  graphic = flux_graphic
              elif has_external_image:
                  graphic = free_media_graphic
              if has_stock:
                  overlay = composite_overlay_path
                  if overlay.is_file() and (hud_overlay_applied or chart_overlay_applied):
                      run([
                          "ffmpeg", "-y", "-stream_loop", "-1", "-i", str(stock),
                          "-loop", "1", "-framerate", "30", "-i", str(overlay),
                          "-t", str(duration), "-filter_complex",
                          f"[0:v]{resize},eq=contrast=1.10:saturation=1.10:gamma=1.015:brightness=0.004,colorbalance=rs=-0.018:gs=0.000:bs=0.018:rm=-0.008:gm=0.000:bm=0.008:rh=0.016:gh=0.004:bh=-0.014:pl=1,unsharp=5:5:0.45:3:3:0.0,vignette=PI/5,noise=alls=1.2:allf=t[base];[1:v]scale={width}:{height},format=rgba,fade=t=in:st=0:d=0.3:alpha=1[ov];[base][ov]overlay=0:0:shortest=1,format=yuv420p[v]",
                          "-map", "[v]", "-an", "-c:v", "libx264", "-preset", "veryfast",
                          "-crf", "23", "-pix_fmt", "yuv420p", str(target)
                      ])
                  else:
                      run([
                          "ffmpeg", "-y", "-stream_loop", "-1", "-i", str(stock),
                          "-t", str(duration), "-vf",
                          f"{resize},eq=contrast=1.10:saturation=1.10:gamma=1.015:brightness=0.004,colorbalance=rs=-0.018:gs=0.000:bs=0.018:rm=-0.008:gm=0.000:bm=0.008:rh=0.016:gh=0.004:bh=-0.014:pl=1,unsharp=5:5:0.45:3:3:0.0,vignette=PI/5,noise=alls=1.2:allf=t",
                          "-an", "-c:v", "libx264", "-preset", "veryfast",
                          "-crf", "23", "-pix_fmt", "yuv420p", str(target)
                      ])
              else:
                  run([
                      "ffmpeg", "-y", "-loop", "1", "-i", str(graphic),
                      "-t", str(duration), "-vf",
                      f"{resize},zoompan=z='min(zoom+0.0005,1.08)':x='iw/2-(iw/zoom/2)+sin(on/70)*20':y='ih/2-(ih/zoom/2)+cos(on/85)*12':d=1:s={width}x{height}:fps=30,eq=contrast=1.10:saturation=1.10:gamma=1.015:brightness=0.004,colorbalance=rs=-0.018:gs=0.000:bs=0.018:rm=-0.008:gm=0.000:bm=0.008:rh=0.016:gh=0.004:bh=-0.014:pl=1,unsharp=5:5:0.45:3:3:0.0,vignette=PI/5,noise=alls=1.2:allf=t",
                      "-an", "-c:v", "libx264", "-preset", "veryfast",
                      "-crf", "23", "-pix_fmt", "yuv420p", str(target)
                  ])

              # Apply transparent HUD composites to generated art, FLUX, downloads and charts alike.
              # Source-backed data graphics stay transparent overlays over the selected primary visual.
              if not has_stock:
                  overlay_to_apply = None
                  if hud_overlay_applied or chart_overlay_applied:
                      if composite_overlay_path.is_file():
                          overlay_to_apply = composite_overlay_path
                      elif chart_overlay_applied and chart_overlay_path.is_file():
                          overlay_to_apply = chart_overlay_path
                  if overlay_to_apply is not None:
                      temp_target = target.with_name(target.stem + "_overlay.mp4")
                      run([
                          "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                          "-i", str(target), "-loop", "1", "-framerate", "30", "-i", str(overlay_to_apply),
                          "-t", str(duration), "-filter_complex",
                          f"[0:v]setsar=1[base];[1:v]scale={width}:{height},format=rgba[ov];[base][ov]overlay=x=0:y=0:shortest=1,format=yuv420p[v]",
                          "-map", "[v]", "-an", "-c:v", "libx264", "-preset", "veryfast",
                          "-crf", "23", "-pix_fmt", "yuv420p", str(temp_target)
                      ])
                      temp_target.replace(target)

              if not target.exists() or target.stat().st_size < 1000:
                  raise SystemExit(f"Scene render failed: {scene}")

              primary_asset = stock if has_stock else (flux_graphic if has_flux else (free_media_graphic if has_external_image else graphic))
              rendered_asset_records.append({
                  "scene": scene,
                  "primary_asset": str(primary_asset),
                  "asset_type": "licensed_stock_broll" if has_stock else ("cloudflare_flux_image" if has_flux else ("free_commercial_image" if has_external_image else "python_pillow_scene")),
                  "evidence_chart": chart_name or None,
                  "flux_image_used": bool(has_flux),
                  "external_source_image_used": bool(has_external_image),
                  "hud_overlay_applied": hud_overlay_applied,
                  "chart_overlay_applied": chart_overlay_applied,
                  "color_grade": "FFmpeg cinematic contrast/teal-warm balance/soft grain",
                  "motion": "Ken Burns/slow drift on scene imagery",
              })

              # Add a restrained, topic-matched 3D hero to the opening scene only.
              # Original footage, narration, and later scenes remain untouched.
              if i == 0 and not chart_selected and Path("assets/ai_security_3d_hero.png").exists():
                  temp_target = target.with_name(target.stem + "_3d.mp4")
                  run([
                      "ffmpeg", "-y", "-i", str(target), "-loop", "1", "-i", "assets/ai_security_3d_hero.png",
                      "-filter_complex",
                      "[1:v]format=rgba,scale=720:720[hero];[0:v][hero]overlay=x=W-w-90:y=H-h-90:shortest=1:format=auto,format=yuv420p[v]",
                      "-map", "[v]", "-map", "0:a?", "-c:v", "libx264", "-preset", "veryfast",
                      "-crf", "22", "-pix_fmt", "yuv420p", "-an", str(temp_target)
                  ])
                  temp_target.replace(target)
                  print(f"Applied 3D hero overlay to opening scene {scene}.")

          Path("work/rendered_scene_assets_report.json").write_text(json.dumps({
              "status": "passed" if len(rendered_asset_records) == len([r for r in rows if len(r) >= 7]) else "partial",
              "rendered_scene_count": len(rendered_asset_records),
              "evidence_chart_files_generated": len(chart_files),
              "evidence_charts_used": len(chart_uses),
              "evidence_charts_unused": max(0, len(chart_files) - len(chart_uses)),
              "chart_overlay_applied_count": sum(1 for x in rendered_asset_records if x["chart_overlay_applied"]),
              "chart_uses": chart_uses,
              "licensed_stock_broll_scene_count": sum(1 for x in rendered_asset_records if x["asset_type"] == "licensed_stock_broll"),
              "cloudflare_flux_image_scene_count": sum(1 for x in rendered_asset_records if x["asset_type"] == "cloudflare_flux_image"),
              "external_source_image_scene_count": sum(1 for x in rendered_asset_records if x["asset_type"] == "free_commercial_image"),
              "python_pillow_scene_count": sum(1 for x in rendered_asset_records if x["asset_type"] == "python_pillow_scene"),
              "transparent_hud_overlay_applied_count": sum(1 for x in rendered_asset_records if x["hud_overlay_applied"]),
              "video_resolution": f"{width}x{height}",
              "chart_policy": "Data charts were composited as transparent overlays only; the selected image/video remains the primary scene.",
              "scenes": rendered_asset_records,
          }, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps({"rendered_scenes": len(rendered_asset_records), "charts_used": len(chart_uses), "flux_images_used": sum(1 for x in rendered_asset_records if x["asset_type"] == "cloudflare_flux_image"), "hud_overlays_applied": sum(1 for x in rendered_asset_records if x["hud_overlay_applied"])}))

          with open("work/concat.txt", "w", encoding="utf-8") as out:
              for row in rows:
                  if len(row) >= 7:
                      path = Path(f"scenes/scene_{safe(row[0])}.mp4")
                      if path.exists():
                          out.write(f"file '{path.resolve()}'\n")

          if not Path("work/concat.txt").stat().st_size:
              raise SystemExit("No rendered scene files.")
          print("Scene rendering completed.")
          PY

      - name: Generate original topic-aware background score
        run: |
          set -euo pipefail
          VOICE_SECONDS=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/voice_edited.wav)
          .venv/bin/python tools/generate_music.py --duration "$VOICE_SECONDS" --topic "$INPUT_TITLE $INPUT_SCRIPT" --output work/music.wav
          test -s work/music.wav
          test -s work/music_report.json

      - name: Improve SEO title, description, tags, sources and chapters
        run: |
          set -euo pipefail
          .venv/bin/python tools/seo_metadata.py
          test -s work/seo_report.json
          test -s work/title.txt
          test -s work/description.txt
          test -s work/tags.txt
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/seo_report.json").read_text(encoding="utf-8"))
          title = Path("work/title.txt").read_text(encoding="utf-8").strip()
          tags = Path("work/tags.txt").read_text(encoding="utf-8").strip()
          description = Path("work/description.txt").read_text(encoding="utf-8")
          if not title or len(title) > 100:
              raise SystemExit("SEO QA failed: title must be 1-100 characters.")
          if len(tags) > 500:
              raise SystemExit("SEO QA failed: YouTube tags exceed the 500-character limit.")
          if not description or len(description) > 5000:
              raise SystemExit("SEO QA failed: description must be 1-5000 characters.")
          print(json.dumps({"title": title, "tag_characters": len(tags),
                            "description_characters": len(description),
                            "source_count": report.get("source_url_count", 0)}))
          PY

      - name: Create AI Tech Lab branded intro and subscribe popup
        run: |
          set -euo pipefail
          .venv/bin/python tools/make_brand_assets.py --format "$CONTENT_FORMAT" --outdir assets
          test -s assets/ai_tech_lab_intro.png
          test -s assets/ai_tech_lab_subscribe.png
          test -s work/brand_assets_report.json

      - name: Assemble final video and thumbnail
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          AUDIO_DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 work/voice_edited.wav)
          TOTAL_DURATION=$(awk -v d="$AUDIO_DURATION" 'BEGIN { printf "%.3f", d + 4.0 }')
          .venv/bin/python tools/render_transitions.py --target-duration "$AUDIO_DURATION" --output work/visual_track.mp4
          test -s work/transitions_report.json
          cat work/transitions_report.json
          .venv/bin/python tools/make_transition_sfx.py --scenes work/scenes.tsv --voice-duration "$AUDIO_DURATION" --intro-seconds 4 --content-id "$CONTENT_ID" --output work/transition_sfx.wav
          test -s work/transition_sfx.wav
          test -s work/transition_sfx_report.json
          VIDEO="output/AI_TECH_LAB_${CONTENT_ID}.mp4"
          THUMBNAIL="output/thumbnail_${CONTENT_ID}.jpg"

          if [[ "$CONTENT_FORMAT" == "SHORT" ]]; then
            WIDTH=1080
            HEIGHT=1920
            VF="fps=30,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,subtitles=work/captions.srt:force_style='FontName=DejaVu Sans,FontSize=36,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginV=190',fade=t=in:st=0:d=0.35"
            CTA_WIDTH=760
            CTA_Y=1280
            BARS=""
          else
            WIDTH=1920
            HEIGHT=1080
            BARS=",drawbox=x=0:y=0:w=iw:h=131:color=black:t=fill,drawbox=x=0:y=949:w=iw:h=131:color=black:t=fill"
            VF="fps=30,scale=1920:1080,setsar=1${BARS},subtitles=work/captions.srt:force_style='FontName=DejaVu Sans,FontSize=22,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Shadow=1,Alignment=2,MarginV=170',fade=t=in:st=0:d=0.35"
            CTA_WIDTH=1180
            CTA_Y=650
          fi

          # Four-second animated original brand intro; narration starts immediately afterward.
          ffmpeg -y -loop 1 -framerate 30 -i assets/ai_tech_lab_intro.png \
            -t 4 -vf "scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=increase,crop=${WIDTH}:${HEIGHT},zoompan=z='min(zoom+0.0007,1.025)':d=1:s=${WIDTH}x${HEIGHT}:fps=30${BARS},fade=t=in:st=0:d=0.6,fade=t=out:st=3.4:d=0.5,format=yuv420p,setsar=1" \
            -an -c:v libx264 -r 30 -preset veryfast -crf 22 -pix_fmt yuv420p \
            -movflags +faststart work/intro.mp4

          # Captions remain synced to narration; the subscribe CTA appears at seconds 15-20 of the main segment.
          ffmpeg -y -i work/visual_track.mp4 \
            -loop 1 -framerate 30 -i assets/ai_tech_lab_subscribe.png \
            -filter_complex "[0:v]${VF}[base];[1:v]scale=${CTA_WIDTH}:-1,format=rgba,trim=duration=5,setpts=PTS-STARTPTS,fade=t=in:st=0:d=0.4:alpha=1,fade=t=out:st=4.5:d=0.4:alpha=1,setpts=PTS+15/TB[cta];[base][cta]overlay=(W-w)/2:${CTA_Y}:enable='between(t,15,20)'[v]" \
            -map "[v]" -t "$AUDIO_DURATION" \
            -an -c:v libx264 -r 30 -preset veryfast -crf 22 -pix_fmt yuv420p \
            -movflags +faststart work/content_video.mp4

          printf "file '%s'\nfile '%s'\n" \
            "$(realpath work/intro.mp4)" "$(realpath work/content_video.mp4)" > work/branded_concat.txt
          ffmpeg -y -f concat -safe 0 -i work/branded_concat.txt \
            -an -c:v libx264 -r 30 -preset veryfast -crf 22 -pix_fmt yuv420p \
            -movflags +faststart work/branded_visual.mp4

          # Original, generated background music is kept under narration using side-chain ducking.
          ffmpeg -y -i work/branded_visual.mp4 -i work/voice_edited.wav -stream_loop -1 -i work/music.wav -i work/transition_sfx.wav \
            -filter_complex "[1:a]adelay=4000|4000,asetpts=PTS-STARTPTS,asplit=2[voice_sc][voice_mix];[2:a]volume=0.62,apulsator=mode=sine:amount=0.75:width=1.5:hz=0.08,asetpts=PTS-STARTPTS[music];[3:a]volume=0.14,asetpts=PTS-STARTPTS[sfx];[music][sfx]amix=inputs=2:duration=longest:dropout_transition=0[bed];[bed][voice_sc]sidechaincompress=threshold=0.035:ratio=8:attack=20:release=700[ducked];[voice_mix][ducked]amix=inputs=2:duration=longest:dropout_transition=0,loudnorm=I=-14:TP=-1.0:LRA=11[a]" \
            -map 0:v:0 -map "[a]" -t "$TOTAL_DURATION" \
            -c:v copy -c:a aac -b:a 192k -movflags +faststart "$VIDEO"

          .venv/bin/python tools/groq_thumbnail_brief.py
          test -s work/thumbnail_brief.json
          .venv/bin/python tools/make_premium_thumbnail.py --title-file work/title.txt --brief-file work/thumbnail_brief.json --output "$THUMBNAIL"
          convert "$THUMBNAIL" -sharpen 0x0.7 -quality 94 "output/thumbnail_${CONTENT_ID}.processed.jpg"
          test -s "output/thumbnail_${CONTENT_ID}.processed.jpg"
          .venv/bin/python - "$THUMBNAIL" "output/thumbnail_${CONTENT_ID}.processed.jpg" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          from PIL import Image

          source, processed = map(Path, sys.argv[1:3])
          source_hash = hashlib.sha256(source.read_bytes()).hexdigest()
          processed_hash = hashlib.sha256(processed.read_bytes()).hexdigest()
          if source_hash == processed_hash:
              raise SystemExit("ImageMagick did not change the thumbnail bytes; tool application is unverified.")
          with Image.open(processed) as im:
              size = list(im.size)
              im.verify()
          if size != [1280, 720]:
              raise SystemExit(f"ImageMagick output dimensions are invalid: {size}")
          report = {
              "status": "used",
              "tool": "ImageMagick convert",
              "operation": "sharpen 0x0.7 and quality 94 JPEG finish",
              "input": str(source),
              "output": str(processed),
              "input_sha256": source_hash,
              "output_sha256": processed_hash,
              "dimensions": size,
              "output_changed": True,
          }
          Path("work/thumbnail_imagemagick_report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps({"status": report["status"], "dimensions": size, "output_changed": True}))
          PY
          mv "output/thumbnail_${CONTENT_ID}.processed.jpg" "$THUMBNAIL"
          test -s "$VIDEO"
          test -s "$THUMBNAIL"

      - name: Enforce Full-HD six-minute visual budget before QA and upload
        run: |
          set -euo pipefail
          .venv/bin/python tools/visual_budget.py --content-id "$CONTENT_ID" --format "$CONTENT_FORMAT" --video "output/AI_TECH_LAB_${CONTENT_ID}.mp4" --output work/visual_coverage_report.json
          test -s work/visual_coverage_report.json
          cat work/visual_coverage_report.json

      - name: QA rendered production
        run: |
          set -euo pipefail
          VIDEO="output/AI_TECH_LAB_${CONTENT_ID}.mp4"
          THUMBNAIL="output/thumbnail_${CONTENT_ID}.jpg"
          ffprobe -v error "$VIDEO"
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          SIZE=$(stat -c%s "$VIDEO")
          AUDIO_DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/voice_edited.wav)
          .venv/bin/python - "$CONTENT_FORMAT" "$DURATION" "$SIZE" "$AUDIO_DURATION" "$VIDEO" "$THUMBNAIL" <<'PY'
          import sys, json
          import cv2
          import numpy as np
          from pathlib import Path
          from PIL import Image

          fmt = sys.argv[1].upper()
          duration, size, audio_duration = float(sys.argv[2]), int(sys.argv[3]), float(sys.argv[4])
          video_path, thumb_path = sys.argv[5], sys.argv[6]
          if fmt == "SHORT":
              if not 20 <= duration <= 60:
                  raise SystemExit(f"Short QA failed: duration {duration:.2f}s is outside 20-60 seconds.")
          elif not 244 <= duration <= 364:
              raise SystemExit(f"Long QA failed: duration {duration:.2f}s is outside 4-6 minutes.")
          if size < 100000:
              raise SystemExit("QA failed: output video is too small.")
          scene_report = json.loads(Path("work/scene_director_report.json").read_text(encoding="utf-8"))
          transition_report = json.loads(Path("work/transitions_report.json").read_text(encoding="utf-8"))
          sfx_report = json.loads(Path("work/transition_sfx_report.json").read_text(encoding="utf-8"))
          reuse_report = json.loads(Path("work/asset_reuse_report.json").read_text(encoding="utf-8"))
          if scene_report.get("exact_word_timing") is not True or float(scene_report.get("sequence_similarity", 0)) < 0.55:
              raise SystemExit("QA failed: scenes are not aligned to the actual narration transcript.")
          minimum_scenes = min(90, max(12, int(audio_duration / 4.2))) if fmt != "SHORT" else min(20, max(8, int(audio_duration / 7.0)))
          if int(scene_report.get("planned_visual_scenes", 0)) < minimum_scenes:
              raise SystemExit(f"QA failed: only {scene_report.get('planned_visual_scenes')} scene-specific visuals; at least {minimum_scenes} required.")
          if abs(float(scene_report.get("voice_duration_seconds", 0)) - audio_duration) > 0.55:
              raise SystemExit("QA failed: scene plan duration does not match final edited narration.")
          if sfx_report.get("status") != "generated" or int(sfx_report.get("transition_count", -1)) != int(transition_report.get("scenes", 0))-1:
              raise SystemExit("QA failed: procedural transition SFX do not match rendered scene cuts.")
          if abs(float(transition_report.get("rendered_duration_seconds", 0)) - audio_duration) > 0.25 or float(transition_report.get("final_frame_padding_seconds", 1)) > 0.20:
              raise SystemExit("QA failed: visual timing drift or frozen-tail padding detected.")
          if reuse_report.get("status") != "validated" or reuse_report.get("previous_video_reuse") is not False or reuse_report.get("within_video_duplicates") is not False:
              raise SystemExit("QA failed: asset uniqueness/relevance gate is missing or failed.")
          if abs(duration - audio_duration - 4.0) > 1.5:
              raise SystemExit(f"QA failed: expected 4-second intro plus {audio_duration:.2f}s narration, got {duration:.2f}s total.")
          cap = cv2.VideoCapture(video_path)
          ok, frame = cap.read()
          width = int(cap.get(cv2.CAP_PROP_FRAME_WIDTH))
          height = int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
          fps = float(cap.get(cv2.CAP_PROP_FPS) or 0)
          if not ok or frame is None or width < 720 or height < 720 or fps <= 0:
              cap.release()
              raise SystemExit(f"OpenCV frame/dimensions/FPS QA failed: {width}x{height}, fps={fps}.")
          if fmt == "SHORT" and height <= width:
              cap.release()
              raise SystemExit(f"Short must be vertical, got {width}x{height}.")
          if fmt != "SHORT" and width <= height:
              cap.release()
              raise SystemExit(f"Long video must be landscape, got {width}x{height}.")
          # Sample the full timeline to catch black screens and near-static placeholder renders.
          sample_count = max(12, min(80, int(duration / 4.0)))
          gray_frames, brightness = [], []
          for sec in np.linspace(1.0, max(1.1, duration - 1.0), sample_count):
              cap.set(cv2.CAP_PROP_POS_MSEC, float(sec) * 1000.0)
              read_ok, sample = cap.read()
              if not read_ok or sample is None:
                  continue
              small = cv2.cvtColor(cv2.resize(sample, (64, 36)), cv2.COLOR_BGR2GRAY)
              gray_frames.append(small)
              brightness.append((float(np.mean(small)), float(np.std(small))))
          cap.release()
          if len(gray_frames) < 8:
              raise SystemExit(f"OpenCV visual QA failed: only {len(gray_frames)} sample frames decoded.")
          black_ratio = sum(1 for mean, std in brightness if mean < 4.0 and std < 2.0) / len(brightness)
          changes = [float(np.mean(cv2.absdiff(gray_frames[i-1], gray_frames[i]))) for i in range(1, len(gray_frames))]
          active_ratio = sum(1 for value in changes if value >= 0.8) / max(1, len(changes))
          mean_change = float(np.mean(changes)) if changes else 0.0
          if black_ratio > 0.55:
              raise SystemExit(f"OpenCV visual QA failed: {black_ratio:.0%} of sampled frames are almost black.")
          if active_ratio < 0.25:
              raise SystemExit(f"OpenCV visual QA failed: scene variation too low ({active_ratio:.0%} active sample transitions).")
          with Image.open(thumb_path) as im:
              if im.size != (1280, 720):
                  raise SystemExit(f"Thumbnail dimensions wrong: {im.size}.")
              im.verify()
          report = {"status":"passed","format":fmt,"resolution":f"{width}x{height}","duration_seconds":round(duration,2),
                    "narration_seconds":round(audio_duration,2),"file_bytes":size,
                    "sample_frames":len(gray_frames),"almost_black_frame_ratio":round(black_ratio,3),
                    "active_sample_transition_ratio":round(active_ratio,3),"mean_frame_difference":round(mean_change,3),
                    "thumbnail":"valid"}
          Path("work/opencv_visual_qa.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print("OpenCV visual QA passed:", json.dumps(report))
          PY


