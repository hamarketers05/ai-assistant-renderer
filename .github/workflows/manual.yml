          jq -e --arg id "$VIDEO_ID" '.items | length == 1 and .[0].id == $id' work/youtube_post_upload.json >/dev/null
          ACTUAL_TITLE=$(jq -r '.items[0].snippet.title // empty' work/youtube_post_upload.json)
          EXPECTED_TITLE=$(cat work/title.txt)
          test "$ACTUAL_TITLE" = "$EXPECTED_TITLE"
          PRIVACY=$(jq -r '.items[0].status.privacyStatus // empty' work/youtube_post_upload.json)
          test "$PRIVACY" = "private"
          EXPECTED_AT=$(cat work/publish_at_normalized.txt)
          ACTUAL_AT=$(jq -r '.items[0].status.publishAt // empty' work/youtube_post_upload.json)
          if [ -n "$EXPECTED_AT" ] && [ "$EXPECTED_AT" != "$ACTUAL_AT" ]; then
            echo "Scheduled time mismatch. Expected $EXPECTED_AT; API returned $ACTUAL_AT."
            exit 1
          fi
          jq -n --arg video_id "$VIDEO_ID" --arg title "$ACTUAL_TITLE" \
            --arg privacy_status "$PRIVACY" --arg publish_at "$ACTUAL_AT" \
            --arg url "https://www.youtube.com/watch?v=$VIDEO_ID" \
            '{verified:true,video_id:$video_id,title:$title,privacy_status:$privacy_status,publish_at:$publish_at,url:$url,check:"YouTube Data API v3 read-after-write"}' \
            > work/youtube_post_upload_review.json
          cat work/youtube_post_upload_review.json

      - name: Persist unique visual asset history after verified YouTube delivery
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          .venv/bin/python tools/asset_reuse_guard.py --mode persist --content-id "$CONTENT_ID"
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add learning/used_visual_assets.json
          if git diff --cached --quiet; then
            echo "No new visual assets to record."
          else
            git commit -m "Record unique visual assets after verified YouTube delivery"
            for attempt in 1 2 3; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "Unique visual asset history persisted."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Asset history could not be saved after retries; stop rather than losing deduplication state."
                exit 1
              fi
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort || true; exit 1; }
              sleep 2
            done
          fi

      - name: Save final delivery verification report
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-tech-lab-delivery-${{ inputs.content_id }}
          path: |
            work/youtube_post_upload_review.json
            work/video_review_report.json
            work/video_review_metrics.json
            work/thumbnail_brief.json
            work/asset_sources.jsonl
            work/asset_reuse_report.json
            work/scene_director_report.json
            work/transitions_report.json
            work/voice_word_timestamps.json
          if-no-files-found: error
          retention-days: 30

      - name: Report existing upload
        if: steps.youtube_state.outputs.already_uploaded == 'true'
        run: |
          echo "Content $CONTENT_ID already has video ID ${{ steps.youtube_state.outputs.video_id }}."
          echo "Duplicate upload skipped. Do not delete the old scheduled video."
      - name: Compile downstream mini-agent execution evidence
        if: always()
        env:
          ALREADY_UPLOADED: ${{ steps.youtube_state.outputs.already_uploaded }}
          EXISTING_VIDEO_ID: ${{ steps.youtube_state.outputs.video_id }}
          LEARNING_PERSISTENCE_STEP_OUTCOME: ${{ steps.learning_feedback.outcome }}
        run: |
          set -euo pipefail
          python3 tools/mini_agent_delivery_report.py

      - name: Save final mini-agent execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-tech-lab-mini-agents-${{ inputs.content_id }}
          path: |
            work/mini_agent_render_execution_report.json
            work/mini_agent_publish_execution_report.json
            work/mini_agent_learning_execution_report.json
            work/mini_agent_delivery_summary.json
            work/editing_tool_manifest.json
            work/video_review_report.json
            work/youtube_post_upload_review.json
          if-no-files-found: warn
          retention-days: 30
