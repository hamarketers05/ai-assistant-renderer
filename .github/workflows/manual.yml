name: AI Assistant Renderer

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "Content ID to render"
        required: true
        type: string
      audio_url:
        description: "Temporary audio URL"
        required: false
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare
        run: |
          mkdir -p work
          mkdir -p output

      - name: Download voice
        if: ${{ inputs.audio_url != '' }}
        run: |
          curl -L "${{ inputs.audio_url }}" -o voice.mp3
          test -s voice.mp3

      - name: Render video
        run: |
          if [ -f voice.mp3 ]; then
            ffmpeg \
              -f lavfi \
              -i color=c=black:s=1920x1080:r=30 \
              -i voice.mp3 \
              -c:v libx264 \
              -pix_fmt yuv420p \
              -c:a aac \
              -shortest \
              output/test.mp4
          else
            ffmpeg \
              -f lavfi \
              -i color=c=black:s=1920x1080:r=30 \
              -f lavfi \
              -i anullsrc=r=48000:cl=stereo \
              -t 10 \
              -c:v libx264 \
              -pix_fmt yuv420p \
              -c:a aac \
              -shortest \
              output/test.mp4
          fi

      - name: Validate video
        run: |
          test -s output/test.mp4
          ffprobe -v error output/test.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ inputs.content_id }}
          path: output/test.mp4
