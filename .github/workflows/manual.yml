name: AI Assistant Renderer

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "Content ID"
        required: true
        type: string
      audio_url:
        description: "Optional audio URL"
        required: false
        type: string
      title:
        description: "Video title"
        required: true
        type: string
      script:
        description: "Complete English video script"
        required: true
        type: string
      description:
        description: "YouTube description"
        required: false
        type: string
      tags:
        description: "Comma-separated YouTube tags"
        required: false
        type: string
      publish_at:
        description: "Optional UTC publish time, e.g. 2026-10-12T15:00:00Z. Empty keeps the video private."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: renderer-${{ inputs.content_id }}
  cancel-in-progress: false

jobs:
  render:
    name: Render AI Tech Lab Video
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CONTENT_ID: ${{ inputs.content_id }}
      INPUT_TITLE: ${{ inputs.title }}
      INPUT_SCRIPT: ${{ inputs.script }}
      INPUT_DESCRIPTION: ${{ inputs.description }}
      INPUT_TAGS: ${{ inputs.tags }}
      INPUT_PUBLISH_AT: ${{ inputs.publish_at }}

    steps:
      - name: Install rendering tools
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            jq \
            imagemagick \
            python3

          mkdir -p work output scenes assets

      - name: Validate configuration
        env:
          WORKER_URL: ${{ vars.NEW_PRODUCTION_WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          test -n "$CONTENT_ID" || {
            echo "ERROR: Content ID is missing."
            exit 1
          }

          case "$CONTENT_ID" in
            *[!a-zA-Z0-9_-]*)
              echo "ERROR: Content ID contains invalid characters."
              exit 1
              ;;
          esac

          test -n "$INPUT_TITLE" || {
            echo "ERROR: Video title is missing."
            exit 1
          }

          test -n "$INPUT_SCRIPT" || {
            echo "ERROR: Video script is missing."
            exit 1
          }

          test "${#INPUT_SCRIPT}" -ge 300 || {
            echo "ERROR: Script must contain at least 300 characters."
            exit 1
          }

          test -n "$WORKER_URL" || {
            echo "ERROR: NEW_PRODUCTION_WORKER_URL is missing."
            exit 1
          }

          test -n "$WORKER_TOKEN" || {
            echo "ERROR: WORKER_AUTH_TOKEN is missing."
            exit 1
          }

          test -n "$SUPABASE_URL" || {
            echo "ERROR: SUPABASE_URL is missing."
            exit 1
          }

          test -n "$SUPABASE_KEY" || {
            echo "ERROR: SUPABASE_SERVICE_ROLE_KEY is missing."
            exit 1
          }

          echo "Configuration validation passed."

      - name: Request production manifest
        env:
          WORKER_URL: ${{ vars.NEW_PRODUCTION_WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          set -euo pipefail

          jq -n \
            --arg content_id "$CONTENT_ID" \
            --arg brand_id "AI_TECH_LAB" \
            --arg platform "YouTube" \
            --arg language "english" \
            --arg title "$INPUT_TITLE" \
            --arg script "$INPUT_SCRIPT" \
            --arg audio_url "$AUDIO_URL" \
            '{
              content_id: $content_id,
              brand_id: $brand_id,
              platform: $platform,
              language: $language,
              title: $title,
              script: $script,
              audio_url: $audio_url
            }' > work/production_request.json

          CODE=$(curl -sS --max-time 180 \
            -o work/production_response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $WORKER_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @work/production_request.json \
            "${WORKER_URL%/}/produce")

          if [ "$CODE" != "200" ]; then
            echo "Production Worker returned HTTP $CODE"
            jq '{error, message, status}' \
              work/production_response.json || true
            exit 1
          fi

          jq -e \
            '.status == "production_ready" and
             (.production | type == "object")' \
            work/production_response.json >/dev/null || {
              echo "Unexpected production manifest response."
              exit 1
            }

          jq '.production' \
            work/production_response.json \
            > work/production_manifest.json

          jq -e \
            '.scenes | type == "array" and length > 0' \
            work/production_manifest.json >/dev/null || {
              echo "Manifest contains no scenes."
              exit 1
            }

          echo "Production manifest received."

      - name: Prepare video metadata and scene plan
        run: |
          set -euo pipefail

          jq -r '.seo.title // empty' \
            work/production_manifest.json > work/manifest_title.txt

          jq -r '.seo.description // empty' \
            work/production_manifest.json > work/manifest_description.txt

          TITLE=$(cat work/manifest_title.txt)
          DESCRIPTION=$(cat work/manifest_description.txt)

          [ -n "$TITLE" ] || TITLE="$INPUT_TITLE"
          [ -n "$DESCRIPTION" ] || DESCRIPTION="$INPUT_DESCRIPTION"

          printf '%s' "$TITLE" > work/title.txt
          printf '%s' "$DESCRIPTION" > work/description.txt
          printf '%s' "$INPUT_SCRIPT" > work/script.txt

          if [ -n "$INPUT_TAGS" ]; then
            printf '%s' "$INPUT_TAGS" > work/tags.txt
          else
            jq -r '.seo.tags // [] | join(",")' \
              work/production_manifest.json > work/tags.txt
          fi

          jq -r '
            .scenes[] |
            [
              (.scene // .id // 0 | tostring),
              (.start // 0 | tostring),
              (.end // 0 | tostring),
              (.duration // 0 | tostring),
              (.visual.type // "generated"),
              (.visual.query // .visual.description // .narration // ""),
              (.overlay.text // "")
            ] | @tsv
          ' work/production_manifest.json > work/scenes.tsv

          test -s work/scenes.tsv

          echo "Video metadata and scene plan prepared."

      - name: Download voice-over from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          set -euo pipefail

          if [ -n "$AUDIO_URL" ]; then
            echo "Downloading supplied audio URL."

            curl -fLsS --retry 3 --retry-all-errors \
              --max-time 180 "$AUDIO_URL" -o voice.mp3
          else
            VOICE_PATH="voices/AI_TECH_LAB/${CONTENT_ID}/chunk_1.mp3"

            SIGN_RESPONSE=$(curl -sS --max-time 60 \
              -X POST \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              --data '{"expiresIn":3600}' \
              "${SUPABASE_URL%/}/storage/v1/object/sign/ai-assistant-audio/${VOICE_PATH}")

            SIGNED_PATH=$(echo "$SIGN_RESPONSE" |
              jq -r '.signedURL // empty')

            if [ -z "$SIGNED_PATH" ]; then
              echo "Could not create signed voice URL."
              jq '{statusCode, error, message}' \
                <<< "$SIGN_RESPONSE" || true
              exit 1
            fi

            case "$SIGNED_PATH" in
              http://*|https://*)
                DOWNLOAD_URL="$SIGNED_PATH"
                ;;
              /*)
                DOWNLOAD_URL="${SUPABASE_URL%/}/storage/v1${SIGNED_PATH}"
                ;;
              *)
                DOWNLOAD_URL="${SUPABASE_URL%/}/storage/v1/${SIGNED_PATH}"
                ;;
            esac

            curl -fLsS --retry 3 --retry-all-errors \
              --max-time 180 "$DOWNLOAD_URL" -o voice.mp3
          fi

          test -s voice.mp3
          ffprobe -v error voice.mp3

          echo "Voice-over downloaded successfully."

      - name: Discover and download Vecteezy stock videos
        env:
          VECTEEZY_API_KEY: ${{ secrets.VECTEEZY_API_KEY }}
          VECTEEZY_ACCOUNT_ID: ${{ secrets.VECTEEZY_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          cat > work/fetch_vecteezy.py <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API_KEY = os.getenv("VECTEEZY_API_KEY", "").strip()
          ACCOUNT_ID = os.getenv("VECTEEZY_ACCOUNT_ID", "").strip()
          BASE = "https://api.vecteezy.com/v2"

          Path("assets").mkdir(exist_ok=True)
          Path("work/asset_sources.jsonl").write_text("", encoding="utf-8")

          if not API_KEY or not ACCOUNT_ID:
              print("Vecteezy credentials unavailable.")
              print("All scenes will use original generated visuals.")
              raise SystemExit(0)

          def api_get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {API_KEY}",
                      "Accept": "application/json",
                      "User-Agent": "AI-Tech-Lab-Renderer/1.0",
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.loads(response.read().decode("utf-8"))

          def get_resource_id(item):
              if not isinstance(item, dict):
                  return None
              for key in ("id", "resource_id", "resourceId"):
                  if item.get(key) is not None:
                      return item[key]
              return None

          def find_download_url(obj):
              if isinstance(obj, dict):
                  for key in (
                      "download_url", "downloadUrl",
                      "signed_url", "signedUrl"
                  ):
                      value = obj.get(key)
                      if isinstance(value, str) and value.startswith("https://"):
                          return value

                  for value in obj.values():
                      found = find_download_url(value)
                      if found:
                          return found

              elif isinstance(obj, list):
                  for value in obj:
                      found = find_download_url(value)
                      if found:
                          return found

              elif isinstance(obj, str):
                  if obj.startswith("https://"):
                      return obj

              return None

          def resources_from(data):
              if isinstance(data, list):
                  return [x for x in data if isinstance(x, dict)]

              if isinstance(data, dict):
                  for key in ("resources", "data", "results", "items"):
                      value = data.get(key)
                      if isinstance(value, list):
                          return [x for x in value if isinstance(x, dict)]

              return []

          try:
              api_get(f"{BASE}/{ACCOUNT_ID}/account/info")
              print("Vecteezy account endpoint is accessible.")
          except Exception as exc:
              print("Vecteezy account check failed:", str(exc)[:200])
              print("Generated visuals will be used where needed.")
              raise SystemExit(0)

          with open("work/scenes.tsv", encoding="utf-8") as source:
              rows = [
                  line.rstrip("\n").split("\t")
                  for line in source
              ]

          downloaded = 0
          max_downloads = 8

          for row in rows:
              if len(row) < 7:
                  continue

              scene, start, end, duration, kind, query, overlay = row[:7]
              scene = re.sub(r"[^a-zA-Z0-9_-]", "_", scene)[:80]
              kind = kind.lower().strip()

              if kind not in ("stock", "video", "stock_video", "vecteezy"):
                  continue

              if downloaded >= max_downloads:
                  print("Per-run stock download limit reached.")
                  break

              query = re.sub(r"\s+", " ", query).strip()[:120]
              if len(query) < 3:
                  continue

              search_url = (
                  f"{BASE}/{ACCOUNT_ID}/resources?"
                  + urllib.parse.urlencode({
                      "term": query,
                      "content_type": "video",
                      "page": 1,
                      "per_page": 5,
                  })
              )

              try:
                  results = resources_from(api_get(search_url))
              except Exception as exc:
                  print(f"Search failed for scene {scene}: {str(exc)[:150]}")
                  continue

              for item in results:
                  resource_id = get_resource_id(item)
                  if resource_id is None:
                      continue

                  try:
                      download_info = api_get(
                          f"{BASE}/{ACCOUNT_ID}/resources/"
                          f"{urllib.parse.quote(str(resource_id), safe='')}/download"
                      )

                      url = find_download_url(download_info)
                      if not url:
                          continue

                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "AI-Tech-Lab-Renderer/1.0"},
                      )

                      with urllib.request.urlopen(request, timeout=120) as response:
                          data = response.read()

                      if len(data) < 1000:
                          continue

                      target = Path(f"assets/scene_{scene}.mp4")
                      target.write_bytes(data)

                      metadata = {
                          "scene": scene,
                          "provider": "Vecteezy",
                          "asset_id": str(resource_id),
                          "query": query,
                          "license_reference":
                              "https://www.vecteezy.com/licensing-agreement",
                      }

                      with open(
                          "work/asset_sources.jsonl",
                          "a",
                          encoding="utf-8",
                      ) as log:
                          log.write(json.dumps(metadata) + "\n")

                      downloaded += 1
                      print(f"Downloaded Vecteezy video for scene {scene}.")
                      break

                  except Exception as exc:
                      print(
                          f"Download failed for scene {scene}: "
                          f"{str(exc)[:150]}"
                      )

          print(f"Vecteezy downloads this run: {downloaded}")
          print("Scenes without stock videos will use generated visuals.")
          PY

          python3 work/fetch_vecteezy.py

      - name: Render scene videos and overlays
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import csv
          import re
          import subprocess
          from pathlib import Path

          def run(args):
              subprocess.run(args, check=True)

          def safe_name(value):
              return re.sub(r"[^a-zA-Z0-9_-]", "_", value)[:80]

          def scene_duration(value):
              try:
                  return max(1.0, min(float(value), 120.0))
              except Exception:
                  return 8.0

          with open("work/scenes.tsv", encoding="utf-8") as source:
              rows = list(csv.reader(source, delimiter="\t"))

          if not rows:
              raise SystemExit("No scenes available.")

          for row in rows:
              if len(row) < 7:
                  continue

              scene, start, end, duration, kind, query, overlay = row[:7]
              scene = safe_name(scene)
              duration = scene_duration(duration)

              source_video = Path(f"assets/scene_{scene}.mp4")
              target = Path(f"scenes/scene_{scene}.mp4")

              text = re.sub(r"\s+", " ", overlay).strip()[:90]
              if not text:
                  text = query.strip()[:90] or "AI AND FUTURE TECHNOLOGY"

              text = (
                  text.replace("\\", "\\\\")
                      .replace(":", "\\:")
                      .replace("'", "\\'")
                      .replace("%", "\\%")
                      .replace(",", "\\,")
                      .replace("[", "\\[")
                      .replace("]", "\\]")
              )

              if source_video.exists() and source_video.stat().st_size > 1000:
                  video_filter = (
                      "scale=1920:1080:force_original_aspect_ratio=increase,"
                      "crop=1920:1080,setsar=1,"
                      "drawbox=x=0:y=820:w=1920:h=260:"
                      "color=black@0.48:t=fill,"
                      f"drawtext=text='{text}':"
                      "fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:"
                      "fontsize=48:fontcolor=white:"
                      "x=(w-text_w)/2:y=870"
                  )

                  run([
                      "ffmpeg", "-y",
                      "-stream_loop", "-1",
                      "-i", str(source_video),
                      "-t", str(duration),
                      "-vf", video_filter,
                      "-an",
                      "-c:v", "libx264",
                      "-preset", "veryfast",
                      "-crf", "23",
                      "-pix_fmt", "yuv420p",
                      str(target),
                  ])

              else:
                  video_filter = (
                      "drawbox=x='mod(t*100,2200)-200':y=180:"
                      "w=600:h=5:color=0x00d9ff@0.8:t=fill,"
                      "drawbox=x=110:y=120:w=1700:h=840:"
                      "color=0x00d9ff@0.12:t=3,"
                      f"drawtext=text='{text}':"
                      "fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:"
                      "fontsize=56:fontcolor=white:"
                      "x=(w-text_w)/2:y=(h-text_h)/2,"
                      "drawtext=text='AI TECH LAB':"
                      "fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:"
                      "fontsize=28:fontcolor=0x00d9ff:x=100:y=70"
                  )

                  run([
                      "ffmpeg", "-y",
                      "-f", "lavfi",
                      "-i", "color=c=0x07152f:s=1920x1080:r=30",
                      "-t", str(duration),
                      "-vf", video_filter,
                      "-an",
                      "-c:v", "libx264",
                      "-preset", "veryfast",
                      "-crf", "23",
                      "-pix_fmt", "yuv420p",
                      str(target),
                  ])

              if not target.exists() or target.stat().st_size < 1000:
                  raise SystemExit(f"Scene render failed: {scene}")

          # Preserve the manifest's scene order.
          with open("work/concat.txt", "w", encoding="utf-8") as output:
              for row in rows:
                  if len(row) < 7:
                      continue
                  scene = safe_name(row[0])
                  target = Path(f"scenes/scene_{scene}.mp4")
                  if target.exists():
                      output.write(f"file '{target.resolve()}'\n")

          if not Path("work/concat.txt").stat().st_size:
              raise SystemExit("No scene videos were rendered.")

          print("Scene rendering completed.")
          PY

      - name: Combine scenes and generate captions
        run: |
          set -euo pipefail

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i work/concat.txt \
            -an \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            work/visual_track.mp4

          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          words = Path("work/script.txt").read_text(
              encoding="utf-8"
          ).split()

          if not words:
              raise SystemExit("Script is empty.")

          result = subprocess.check_output([
              "ffprobe",
              "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              "voice.mp3",
          ], text=True)

          duration = float(result.strip())

          def stamp(seconds):
              milliseconds = int(round((seconds % 1) * 1000))
              whole = int(seconds)
              if milliseconds == 1000:
                  whole += 1
                  milliseconds = 0
              return (
                  f"{whole//3600:02}:"
                  f"{(whole%3600)//60:02}:"
                  f"{whole%60:02},{milliseconds:03}"
              )

          chunk_size = 8
          chunks = [
              words[index:index + chunk_size]
              for index in range(0, len(words), chunk_size)
          ]

          captions = []
          for index, chunk in enumerate(chunks):
              start = duration * index / len(chunks)
              end = duration * (index + 1) / len(chunks)

              captions.append(
                  f"{index + 1}\n"
                  f"{stamp(start)} --> {stamp(end)}\n"
                  f"{' '.join(chunk)}\n"
              )

          Path("work/captions.srt").write_text(
              "\n".join(captions),
              encoding="utf-8",
          )

          print("Caption file generated.")
          PY

      - name: Render final video and thumbnail
        run: |
          set -euo pipefail

          VIDEO="output/AI_TECH_LAB_${CONTENT_ID}.mp4"
          THUMBNAIL="output/thumbnail_${CONTENT_ID}.jpg"

          AUDIO_DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 voice.mp3)

          ffmpeg -y \
            -i work/visual_track.mp4 \
            -i voice.mp3 \
            -filter_complex \
            "[0:v]subtitles=work/captions.srt:force_style='FontName=DejaVu Sans,FontSize=22,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Alignment=2,MarginV=55'[v]" \
            -map "[v]" \
            -map 1:a \
            -t "$AUDIO_DURATION" \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            "$VIDEO"

          SAFE_TITLE=$(cat work/title.txt | cut -c1-55)

          convert \
            -size 1280x720 \
            gradient:'#050914-#151a3d' \
            -gravity center \
            -font DejaVu-Sans-Bold \
            -pointsize 56 \
            -fill white \
            -stroke '#00d9ff' \
            -strokewidth 1 \
            -annotate +0+0 "$SAFE_TITLE" \
            -gravity south \
            -pointsize 30 \
            -fill '#9be7ff' \
            -stroke none \
            -annotate +0+45 "AI TECH LAB" \
            "$THUMBNAIL"

          test -s "$VIDEO"
          test -s "$THUMBNAIL"

          echo "Video and thumbnail rendered."

      - name: Validate rendered production
        run: |
          set -euo pipefail

          VIDEO="output/AI_TECH_LAB_${CONTENT_ID}.mp4"
          THUMBNAIL="output/thumbnail_${CONTENT_ID}.jpg"

          test -s "$VIDEO"
          test -s "$THUMBNAIL"

          ffprobe -v error "$VIDEO"

          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "$VIDEO")

          SIZE=$(stat -c%s "$VIDEO")

          python3 - "$DURATION" "$SIZE" <<'PY'
          import sys

          duration = float(sys.argv[1])
          size = int(sys.argv[2])

          if duration < 30:
              raise SystemExit(
                  f"QA failed: video duration is {duration:.1f} seconds."
              )

          if size < 100000:
              raise SystemExit("QA failed: video file is too small.")

          print(f"QA passed: duration={duration:.1f}s, size={size} bytes.")
          PY

      - name: Save video, thumbnail and metadata
        uses: actions/upload-artifact@v4
        with:
          name: ai-tech-lab-${{ inputs.content_id }}
          path: |
            output/AI_TECH_LAB_${{ inputs.content_id }}.mp4
            output/thumbnail_${{ inputs.content_id }}.jpg
            work/asset_sources.jsonl
            work/title.txt
            work/description.txt
            work/tags.txt
          if-no-files-found: error
          retention-days: 7


      - name: Check YouTube upload state
        id: youtube_state
        env:
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          WORKER_URL: https://dark-sunset-a2a1.hamarketers05.workers.dev
        run: |
          set -euo pipefail
          jq -n --arg content_id "$CONTENT_ID" '{content_id:($content_id|tonumber)}' > work/youtube_upload_state_request.json
          CODE=$(curl -sS --max-time 30 -o work/youtube_upload_state.json -w "%{http_code}" -X POST -H "Authorization: Bearer $WORKER_AUTH_TOKEN" -H "Content-Type: application/json" --data-binary @work/youtube_upload_state_request.json "$WORKER_URL/youtube/upload-state")
          if [ "$CODE" != "200" ]; then echo "Could not check existing YouTube upload (HTTP $CODE)."; jq '{ok,error}' work/youtube_upload_state.json || true; exit 1; fi
          echo "already_uploaded=$(jq -r '.already_uploaded // false' work/youtube_upload_state.json)" >> "$GITHUB_OUTPUT"
          echo "video_id=$(jq -r '.video_id // empty' work/youtube_upload_state.json)" >> "$GITHUB_OUTPUT"
          echo "YouTube duplicate check completed."

      - name: Get short-lived YouTube access token from Cloudflare
        id: youtube_token
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        env:
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          WORKER_URL: https://dark-sunset-a2a1.hamarketers05.workers.dev
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 45 -o work/youtube_token.json -w "%{http_code}" -X POST -H "Authorization: Bearer $WORKER_AUTH_TOKEN" -H "Content-Type: application/json" "$WORKER_URL/youtube/access-token")
          if [ "$CODE" != "200" ]; then echo "Cloudflare could not provide a YouTube access token (HTTP $CODE)."; jq '{ok,error,provider_error,http_status}' work/youtube_token.json || true; exit 1; fi
          TOKEN=$(jq -r '.access_token // empty' work/youtube_token.json)
          test -n "$TOKEN" || { echo "Access token was not returned."; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "YOUTUBE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          rm -f work/youtube_token.json
          echo "Short-lived access token acquired; it was not stored in GitHub Secrets."

      - name: Prepare YouTube metadata and schedule
        id: youtube_metadata
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        env:
          INPUT_PUBLISH_AT: ${{ inputs.publish_at }}
          INPUT_TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          title = Path("work/title.txt").read_text(encoding="utf-8").strip()
          description = Path("work/description.txt").read_text(encoding="utf-8").strip()
          if not title: raise SystemExit("YouTube upload blocked: title is empty.")
          title, description = title[:100], description[:4900]
          raw_tags = os.getenv("INPUT_TAGS", "").strip()
          if raw_tags:
              tags = [x.strip() for x in raw_tags.split(",") if x.strip()]
          else:
              tags = [x.strip() for x in Path("work/tags.txt").read_text(encoding="utf-8").split(",") if x.strip()]
          tags = tags[:30]
          while tags and sum(map(len, tags)) > 450: tags.pop()
          status = {"privacyStatus": "private"}
          requested = os.getenv("INPUT_PUBLISH_AT", "").strip()
          normalized = ""
          if requested:
              try: dt = datetime.fromisoformat(requested.replace("Z", "+00:00"))
              except ValueError: raise SystemExit("publish_at must be ISO 8601 and include Z or an explicit timezone offset.")
              if dt.tzinfo is None: raise SystemExit("publish_at must include Z or an explicit timezone offset.")
              dt = dt.astimezone(timezone.utc)
              if dt <= datetime.now(timezone.utc) + timedelta(minutes=2): raise SystemExit("publish_at must be at least 2 minutes in the future.")
              normalized = dt.isoformat(timespec="seconds").replace("+00:00", "Z")
              status["publishAt"] = normalized
          metadata = {"snippet":{"title":title,"description":description,"tags":tags,"categoryId":"28","defaultLanguage":"en"},"status":status}
          Path("work/youtube_metadata.json").write_text(json.dumps(metadata, ensure_ascii=False), encoding="utf-8")
          Path("work/publish_at_normalized.txt").write_text(normalized, encoding="utf-8")
          print("YouTube metadata prepared. Privacy is private; optional schedule validated.")
          PY

      - name: Upload video through official YouTube Data API v3
        id: youtube_upload
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        run: |
          set -euo pipefail
          VIDEO="output/AI_TECH_LAB_$CONTENT_ID.mp4"
          THUMBNAIL="output/thumbnail_$CONTENT_ID.jpg"
          test -s "$VIDEO"
          test -s "$THUMBNAIL"
          FILE_SIZE=$(stat -c%s "$VIDEO")
          INIT_CODE=$(curl -sS --max-time 60 -D work/youtube_upload_headers.txt -o work/youtube_upload_init.json -w "%{http_code}" -X POST -H "Authorization: Bearer $YOUTUBE_ACCESS_TOKEN" -H "Content-Type: application/json; charset=UTF-8" -H "X-Upload-Content-Type: video/mp4" -H "X-Upload-Content-Length: $FILE_SIZE" --data-binary @work/youtube_metadata.json "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status")
          if [ "$INIT_CODE" != "200" ] && [ "$INIT_CODE" != "201" ]; then echo "YouTube upload initialization failed (HTTP $INIT_CODE)."; jq '{error:{code:.error.code,message:.error.message}}' work/youtube_upload_init.json || true; exit 1; fi
          LOCATION=$(grep -i '^location:' work/youtube_upload_headers.txt | tail -n 1 | sed 's/^[^:]*:[[:space:]]*//' | tr -d '\r')
          test -n "$LOCATION" || { echo "YouTube did not return a resumable upload URL."; exit 1; }
          UPLOAD_CODE=$(curl -sS --max-time 1200 -o work/youtube_upload_result.json -w "%{http_code}" -X PUT -H "Authorization: Bearer $YOUTUBE_ACCESS_TOKEN" -H "Content-Type: video/mp4" --data-binary @"$VIDEO" "$LOCATION")
          if [ "$UPLOAD_CODE" != "200" ] && [ "$UPLOAD_CODE" != "201" ]; then echo "YouTube video transfer failed (HTTP $UPLOAD_CODE)."; jq '{error:{code:.error.code,message:.error.message}}' work/youtube_upload_result.json || true; exit 1; fi
          VIDEO_ID=$(jq -r '.id // empty' work/youtube_upload_result.json)
          test -n "$VIDEO_ID" || { echo "YouTube did not return a video ID."; exit 1; }
          echo "video_id=$VIDEO_ID" >> "$GITHUB_OUTPUT"
          echo "YouTube video uploaded successfully; ID recorded in the job output."

      - name: Save YouTube video ID and schedule to Cloudflare D1
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        env:
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          WORKER_URL: https://dark-sunset-a2a1.hamarketers05.workers.dev
        run: |
          set -euo pipefail
          VIDEO_ID="${{ steps.youtube_upload.outputs.video_id }}"
          PUBLISH_AT=$(cat work/publish_at_normalized.txt)
          jq -n --arg content_id "$CONTENT_ID" --arg video_id "$VIDEO_ID" --arg publish_at "$PUBLISH_AT" '{content_id:($content_id|tonumber),video_id:$video_id,publish_at:$publish_at}' > work/youtube_upload_record.json
          CODE=$(curl -sS --max-time 45 -o work/youtube_upload_record_response.json -w "%{http_code}" -X POST -H "Authorization: Bearer $WORKER_AUTH_TOKEN" -H "Content-Type: application/json" --data-binary @work/youtube_upload_record.json "$WORKER_URL/youtube/upload-result")
          if [ "$CODE" != "200" ] || [ "$(jq -r '.ok // false' work/youtube_upload_record_response.json)" != "true" ]; then echo "Video uploaded, but Cloudflare could not save its ID. Do not re-run this content blindly."; jq '{ok,error}' work/youtube_upload_record_response.json || true; exit 1; fi
          echo "YouTube video ID and schedule saved to Cloudflare D1."


      - name: Set custom YouTube thumbnail
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        run: |
          set -euo pipefail
          VIDEO_ID="${{ steps.youtube_upload.outputs.video_id }}"
          test -n "$VIDEO_ID"
          CODE=$(curl -sS --max-time 90 -o work/youtube_thumbnail_result.json -w "%{http_code}" -X POST -H "Authorization: Bearer $YOUTUBE_ACCESS_TOKEN" -H "Content-Type: image/jpeg" --data-binary @"output/thumbnail_$CONTENT_ID.jpg" "https://www.googleapis.com/upload/youtube/v3/thumbnails/set?videoId=$VIDEO_ID")
          if [ "$CODE" != "200" ]; then echo "Thumbnail upload failed (HTTP $CODE)."; jq '{error:{code:.error.code,message:.error.message}}' work/youtube_thumbnail_result.json || true; exit 1; fi
          echo "Custom thumbnail set successfully."

      - name: Report existing YouTube upload without duplicating it
        if: steps.youtube_state.outputs.already_uploaded == 'true'
        run: |
          echo "Content $CONTENT_ID already has YouTube video ID ${{ steps.youtube_state.outputs.video_id }}; duplicate upload skipped."
