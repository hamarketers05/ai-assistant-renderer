          .venv/bin/python - "$VIDEO" "$THUMBNAIL" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          from PIL import Image
          video, thumbnail = sys.argv[1:3]
          probe = subprocess.run(["ffprobe","-v","error","-show_entries","stream=codec_type,width,height","-of","json",video],check=True,capture_output=True,text=True)
          streams = json.loads(probe.stdout).get("streams",[])
          kinds = {x.get("codec_type") for x in streams}
          if not {"video","audio"}.issubset(kinds):
              raise SystemExit(f"QA failed: expected video and audio streams, got {kinds}")
          with Image.open(thumbnail) as im:
              if im.size != (1280,720): raise SystemExit(f"Premium thumbnail size invalid: {im.size}")
