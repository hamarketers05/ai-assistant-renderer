name: AI Assistant Renderer

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "Content ID"
        required: true
        type: string
      audio_url:
        description: "Optional direct audio URL"
        required: false
        type: string
      title:
        description: "Video title"
        required: true
        type: string
      script:
        description: "Complete English video script"
        required: true
        type: string
      description:
        description: "YouTube description"
        required: false
        type: string
      tags:
        description: "Comma-separated YouTube tags"
        required: false
        type: string
      publish_at:
        description: "Optional UTC publish time"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: renderer-${{ inputs.content_id }}
  cancel-in-progress: false

jobs:
  render:
    name: Render AI Tech Lab Video
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CONTENT_ID: ${{ inputs.content_id }}
      INPUT_TITLE: ${{ inputs.title }}
      INPUT_SCRIPT: ${{ inputs.script }}
      INPUT_DESCRIPTION: ${{ inputs.description }}
      INPUT_TAGS: ${{ inputs.tags }}
      INPUT_PUBLISH_AT: ${{ inputs.publish_at }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install editing tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq imagemagick python3 python3-venv fonts-dejavu-core
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install pillow matplotlib opencv-python-headless pydub faster-whisper
          mkdir -p work output scenes assets

      - name: Validate configuration
        env:
          WORKER_URL: ${{ vars.NEW_PRODUCTION_WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          [[ "$CONTENT_ID" =~ ^[0-9]+$ ]] || { echo "Content ID must be numeric."; exit 1; }
          test -n "$INPUT_TITLE"
          test "${#INPUT_SCRIPT}" -ge 300
          test -n "$WORKER_URL"
          test -n "$WORKER_TOKEN"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "${{ secrets.VECTEEZY_API_KEY }}"
          test -n "${{ secrets.VECTEEZY_ACCOUNT_ID }}"
          echo "Configuration validation passed."

      - name: Request production manifest
        env:
          WORKER_URL: ${{ vars.NEW_PRODUCTION_WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          set -euo pipefail
          jq -n \
            --arg content_id "$CONTENT_ID" \
            --arg brand_id "AI_TECH_LAB" \
            --arg platform "YouTube" \
            --arg language "english" \
            --arg title "$INPUT_TITLE" \
            --arg script "$INPUT_SCRIPT" \
            --arg audio_url "$AUDIO_URL" \
            '{content_id:$content_id,brand_id:$brand_id,platform:$platform,language:$language,title:$title,script:$script,audio_url:$audio_url}' \
            > work/production_request.json

          CODE=$(curl -sS --max-time 180 -o work/production_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $WORKER_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @work/production_request.json \
            "${WORKER_URL%/}/produce")

          if [ "$CODE" != "200" ]; then
            jq '{error,message,status}' work/production_response.json || true
            echo "Manifest request failed: HTTP $CODE"
            exit 1
          fi

          jq -e '.status == "production_ready" and (.production | type == "object")' \
            work/production_response.json >/dev/null
          jq '.production' work/production_response.json > work/production_manifest.json
          jq -e '.scenes | type == "array" and length > 0' \
            work/production_manifest.json >/dev/null

      - name: Prepare metadata and scene plan
        run: |
          set -euo pipefail
          jq -r '.seo.title // empty' work/production_manifest.json > work/manifest_title.txt
          jq -r '.seo.description // empty' work/production_manifest.json > work/manifest_description.txt

          TITLE=$(cat work/manifest_title.txt)
          DESCRIPTION=$(cat work/manifest_description.txt)
          [ -n "$TITLE" ] || TITLE="$INPUT_TITLE"
          [ -n "$DESCRIPTION" ] || DESCRIPTION="$INPUT_DESCRIPTION"

          printf '%s' "${TITLE:0:100}" > work/title.txt
          printf '%s' "${DESCRIPTION:0:4900}" > work/description.txt
          printf '%s' "$INPUT_SCRIPT" > work/script.txt

          if [ -n "$INPUT_TAGS" ]; then
            printf '%s' "$INPUT_TAGS" > work/tags.txt
          else
            jq -r '.seo.tags // [] | join(",")' work/production_manifest.json > work/tags.txt
          fi

          jq -r '.scenes[] | [
            (.scene // .id // 0 | tostring),
            (.start // 0 | tostring),
            (.end // 0 | tostring),
            (.duration // 0 | tostring),
            (.visual.type // "generated"),
            (.visual.query // .visual.description // .narration // ""),
            (.overlay.text // "")
          ] | @tsv' work/production_manifest.json > work/scenes.tsv

          test -s work/scenes.tsv

      - name: Download existing voice
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUDIO_URL: ${{ inputs.audio_url }}
        run: |
          set -euo pipefail
          if [ -n "$AUDIO_URL" ]; then
            curl -fLsS --retry 3 --retry-all-errors --max-time 180 "$AUDIO_URL" -o voice_input
          else
            VOICE_PATH="voices/AI_TECH_LAB/${CONTENT_ID}/auto_tts_full.wav"
            SIGN_RESPONSE=$(curl -sS --max-time 60 \
              -X POST \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              --data '{"expiresIn":3600}' \
              "${SUPABASE_URL%/}/storage/v1/object/sign/ai-assistant-audio/${VOICE_PATH}")

            SIGNED_PATH=$(echo "$SIGN_RESPONSE" | jq -r '.signedURL // empty')
            if [ -z "$SIGNED_PATH" ]; then
              jq '{statusCode,error,message}' <<< "$SIGN_RESPONSE" || true
              echo "Could not sign the existing voice file."
              exit 1
            fi

            case "$SIGNED_PATH" in
              http://*|https://*) DOWNLOAD_URL="$SIGNED_PATH" ;;
              /*) DOWNLOAD_URL="${SUPABASE_URL%/}/storage/v1${SIGNED_PATH}" ;;
              *) DOWNLOAD_URL="${SUPABASE_URL%/}/storage/v1/${SIGNED_PATH}" ;;
            esac

            curl -fLsS --retry 3 --retry-all-errors --max-time 180 "$DOWNLOAD_URL" -o voice_input
          fi

          test -s voice_input
          ffprobe -v error voice_input
          ffmpeg -y -i voice_input -vn -ac 2 -ar 44100 -c:a pcm_s16le voice.wav

      - name: Discover and download Vecteezy footage
        env:
          VECTEEZY_API_KEY: ${{ secrets.VECTEEZY_API_KEY }}
          VECTEEZY_ACCOUNT_ID: ${{ secrets.VECTEEZY_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          cat > work/fetch_vecteezy.py <<'PY'
          import json, os, re, urllib.parse, urllib.request
          from pathlib import Path

          API_KEY = os.getenv("VECTEEZY_API_KEY", "").strip()
          ACCOUNT_ID = os.getenv("VECTEEZY_ACCOUNT_ID", "").strip()
          BASE = "https://api.vecteezy.com/v2"

          Path("assets").mkdir(exist_ok=True)
          Path("work/asset_sources.jsonl").write_text("", encoding="utf-8")

          if not API_KEY or not ACCOUNT_ID:
              raise SystemExit("Vecteezy credentials are required.")

          def api_get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {API_KEY}",
                      "Accept": "application/json",
                      "User-Agent": "AI-Tech-Lab-Renderer/1.0",
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.loads(response.read().decode("utf-8"))

          def resource_list(data):
              if isinstance(data, list):
                  return [x for x in data if isinstance(x, dict)]
              if isinstance(data, dict):
                  for key in ("resources", "data", "results", "items"):
                      if isinstance(data.get(key), list):
                          return [x for x in data[key] if isinstance(x, dict)]
              return []

          def resource_id(item):
              for key in ("id", "resource_id", "resourceId"):
                  if item.get(key) is not None:
                      return item[key]
              return None

          def find_url(obj):
              if isinstance(obj, dict):
                  for key in ("download_url", "downloadUrl", "signed_url", "signedUrl"):
                      value = obj.get(key)
                      if isinstance(value, str) and value.startswith("https://"):
                          return value
                  for value in obj.values():
                      found = find_url(value)
                      if found:
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = find_url(value)
                      if found:
                          return found
              return None

          try:
              api_get(f"{BASE}/{ACCOUNT_ID}/account/info")
          except Exception as exc:
              raise SystemExit(f"Vecteezy account check failed: {str(exc)[:180]}")

          with open("work/scenes.tsv", encoding="utf-8") as source:
              rows = [line.rstrip("\n").split("\t") for line in source]

          downloaded = 0
          max_downloads = 40
          seen_queries = set()

          for row in rows:
              if len(row) < 7 or downloaded >= max_downloads:
                  continue

              scene, start, end, duration, kind, query, overlay = row[:7]
              scene = re.sub(r"[^a-zA-Z0-9_-]", "_", scene)[:80]
              query = re.sub(r"\s+", " ", query).strip()[:120]

              if len(query) < 3 or query.lower() in seen_queries:
                  continue
              seen_queries.add(query.lower())

              search_url = f"{BASE}/{ACCOUNT_ID}/resources?" + urllib.parse.urlencode({
                  "term": query,
                  "content_type": "video",
                  "page": 1,
                  "per_page": 5
              })

              try:
                  results = resource_list(api_get(search_url))
              except Exception as exc:
                  print(f"Vecteezy search failed for {scene}: {str(exc)[:120]}")
                  continue

              for item in results:
                  rid = resource_id(item)
                  if rid is None:
                      continue
                  try:
                      details = api_get(
                          f"{BASE}/{ACCOUNT_ID}/resources/"
                          f"{urllib.parse.quote(str(rid), safe='')}/download"
                      )
                      url = find_url(details)
                      if not url:
                          continue

                      req = urllib.request.Request(
                          url, headers={"User-Agent": "AI-Tech-Lab-Renderer/1.0"}
                      )
                      with urllib.request.urlopen(req, timeout=120) as response:
                          data = response.read()

                      if len(data) < 10000:
                          continue

                      target = Path(f"assets/scene_{scene}.mp4")
                      target.write_bytes(data)

                      metadata = {
                          "scene": scene,
                          "provider": "Vecteezy",
                          "asset_id": str(rid),
                          "query": query,
                          "license_reference": "https://www.vecteezy.com/licensing-agreement"
                      }
                      with open("work/asset_sources.jsonl", "a", encoding="utf-8") as log:
                          log.write(json.dumps(metadata) + "\n")

                      downloaded += 1
                      print(f"Vecteezy clip downloaded for scene {scene}")
                      break
                  except Exception as exc:
                      print(f"Vecteezy download failed for {scene}: {str(exc)[:120]}")

          print(f"Vecteezy downloads: {downloaded}")
          print("Only assets permitted by the applicable license may be published.")
          PY

          .venv/bin/python work/fetch_vecteezy.py

      - name: Create original graphics
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import cv2

          Path("assets").mkdir(exist_ok=True)
          font = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          labels = [
              "AI AGENTS", "AUTOMATION", "AI RESEARCH",
              "FUTURE TECHNOLOGY", "HUMAN + AI", "WHAT CHANGES NEXT"
          ]

          for i, label in enumerate(labels):
              img = Image.new("RGB", (1920, 1080), (5, 16 + i, 37 + i * 3))
              draw = ImageDraw.Draw(img)
              for x in range(0, 1920, 160):
                  draw.line((x, 0, x - 220, 1080), fill=(8, 50 + i, 83 + i), width=2)
              draw.rounded_rectangle((100, 110, 1820, 970), radius=32, outline=(0, 210, 245), width=4)
              draw.text((150, 180), label, font=ImageFont.truetype(font, 76), fill="white")
              draw.text((150, 300), "AI TECH LAB  |  2026", font=ImageFont.truetype(font, 35), fill=(0, 220, 255))
              img.save(f"assets/generated_{i+1}.png")

          fig, ax = plt.subplots(figsize=(12, 6))
          ax.plot(["Research", "Plan", "Act", "Review"], [1, 2, 3, 4], marker="o", linewidth=3)
          ax.set_title("How an AI Agent Workflow Operates")
          ax.set_ylabel("Workflow stage — illustrative")
          ax.grid(True, alpha=0.25)
          fig.tight_layout()
          fig.savefig("assets/agent_workflow.png", dpi=150)
          plt.close(fig)

          for path in Path("assets").glob("*.png"):
              image = cv2.imread(str(path))
              if image is None:
                  raise SystemExit(f"Image validation failed: {path}")
          print("Original visual assets validated.")
          PY

      - name: Render scenes
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import csv, re, subprocess
          from pathlib import Path

          def run(args):
              subprocess.run(args, check=True)

          def safe(value):
              return re.sub(r"[^a-zA-Z0-9_-]", "_", str(value))[:80]

          with open("work/scenes.tsv", encoding="utf-8") as f:
              rows = list(csv.reader(f, delimiter="\t"))

          if not rows:
              raise SystemExit("No scenes found.")

          for i, row in enumerate(rows):
              if len(row) < 7:
                  continue
              scene = safe(row[0])
              try:
                  duration = max(3.0, min(float(row[3]), 35.0))
              except Exception:
                  duration = 8.0

              stock = Path(f"assets/scene_{scene}.mp4")
              target = Path(f"scenes/scene_{scene}.mp4")
              graphic = Path(f"assets/generated_{(i % 6) + 1}.png")

              if stock.exists() and stock.stat().st_size > 10000:
                  run([
                      "ffmpeg", "-y", "-stream_loop", "-1", "-i", str(stock),
                      "-t", str(duration), "-vf",
                      "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,setsar=1,eq=contrast=1.08:saturation=1.08",
                      "-an", "-c:v", "libx264", "-preset", "veryfast",
                      "-crf", "23", "-pix_fmt", "yuv420p", str(target)
                  ])
              else:
                  run([
                      "ffmpeg", "-y", "-loop", "1", "-i", str(graphic),
                      "-t", str(duration), "-vf",
                      "scale=1920:1080,zoompan=z='min(zoom+0.0005,1.08)':d=1:s=1920x1080:fps=30",
                      "-an", "-c:v", "libx264", "-preset", "veryfast",
                      "-crf", "23", "-pix_fmt", "yuv420p", str(target)
                  ])

              if not target.exists() or target.stat().st_size < 1000:
                  raise SystemExit(f"Scene render failed: {scene}")

          with open("work/concat.txt", "w", encoding="utf-8") as out:
              for row in rows:
                  if len(row) >= 7:
                      path = Path(f"scenes/scene_{safe(row[0])}.mp4")
                      if path.exists():
                          out.write(f"file '{path.resolve()}'\n")

          if not Path("work/concat.txt").stat().st_size:
              raise SystemExit("No rendered scene files.")
          print("Scene rendering completed.")
          PY

      - name: Generate speech-aligned captions
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path

          model = WhisperModel("base.en", device="cpu", compute_type="int8")
          segments, info = model.transcribe("voice.wav", word_timestamps=True, vad_filter=True)

          def stamp(seconds):
              ms = int(round(seconds * 1000))
              h, ms = divmod(ms, 3600000)
              m, ms = divmod(ms, 60000)
              s, ms = divmod(ms, 1000)
              return f"{h:02}:{m:02}:{s:02},{ms:03}"

          entries = []
          idx = 1
          for segment in segments:
              words = getattr(segment, "words", None) or []
              if words:
                  for start in range(0, len(words), 5):
                      batch = words[start:start+5]
                      text = " ".join(word.word.strip() for word in batch).strip()
                      if text:
                          begin = max(0, batch[0].start)
                          end = max(begin + 0.15, batch[-1].end)
                          entries.append(f"{idx}\n{stamp(begin)} --> {stamp(end)}\n{text}\n")
                          idx += 1
              elif segment.text.strip():
                  entries.append(
                      f"{idx}\n{stamp(segment.start)} --> {stamp(segment.end)}\n{segment.text.strip()}\n"
                  )
                  idx += 1

          if not entries:
              raise SystemExit("Speech recognition returned no captions.")
          Path("work/captions.srt").write_text("\n".join(entries), encoding="utf-8")
          print(f"Generated {len(entries)} caption entries.")
          PY

      - name: Assemble final video and thumbnail
        run: |
          set -euo pipefail
          ffmpeg -y -f concat -safe 0 -i work/concat.txt -an \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
            work/visual_track.mp4

          AUDIO_DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 voice.wav)

          VIDEO="output/AI_TECH_LAB_${CONTENT_ID}.mp4"
          THUMBNAIL="output/thumbnail_${CONTENT_ID}.jpg"

          ffmpeg -y -i work/visual_track.mp4 -i voice.wav \
            -filter_complex \
            "[0:v]fps=30,scale=1920:1080,subtitles=work/captions.srt:force_style='FontName=DejaVu Sans,FontSize=22,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Shadow=1,Alignment=2,MarginV=55'[v]" \
            -map "[v]" -map 1:a -t "$AUDIO_DURATION" \
            -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart "$VIDEO"

          convert -size 1280x720 gradient:'#030713-#10234a' \
            -fill '#07142c' -draw 'polygon 665,0 1280,0 1280,720 760,720 905,360' \
            -font /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
            -fill '#6df2ff' -pointsize 38 -annotate +65+85 'AI TECH LAB | 2026' \
            -fill white -pointsize 76 -annotate +65+230 'BEYOND' \
            -fill '#ffd84d' -pointsize 100 -annotate +65+340 'CHATBOTS' \
            -fill white -pointsize 30 -annotate +70+445 'AI AGENTS ARE TAKING ACTION' \
            -fill '#00d9ff' -draw 'roundrectangle 65,520 620,590 16,16' \
            -fill '#041021' -pointsize 26 -annotate +88+566 'WHAT CHANGES IN 2026' \
            -quality 93 "$THUMBNAIL"

          test -s "$VIDEO"
          test -s "$THUMBNAIL"

      - name: QA rendered production
        run: |
          set -euo pipefail
          VIDEO="output/AI_TECH_LAB_${CONTENT_ID}.mp4"
          ffprobe -v error "$VIDEO"
          DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "$VIDEO")
          SIZE=$(stat -c%s "$VIDEO")
          .venv/bin/python - "$DURATION" "$SIZE" <<'PY'
          import sys
          duration, size = float(sys.argv[1]), int(sys.argv[2])
          if duration < 30:
              raise SystemExit("QA failed: video is too short.")
          if size < 100000:
              raise SystemExit("QA failed: output file is too small.")
          print(f"QA passed: {duration:.1f}s, {size} bytes")
          PY

      - name: Save video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-tech-lab-${{ inputs.content_id }}
          path: |
            output/AI_TECH_LAB_${{ inputs.content_id }}.mp4
            output/thumbnail_${{ inputs.content_id }}.jpg
            work/asset_sources.jsonl
            work/title.txt
            work/description.txt
            work/tags.txt
          if-no-files-found: error
          retention-days: 7

      - name: Check existing YouTube upload
        id: youtube_state
        env:
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          WORKER_URL: https://dark-sunset-a2a1.hamarketers05.workers.dev
        run: |
          set -euo pipefail
          jq -n --arg id "$CONTENT_ID" '{content_id:($id|tonumber)}' > work/state_request.json
          CODE=$(curl -sS --max-time 30 -o work/state.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $WORKER_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @work/state_request.json "$WORKER_URL/youtube/upload-state")
          if [ "$CODE" != "200" ]; then
            echo "Upload state check failed; upload blocked."
            exit 1
          fi
          echo "already_uploaded=$(jq -r '.already_uploaded // false' work/state.json)" >> "$GITHUB_OUTPUT"
          echo "video_id=$(jq -r '.video_id // empty' work/state.json)" >> "$GITHUB_OUTPUT"

      - name: Get YouTube access token
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        env:
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          WORKER_URL: https://dark-sunset-a2a1.hamarketers05.workers.dev
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 45 -o work/token.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $WORKER_AUTH_TOKEN" \
            -H "Content-Type: application/json" "$WORKER_URL/youtube/access-token")
          if [ "$CODE" != "200" ]; then
            jq '{ok,error,provider_error}' work/token.json || true
            exit 1
          fi
          TOKEN=$(jq -r '.access_token // empty' work/token.json)
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "YOUTUBE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          rm -f work/token.json

      - name: Prepare YouTube metadata and schedule
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          title = Path("work/title.txt").read_text(encoding="utf-8").strip()[:100]
          description = Path("work/description.txt").read_text(encoding="utf-8").strip()[:4900]
          raw = os.getenv("INPUT_TAGS", "").strip()
          tags = [x.strip() for x in raw.split(",") if x.strip()] if raw else [
              x.strip() for x in Path("work/tags.txt").read_text(encoding="utf-8").split(",") if x.strip()
          ]
          tags = tags[:30]
          while tags and sum(map(len, tags)) > 450:
              tags.pop()

          status = {"privacyStatus": "private"}
          requested = os.getenv("INPUT_PUBLISH_AT", "").strip()
          normalized = ""
          if requested:
              try:
                  dt = datetime.fromisoformat(requested.replace("Z", "+00:00"))
              except ValueError:
                  raise SystemExit("publish_at must be ISO 8601 with timezone.")
              if dt.tzinfo is None:
                  raise SystemExit("publish_at must include Z or a timezone offset.")
              dt = dt.astimezone(timezone.utc)
              if dt <= datetime.now(timezone.utc) + timedelta(minutes=2):
                  raise SystemExit("publish_at must be at least 2 minutes in the future.")
              normalized = dt.isoformat(timespec="seconds").replace("+00:00", "Z")
              status["publishAt"] = normalized

          Path("work/youtube_metadata.json").write_text(json.dumps({
              "snippet": {
                  "title": title, "description": description, "tags": tags,
                  "categoryId": "28", "defaultLanguage": "en"
              },
              "status": status
          }), encoding="utf-8")
          Path("work/publish_at_normalized.txt").write_text(normalized, encoding="utf-8")
          PY

      - name: Upload video using YouTube Data API
        id: youtube_upload
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        run: |
          set -euo pipefail
          VIDEO="output/AI_TECH_LAB_${CONTENT_ID}.mp4"
          SIZE=$(stat -c%s "$VIDEO")

          INIT_CODE=$(curl -sS --max-time 60 -D work/upload_headers.txt \
            -o work/upload_init.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $YOUTUBE_ACCESS_TOKEN" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -H "X-Upload-Content-Type: video/mp4" \
            -H "X-Upload-Content-Length: $SIZE" \
            --data-binary @work/youtube_metadata.json \
            "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status")

          if [ "$INIT_CODE" != "200" ] && [ "$INIT_CODE" != "201" ]; then
            jq '{error:{code:.error.code,message:.error.message}}' work/upload_init.json || true
            exit 1
          fi

          LOCATION=$(grep -i '^location:' work/upload_headers.txt | tail -n 1 | sed 's/^[^:]*:[[:space:]]*//' | tr -d '\r')
          test -n "$LOCATION"

          UPLOAD_CODE=$(curl -sS --max-time 1200 -o work/upload_result.json -w "%{http_code}" \
            -X PUT -H "Authorization: Bearer $YOUTUBE_ACCESS_TOKEN" \
            -H "Content-Type: video/mp4" --data-binary @"$VIDEO" "$LOCATION")

          if [ "$UPLOAD_CODE" != "200" ] && [ "$UPLOAD_CODE" != "201" ]; then
            jq '{error:{code:.error.code,message:.error.message}}' work/upload_result.json || true
            exit 1
          fi

          VIDEO_ID=$(jq -r '.id // empty' work/upload_result.json)
          test -n "$VIDEO_ID"
          echo "video_id=$VIDEO_ID" >> "$GITHUB_OUTPUT"

      - name: Record uploaded video and schedule
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        env:
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
          WORKER_URL: https://dark-sunset-a2a1.hamarketers05.workers.dev
        run: |
          set -euo pipefail
          VIDEO_ID="${{ steps.youtube_upload.outputs.video_id }}"
          PUBLISH_AT=$(cat work/publish_at_normalized.txt)
          jq -n --arg id "$CONTENT_ID" --arg video "$VIDEO_ID" --arg at "$PUBLISH_AT" \
            '{content_id:($id|tonumber),video_id:$video,publish_at:$at}' > work/upload_record.json

          CODE=$(curl -sS --max-time 45 -o work/upload_record_response.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $WORKER_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @work/upload_record.json "$WORKER_URL/youtube/upload-result")

          if [ "$CODE" != "200" ] || [ "$(jq -r '.ok // false' work/upload_record_response.json)" != "true" ]; then
            jq '{ok,error}' work/upload_record_response.json || true
            echo "Upload succeeded but recording failed; do not rerun blindly."
            exit 1
          fi

      - name: Set custom thumbnail
        if: steps.youtube_state.outputs.already_uploaded != 'true'
        run: |
          set -euo pipefail
          VIDEO_ID="${{ steps.youtube_upload.outputs.video_id }}"
          CODE=$(curl -sS --max-time 90 -o work/thumbnail_result.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $YOUTUBE_ACCESS_TOKEN" \
            -H "Content-Type: image/jpeg" \
            --data-binary @"output/thumbnail_${CONTENT_ID}.jpg" \
            "https://www.googleapis.com/upload/youtube/v3/thumbnails/set?videoId=$VIDEO_ID")
          if [ "$CODE" != "200" ]; then
            jq '{error:{code:.error.code,message:.error.message}}' work/thumbnail_result.json || true
            exit 1
          fi

      - name: Report existing upload
        if: steps.youtube_state.outputs.already_uploaded == 'true'
        run: |
          echo "Content $CONTENT_ID already has video ID ${{ steps.youtube_state.outputs.video_id }}."
          echo "Duplicate upload skipped. Do not delete the old scheduled video."
