name: One-Time Cancel Duplicate Oct 15 Render Runs
on:
  push:
    branches: [main]
    paths:
      - ".github/run-once/cancel-oct15-duplicates.txt"
permissions:
  actions: write
  contents: read
jobs:
  cancel-duplicates:
    if: ${{ github.event.head_commit.message == 'CANCEL-DUPLICATE-OCT15-RENDERS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the two queued duplicate renders
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for RUN_ID in 38385600151 38385603620; do
            CODE=$(curl -sS --max-time 30 -o "/tmp/cancel-$RUN_ID.json" -w "%{http_code}" \
              -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GH_API/repos/$GH_REPO/actions/runs/$RUN_ID/cancel")
            if [ "$CODE" = "202" ] || [ "$CODE" = "409" ]; then
              echo "Cancellation request accepted/already settling for duplicate run $RUN_ID (HTTP $CODE)."
            else
              echo "Unexpected cancellation response for $RUN_ID: HTTP $CODE"
              cat "/tmp/cancel-$RUN_ID.json"
              exit 1
            fi
          done
