name: Dispatch AI Tech Lab Content 20 After Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-content-20.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch-content:
    if: github.event.head_commit.message == 'Dispatch one new AI Tech Lab video 20 after passing renderer validation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout scheduled content package
        uses: actions/checkout@v4

      - name: Wait for this commit's renderer validation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          STATE="waiting"
          for attempt in $(seq 1 50); do
            RESPONSE=$(curl -fsS --retry 2 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=100")
            STATE=$(printf '%s' "$RESPONSE" | jq -r --arg sha "$HEAD_SHA" '
              [.workflow_runs[] | select(.name == "Renderer Static Validation" and .head_sha == $sha)]
              | sort_by(.created_at) | last | if . == null then "waiting" elif .status != "completed" then "waiting" else .conclusion end')
            echo "Renderer static validation state: $STATE (attempt $attempt/50)"
            if [ "$STATE" = "success" ]; then
              break
            elif [ "$STATE" = "failure" ] || [ "$STATE" = "cancelled" ] || [ "$STATE" = "timed_out" ]; then
              echo "Refusing to render because static validation ended with $STATE."
              exit 1
            fi
            sleep 15
          done
          if [ "$STATE" != "success" ]; then
            echo "Timed out waiting for successful renderer validation; no video dispatch was sent."
            exit 1
          fi

      - name: Validate the content package and schedule time
        run: |
          set -euo pipefail
          FILE="production/ai_tech_lab_content_20.json"
          test -s "$FILE"
          jq -e '.content_id == "20" and .content_format == "LONG_VIDEO" and (.script | length > 3000) and (.title | length > 0) and (.description | length > 100) and (.publish_at == "2026-10-14T22:00:00Z")' "$FILE" >/dev/null
          PUBLISH_AT=$(jq -r '.publish_at' "$FILE")
          PUBLISH_EPOCH=$(date -u -d "$PUBLISH_AT" +%s)
          NOW_EPOCH=$(date -u +%s)
          if [ "$PUBLISH_EPOCH" -le "$NOW_EPOCH" ]; then
            echo "Scheduled publish time is not in the future; refusing to dispatch."
            exit 1
          fi
          echo "Content 20 validated. Planned UTC publish time: $PUBLISH_AT"

      - name: Dispatch the primary FFmpeg renderer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILE="production/ai_tech_lab_content_20.json"
          PUBLISH_AT=$(jq -r '.publish_at' "$FILE")
          PAYLOAD=$(jq -c '{
            ref: "main",
            inputs: {
              content_id: .content_id,
              audio_url: "",
              content_format: .content_format,
              title: .title,
              script: .script,
              description: .description,
              tags: .tags,
              publish_at: .publish_at
            }
          }' "$FILE")
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CODE=$(curl -sS --max-time 30 -o /tmp/dispatch-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/manual.yml/dispatches")
          if [ "$CODE" != "204" ]; then
            cat /tmp/dispatch-response.json || true
            echo "Primary renderer dispatch failed with HTTP $CODE."
            exit 1
          fi
          echo "Renderer accepted content 20; upload is still conditional on all visual/license/audio QA gates."
          echo "Requested schedule: $PUBLISH_AT"
          echo "Dispatch request time: $STARTED_AT"
          for attempt in $(seq 1 12); do
            RUNS=$(curl -fsS --retry 2 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs?event=workflow_dispatch&per_page=20")
            RUN=$(printf '%s' "$RUNS" | jq -c --arg sha "${{ github.sha }}" --arg start "$STARTED_AT" '
              [.workflow_runs[] | select(.name == "AI Assistant Renderer" and .head_sha == $sha and .created_at >= $start)]
              | sort_by(.created_at) | last')
            if [ "$RUN" != "null" ] && [ -n "$RUN" ]; then
              printf '%s' "$RUN" | jq '{id,html_url,status,conclusion,created_at}'
              exit 0
            fi
            sleep 5
          done
          echo "GitHub accepted dispatch (HTTP 204), but the run URL was not found immediately."
