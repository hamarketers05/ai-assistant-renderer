name: Verify Main Worker Health and API Protection (No Publishing)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-main-worker-chat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-main-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify main Worker live health and configured bindings
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dark-sunset-a2a1.hamarketers05.workers.dev"
          curl -fsS --retry 2 --retry-delay 1 --max-time 15 "$URL/health" -o /tmp/main-health.json
          jq -e '.status == "online" and .database == true and .queue == true and .groq_configured == true and .provider_strategy == "GROQ_PRIMARY_WORKERS_AI_BACKUP"' /tmp/main-health.json >/dev/null
          jq '{status, database, queue, groq_status, provider_strategy, content_count}' /tmp/main-health.json

      - name: Confirm the chat endpoint rejects unauthenticated calls
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dark-sunset-a2a1.hamarketers05.workers.dev/v1/chat/completions"
          CODE=$(curl -sS --max-time 15 -o /tmp/chat-auth.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            --data '{"model":"openai/gpt-oss-20b","messages":[{"role":"user","content":"This is an unauthenticated security smoke test."}]}' "$URL")
          test "$CODE" = "401"
          jq -e '.error.code == "invalid_api_key"' /tmp/chat-auth.json >/dev/null
          echo "Unauthenticated chat request correctly rejected. Auth token is intentionally not copied to GitHub Actions; no content rows, render jobs, uploads, or publishing were created."
