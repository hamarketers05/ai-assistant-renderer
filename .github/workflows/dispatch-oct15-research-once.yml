name: One-time October 15 Research Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-oct15-research-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-research:
    if: "${{ github.event.head_commit.message == 'chore: dispatch Oct 15 research once' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch research for the October 15 US publishing slot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n '{ref:"main",inputs:{target_date:"2026-10-15"}}' > request.json
          code=$(curl -sS --max-time 45 -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @request.json \
            "$GH_API/repos/$GH_REPO/actions/workflows/daily-content-research.yml/dispatches")
          if [ "$code" != "204" ]; then
            echo "Research dispatch failed: HTTP $code"
            jq '{message,errors}' response.json || cat response.json
            exit 1
          fi
          echo "October 15 research workflow accepted by GitHub Actions."
