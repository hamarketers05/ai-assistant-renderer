name: Renderer Static Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tools/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: Validate renderer, SEO, brand assets and original audio
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check PyYAML==6.0.2 numpy scipy pillow matplotlib opencv-python-headless pydub faster-whisper

      - name: Compile project tools and validate workflow order
        run: |
          set -euo pipefail
          python -m py_compile tools/generate_music.py tools/make_evidence_charts.py tools/voice_editor.py tools/make_brand_assets.py tools/seo_metadata.py tools/fetch_free_video.py tools/make_premium_thumbnail.py tools/make_3d_hero_overlay.py tools/generate_kokoro_voice.py tools/render_transitions.py tools/scene_director.py tools/groq_thumbnail_brief.py tools/daily_content_research.py tools/groq_video_review.py
          python - <<'PY'
          from pathlib import Path
          import ast
          import yaml

          for path in sorted(Path(".github/workflows").glob("*.yml")):
              obj = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              if not isinstance(obj, dict) or not obj.get("name") or not isinstance(obj.get("jobs"), dict):
                  raise SystemExit(f"Workflow YAML structure invalid: {path}")
              print(f"YAML parsed: {path}")

          for path in Path("tools").glob("*.py"):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))

          wf = yaml.load(Path(".github/workflows/manual.yml").read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          names = [step.get("name", "") for step in wf["jobs"]["render"]["steps"]]
          required = [
              "Fetch and validate approved narration",
              "Build sentence-by-sentence visual direction",
              "Edit generated narration, add pauses and script cues, and generate captions",
              "Generate original topic-aware background score",
              "Find additional free, topic-matched Wikimedia Commons footage",
              "Add stock creator and license attribution",
              "Generate only evidence-supported data charts",
              "Improve SEO title, description, tags, sources and chapters",
              "Create AI Tech Lab branded intro and subscribe popup",
              "Assemble final video and thumbnail",
              "QA rendered production",
              "Verify narration, music, captions, and premium thumbnail assets",
              "Groq router reviews rendered video, visual match, audio assets and thumbnail",
              "Save video artifacts",
              "Persist final QA feedback for the next video",
              "Block upload if final quality review found critical issues",
              "Require script-relevant licensed footage before upload",
              "Check existing YouTube upload",
              "Verify uploaded video with YouTube Data API v3",
          ]
          missing = [x for x in required if x not in names]
          if missing:
              raise SystemExit("Missing production stages: " + ", ".join(missing))
          if not (names.index(required[0]) < names.index(required[1]) < names.index("Discover and download Vecteezy footage")):
              raise SystemExit("Voice validation and sentence-level scene planning must precede asset discovery.")
          if not Path("tools/scene_director.py").is_file() or not Path("tools/groq_thumbnail_brief.py").is_file():
              raise SystemExit("Sentence scene director or Groq thumbnail brief tool is missing.")
          ordered_assets = ["Find additional free, topic-matched Wikimedia Commons footage", "Add stock creator and license attribution", "Generate only evidence-supported data charts", "Edit generated narration, add pauses and script cues, and generate captions", "Generate original topic-aware background score", "Improve SEO title, description, tags, sources and chapters"]
          if not all(names.index(a) < names.index(b) for a,b in zip(ordered_assets, ordered_assets[1:])):
              raise SystemExit("Asset attribution, charts, narration mastering, music and SEO are out of order.")
          ordered_final = ["Create AI Tech Lab branded intro and subscribe popup", "Assemble final video and thumbnail", "QA rendered production", "Verify narration, music, captions, and premium thumbnail assets", "Groq router reviews rendered video, visual match, audio assets and thumbnail", "Save video artifacts", "Persist final QA feedback for the next video", "Block upload if final quality review found critical issues", "Require script-relevant licensed footage before upload", "Check existing YouTube upload", "Get YouTube access token", "Prepare YouTube metadata and schedule", "Upload video using YouTube Data API", "Record uploaded video and schedule", "Set custom thumbnail", "Verify uploaded video with YouTube Data API v3"]
          if not all(names.index(a) < names.index(b) for a,b in zip(ordered_final, ordered_final[1:])):
              raise SystemExit("Final media QA, strict license gate and upload check are out of order.")
          for path in (Path("tools/fetch_free_video.py"), Path("tools/make_premium_thumbnail.py")):
              if not path.is_file():
                  raise SystemExit(f"Required tool is missing: {path}")
          if not (names.index("Find additional free, topic-matched Wikimedia Commons footage") < names.index("Improve SEO title, description, tags, sources and chapters") < names.index("Create AI Tech Lab branded intro and subscribe popup") < names.index("Assemble final video and thumbnail")):
              raise SystemExit("Research assets, SEO, brand intro and rendering are out of order.")
          voice = wf["jobs"]["render"]["steps"][names.index(required[0])].get("run", "")
          if '[[ "$AUDIO_URL" == https://* ]]' not in voice or "ffprobe -v error voice_input" not in voice:
              raise SystemExit("Renderer must require and validate manually approved narration audio.")
          gate = wf["jobs"]["render"]["steps"][names.index("Validate configuration and approved voice gate")].get("run", "")
          if "APPROVED VOICE GATE" not in gate or '[[ "$AUDIO_URL" == https://* ]]' not in gate:
              raise SystemExit("Approved voice URL must be enforced before production-manifest creation.")
          render = wf["jobs"]["render"]["steps"][names.index("Assemble final video and thumbnail")].get("run", "")
          for marker in ("ai_tech_lab_intro.png", "ai_tech_lab_subscribe.png", "work/voice_edited.wav", "work/music.wav", "loudnorm=I=-14", "tools/render_transitions.py", "make_premium_thumbnail.py"):
              if marker not in render:
                  raise SystemExit(f"Renderer assembly is missing: {marker}")
          scene_render = wf["jobs"]["render"]["steps"][names.index("Render scenes")].get("run", "")
          for marker in ("def shot_filter(i)", "sin(t*0.58", "zoompan=", "ai_security_3d_hero.png", "scene_overlay_", "vignette=PI/5", "saturation=1.18"):
              if marker not in scene_render:
                  raise SystemExit(f"Scene motion/3D overlay is missing: {marker}")
          brand_script = Path("tools/make_brand_assets.py").read_text(encoding="utf-8")
          if "def draw_3d_text" not in brand_script or "draw_3d_text(draw" not in brand_script:
              raise SystemExit("Channel intro has lost its extruded 3D logo/text.")
          if "retention-days: 7" not in Path(".github/workflows/manual.yml").read_text(encoding="utf-8"):
              raise SystemExit("Seven-day recovery artifact retention is missing.")
          research_wf = yaml.load(Path(".github/workflows/daily-content-research.yml").read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          research_names = [step.get("name", "") for step in research_wf["jobs"]["research-and-script"]["steps"]]
          if not any(item.get("cron") == "0 14 * * *" for item in research_wf.get("on", {}).get("schedule", [])):
              raise SystemExit("Daily US topic research schedule is missing.")
          if not all(x in research_names for x in ["Verify free-provider configuration", "Select one US topic from YouTube Data API v3 trend signals, research with Tavily, write and audit script with Groq", "Ask Groq for a topic-specific thumbnail brief and render the preview", "Publish research package artifact for human script and voice approval"]):
              raise SystemExit("Daily research stages are missing or out of order.")
          if not all(x in Path(".github/workflows/daily-content-research.yml").read_text(encoding="utf-8") for x in ["WORKER_AUTH_TOKEN", "TAVILY_API_KEY", "GROQ_API_KEY", "openai/gpt-oss-20b", "/youtube/access-token"]):
              raise SystemExit("Daily topic workflow is not configured for YouTube v3 + Tavily + Groq.")
          if not all(research_names.index(a) < research_names.index(b) for a,b in zip(research_names[1:], research_names[2:])):
              raise SystemExit("Daily research steps are not ordered.")
          research_code = Path("tools/daily_content_research.py").read_text(encoding="utf-8")
          for marker in ("videos.list", "mostPopular", "Tavily Search API", "research_queries", "hook_score < 7", "previous_video_feedback", "SCRIPT_PACKAGE_READY_FOR_MANUAL_VOICE_APPROVAL", "YOUTUBE_ACCESS_TOKEN"):
              if marker not in research_code:
                  raise SystemExit(f"Daily research implementation missing: {marker}")
          router_code = Path("tools/groq_video_review.py").read_text(encoding="utf-8")
          for marker in ("qwen/qwen3.8-27b", "video_frame_", "thumbnail_review", "near_black_frame_ratio", "decision", "next_video_rules"):
              if marker not in router_code:
                  raise SystemExit(f"Final video review implementation missing: {marker}")
          if "_LAST_GROQ_START" not in research_code or "61.0 -" not in research_code:
              raise SystemExit("Research Groq requests must be spaced to respect the free-tier token budget.")
          if "Review these two actual sampled frames" not in router_code or 'sampled_frames"][:2]' not in router_code:
              raise SystemExit("Vision review must keep sampled image tokens inside the free-tier budget.")
          if "contents: write" not in Path(".github/workflows/manual.yml").read_text(encoding="utf-8"):
              raise SystemExit("Persisting next-video QA feedback needs repository write permission.")
          if not Path("learning/latest_video_review.json").is_file():
              raise SystemExit("The feedback memory file is missing.")
          import sys
          sys.path.insert(0, "tools")
          import daily_content_research as dcr
          assert abs(dcr.duration_seconds("PT5M12.5S") - 312.5) < 0.01
          assert dcr.extract_json('{"ok":true}')["ok"] is True
          source_fixture = dcr.clean_sources([
              {"title":"Official evidence","url":"https://example.org/a","content":"Evidence A"},
              {"title":"Duplicate","url":"https://example.org/a","content":"Duplicate"},
              {"title":"Not secure","url":"http://example.org/b","content":"B"}])
          assert len(source_fixture) == 1 and source_fixture[0]["title"] == "Official evidence"
          print("Static validation passed: YouTube trend discovery, Tavily research, Groq writing/hook audit, topic thumbnail, visual/audio review, upload gate, and next-video learning.")
          PY

      - name: Generate original branded assets for landscape and portrait
        run: |
          set -euo pipefail
          mkdir -p work assets
          python tools/make_brand_assets.py --format LONG_VIDEO --outdir assets
          python - <<'PY'
          from PIL import Image
          for path, expected in [
              ("assets/ai_tech_lab_intro.png", (1920, 1080)),
              ("assets/ai_tech_lab_subscribe.png", (1000, 250)),
          ]:
              with Image.open(path) as im:
                  if im.size != expected:
                      raise SystemExit(f"{path}: expected {expected}, got {im.size}")
                  im.verify()
          PY
          python tools/make_brand_assets.py --format SHORT --outdir assets
          python - <<'PY'
          from PIL import Image
          with Image.open("assets/ai_tech_lab_intro.png") as im:
              if im.size != (1080, 1920):
                  raise SystemExit(f"Portrait dimensions incorrect: {im.size}")
              im.verify()
          print("Original intro and subscribe assets passed Pillow verification.")
          PY

      - name: Smoke-test the topic-matched 3D thumbnail generator
        run: |
          set -euo pipefail
          mkdir -p work output
          printf '%s' 'AI Agent Security: Why Testing Before Release Matters' > work/title.txt
          python tools/make_premium_thumbnail.py --title-file work/title.txt --output output/thumbnail-smoke-test.jpg
          python - <<'PY'
          from PIL import Image
          p = "output/thumbnail-smoke-test.jpg"
          with Image.open(p) as im:
              if im.size != (1280, 720):
                  raise SystemExit(f"Premium thumbnail wrong size: {im.size}")
              im.verify()
          print("Topic-matched 3D-style thumbnail generated and verified.")
          PY

      - name: Smoke-test transparent 3D security hero overlay
        run: |
          set -euo pipefail
          mkdir -p work output
          printf '%s' 'AI Agent Security: Why Testing Before Release Matters' > work/title.txt
          python tools/make_3d_hero_overlay.py work/title.txt output/3d-security-hero.png
          python - <<'PY'
          from PIL import Image
          path = "output/3d-security-hero.png"
          with Image.open(path) as im:
              if im.size != (720, 720) or im.mode != "RGBA":
                  raise SystemExit(f"3D overlay dimensions/mode invalid: {im.size}, {im.mode}")
              alpha = im.getchannel("A")
              if alpha.getextrema() != (0, 255):
                  raise SystemExit(f"3D overlay transparency was not preserved: {alpha.getextrema()}")
              im.load()
          print("Transparent 3D security hero generated and verified.")
          PY

      - name: Smoke-test cinematic camera movement on footage
        run: |
          set -euo pipefail
          mkdir -p work output
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=4" -an -c:v libx264 -pix_fmt yuv420p work/camera_input.mp4
          ffmpeg -hide_banner -loglevel error -y -i work/camera_input.mp4 -t 4 -vf "rotate='0.0025*sin(t*0.34)':c=black@0.0:ow=rotw(0.005):oh=roth(0.005),scale=1400:790:force_original_aspect_ratio=increase,crop=1280:720:x='(in_w-out_w)*(0.5+0.26*sin(t*0.58))':y='(in_h-out_h)*(0.5+0.18*cos(t*0.43))',setsar=1,eq=contrast=1.08:saturation=1.08,unsharp=5:5:0.45:3:3:0.0" -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p work/camera_motion_smoke.mp4
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 work/camera_motion_smoke.mp4 | grep -qx '1280,720'
          test -s work/camera_motion_smoke.mp4
          echo "Camera drift, small roll, contrast, and sharpening passed FFmpeg smoke test."

      - name: Smoke-test FFmpeg crossfade renderer
        run: |
          set -euo pipefail
          mkdir -p scenes work
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=blue:s=640x360:r=30:d=3" -an -c:v libx264 -pix_fmt yuv420p scenes/scene_test_a.mp4
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=yellow:s=640x360:r=30:d=3" -an -c:v libx264 -pix_fmt yuv420p scenes/scene_test_b.mp4
          printf 'test_a\t0\t2\t2\tgenerated\tblue scene\tBlue\ntest_b\t2\t4\t2\tgenerated\tyellow scene\tYellow\n' > work/scenes.tsv
          python tools/render_transitions.py --target-duration 5.5 --transition 0.5 --output work/transition-smoke-test.mp4
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          report = json.loads(Path("work/transitions_report.json").read_text())
          if report.get("scenes") != 2 or report.get("loops_entire_video") is not False:
              raise SystemExit(f"Transition report mismatch: {report}")
          duration = float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1","work/transition-smoke-test.mp4"],text=True))
          if not 5.3 <= duration <= 5.7:
              raise SystemExit(f"Transition render duration mismatch: {duration:.2f}s")
          print("FFmpeg crossfade smoke test passed:", report)
          PY

      - name: Generate and probe original background music
        run: |
          set -euo pipefail
          python tools/generate_music.py --duration 8 --topic "AI research future technology" --output work/ci_music.wav
          test -s work/ci_music.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 work/ci_music.wav
          test -s work/music_report.json
          python - <<'PY'
          import wave
          with wave.open("work/ci_music.wav", "rb") as wav:
              if wav.getnchannels() != 2 or wav.getnframes() <= 0 or wav.getframerate() <= 0:
                  raise SystemExit("Generated score did not pass WAV validation.")
          print("Original stereo music successfully generated.")
          PY

      - name: Test SEO limits using a source-linked fixture
        run: |
          set -euo pipefail
          cat > work/production_manifest.json <<'JSON'
          {
            "topic": "How AI research agents verify sources",
            "seo": {
              "title": "How AI Research Agents Verify Sources: What Actually Works",
              "description": "Explore how AI research agents gather sources, check claims, and handle uncertainty. This original explainer compares verifiable capabilities with practical limitations.",
              "tags": ["AI research agents", "source verification", "AI tools"]
            },
            "sources": [
              {"title":"Research documentation","url":"https://www.nist.gov/"},
              {"title":"AI research overview","url":"https://arxiv.org/"}
            ]
          }
          JSON
          printf '%s' 'AI and Future Technology latest trends news topics' > work/title.txt
          printf '%s' 'Explore how AI research agents gather sources, check claims, and handle uncertainty. This original explainer compares verifiable capabilities with practical limitations.' > work/description.txt
          printf '%s' 'AI research agents, source verification, AI tools' > work/tags.txt
          cat > work/script.txt <<'TXT'
          AI research agents help organize information. This explainer reviews source verification, evidence quality, attribution, limitations, and responsible use. We compare source verification and practical AI workflows. We discuss what the evidence shows and what it does not show.
          TXT
          cat > work/scenes.tsv <<'TSV'
          1	0	12	12	generated	AI research agents	Opening and overview
          2	12	30	18	generated	Source verification	How source verification works
          3	30	50	20	generated	Limitations and practical checks	Limitations and practical checks
          TSV
          CONTENT_FORMAT=LONG_VIDEO python tools/seo_metadata.py
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/seo_report.json").read_text(encoding="utf-8"))
          title = Path("work/title.txt").read_text(encoding="utf-8").strip()
          tags = Path("work/tags.txt").read_text(encoding="utf-8").strip()
          desc = Path("work/description.txt").read_text(encoding="utf-8")
          assert 1 <= len(title) <= 100, len(title)
          assert len(tags) <= 500, len(tags)
          assert 1 <= len(desc) <= 5000, len(desc)
          assert "SOURCES & FURTHER READING" in desc
          assert report["tag_count"] > 0 and report["source_url_count"] > 0
          print(json.dumps({"title": title, "tag_characters": len(tags), "description_characters": len(desc), "sources": report["source_url_count"]}))
          PY
