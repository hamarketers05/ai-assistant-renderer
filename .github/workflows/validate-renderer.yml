name: Renderer Static Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tools/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: Validate renderer, SEO, brand assets and original audio
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check PyYAML==6.0.2 numpy scipy pillow matplotlib opencv-python-headless pydub faster-whisper librosa==0.11.0 soundfile

      - name: Compile project tools and validate workflow order
        run: |
          set -euo pipefail
          python -m py_compile tools/generate_music.py tools/make_evidence_charts.py tools/voice_editor.py tools/make_brand_assets.py tools/seo_metadata.py tools/fetch_free_video.py tools/make_premium_thumbnail.py tools/make_3d_hero_overlay.py tools/generate_kokoro_voice.py tools/render_transitions.py tools/scene_director.py tools/groq_thumbnail_brief.py tools/daily_content_research.py tools/groq_video_review.py tools/convert_video_3d.py tools/convert_video_midas_sbs.py tools/asset_reuse_guard.py tools/make_transition_sfx.py tools/write_editing_tool_manifest.py
          python - <<'PY'
          from pathlib import Path
          import ast
          import yaml

          for path in sorted(Path(".github/workflows").glob("*.yml")):
              obj = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              if not isinstance(obj, dict) or not obj.get("name") or not isinstance(obj.get("jobs"), dict):
                  raise SystemExit(f"Workflow YAML structure invalid: {path}")
              print(f"YAML parsed: {path}")

          for path in Path("tools").glob("*.py"):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))

          import librosa
          import numpy as np
          probe = np.sin(np.linspace(0, 24 * np.pi, 24000, dtype=np.float32))[None, :]
          enhanced = librosa.effects.preemphasis(probe, coef=0.65)
          if enhanced.shape != probe.shape or not np.isfinite(enhanced).all():
              raise SystemExit("Librosa voice effect changed audio length or returned invalid samples.")
          print("Librosa audio effect smoke test passed; sample count is preserved.")

          wf = yaml.load(Path(".github/workflows/manual.yml").read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          names = [step.get("name", "") for step in wf["jobs"]["render"]["steps"]]
          required = [
              "Validate Kokoro narration before scene timing",
              "Build sentence-by-sentence visual direction",
              "Edit generated narration, add pauses and script cues, and generate captions",
              "Generate original topic-aware background score",
              "Find additional free, topic-matched Wikimedia Commons footage",
              "Bootstrap visual history from recent verified production deliveries",
              "Reject previously used or weakly matched visual assets",
              "Add stock creator and license attribution",
              "Generate only evidence-supported data charts",
              "Improve SEO title, description, tags, sources and chapters",
              "Create AI Tech Lab branded intro and subscribe popup",
              "Assemble final video and thumbnail",
              "QA rendered production",
              "Verify narration, music, captions, and premium thumbnail assets",
              "Groq router reviews rendered video, visual match, audio assets and thumbnail",
              "Save video artifacts",
              "Persist final QA feedback for the next video",
              "Block upload if final quality review found critical issues",
              "Require script-relevant licensed footage before upload",
              "Check existing YouTube upload",
              "Verify uploaded video with YouTube Data API v3",
          ]
          missing = [x for x in required if x not in names]
          if missing:
              raise SystemExit("Missing production stages: " + ", ".join(missing))
          if not (names.index(required[0]) < names.index(required[1]) < names.index("Discover and download Vecteezy footage")):
              raise SystemExit("Voice validation and sentence-level scene planning must precede asset discovery.")
          if not Path("tools/scene_director.py").is_file() or not Path("tools/groq_thumbnail_brief.py").is_file():
              raise SystemExit("Sentence scene director or Groq thumbnail brief tool is missing.")
          ordered_assets = [
              "Edit generated narration, add pauses and script cues, and generate captions",
              "Apply optional topic-aware Rubber Band pitch shaping",
              "Build sentence-by-sentence visual direction",
              "Discover and download Vecteezy footage",
              "Find additional free, topic-matched Wikimedia Commons footage",
              "Bootstrap visual history from recent verified production deliveries",
              "Reject previously used or weakly matched visual assets",
              "Add stock creator and license attribution",
              "Create original graphics",
              "Generate only evidence-supported data charts",
              "Generate script-matched illustrated scenes",
              "Render scenes",
              "Generate original topic-aware background score",
              "Improve SEO title, description, tags, sources and chapters"
          ]
          if not all(names.index(a) < names.index(b) for a,b in zip(ordered_assets, ordered_assets[1:])):
              raise SystemExit("Voice timing, new media, attribution, scene render, music and SEO are out of order.")
          if not (names.index("Validate Kokoro narration before scene timing") < names.index("Edit generated narration, add pauses and script cues, and generate captions") < names.index("Build sentence-by-sentence visual direction")):
              raise SystemExit("Actual edited-voice timestamps must be written before the scene planner runs.")
          voice_code = Path("tools/voice_editor.py").read_text(encoding="utf-8")
          director_code = Path("tools/scene_director.py").read_text(encoding="utf-8")
          history_code = Path("tools/asset_reuse_guard.py").read_text(encoding="utf-8")
          if "voice_word_timestamps.json" not in voice_code or "exact_word_timing" not in director_code:
              raise SystemExit("Word timestamps from the final voice must drive the scene planner.")
          for marker in ("asset was used in a previously delivered video", "same asset selected for multiple scenes", "relevance", "seeded_from_previous_verified_renderer_artifact"):
              if marker.lower() not in history_code.lower():
                  raise SystemExit(f"Visual novelty guard lacks required logic: {marker}")
          if "actions: read" not in Path(".github/workflows/manual.yml").read_text(encoding="utf-8"):
              raise SystemExit("Bootstrapping the previous production manifest requires read-only Actions permission.")
          ordered_final = ["Create AI Tech Lab branded intro and subscribe popup", "Assemble final video and thumbnail", "QA rendered production", "Verify narration, music, captions, and premium thumbnail assets", "Groq router reviews rendered video, visual match, audio assets and thumbnail", "Save video artifacts", "Persist final QA feedback for the next video", "Block upload if final quality review found critical issues", "Require script-relevant licensed footage before upload", "Check existing YouTube upload", "Convert final master to 3D before YouTube upload", "Create per-video editing tool execution manifest", "Save editing manifest artifact", "Save verified 3D upload artifact", "Get YouTube access token", "Prepare YouTube metadata and schedule", "Upload video using YouTube Data API", "Record uploaded video and schedule", "Set custom thumbnail", "Verify uploaded video with YouTube Data API v3", "Persist unique visual asset history after verified YouTube delivery"]
          if not all(names.index(a) < names.index(b) for a,b in zip(ordered_final, ordered_final[1:])):
              raise SystemExit("Final media QA, strict license gate and upload check are out of order.")
          for path in (Path("tools/fetch_free_video.py"), Path("tools/make_premium_thumbnail.py")):
              if not path.is_file():
                  raise SystemExit(f"Required tool is missing: {path}")
          if not (names.index("Find additional free, topic-matched Wikimedia Commons footage") < names.index("Improve SEO title, description, tags, sources and chapters") < names.index("Create AI Tech Lab branded intro and subscribe popup") < names.index("Assemble final video and thumbnail")):
              raise SystemExit("Research assets, SEO, brand intro and rendering are out of order.")
          voice = wf["jobs"]["render"]["steps"][names.index("Validate Kokoro narration before scene timing")].get("run", "")
          if "work/kokoro_tts_report.json" not in voice or "quality_gate" not in voice:
              raise SystemExit("Kokoro narration must pass automated quality validation before scene timing.")
          gate = wf["jobs"]["render"]["steps"][names.index("Validate configuration and Kokoro voice pipeline")].get("run", "")
          if "work/script.txt" not in gate:
              raise SystemExit("Original script must be staged before Kokoro narration generation.")
          kokoro_names = ["Validate configuration and Kokoro voice pipeline", "Generate, master and validate Kokoro narration", "Request production manifest", "Validate Kokoro narration before scene timing"]
          if not all(names.index(left) < names.index(right) for left, right in zip(kokoro_names, kokoro_names[1:])):
              raise SystemExit("Kokoro generation and QA must precede scene timing and rendering.")
          workflow_source = Path(".github/workflows/manual.yml").read_text(encoding="utf-8")
          if "APPROVED VOICE GATE" in workflow_source or "AUDIO_URL: ${{ inputs.audio_url }}" in workflow_source or "Fetch and validate approved narration" in workflow_source:
              raise SystemExit("Renderer must not require a manually approved voice or supplied audio URL.")
          render = wf["jobs"]["render"]["steps"][names.index("Assemble final video and thumbnail")].get("run", "")
          for marker in ("ai_tech_lab_intro.png", "ai_tech_lab_subscribe.png", "work/voice_edited.wav", "work/music.wav", "work/transition_sfx.wav", "tools/make_transition_sfx.py", "apulsator=mode=sine:amount=0.75:width=1.5:hz=0.08", "drawbox=x=0:y=0:w=iw:h=131", "loudnorm=I=-14", "tools/render_transitions.py", "make_premium_thumbnail.py"):
              if marker not in render:
                  raise SystemExit(f"Renderer assembly is missing: {marker}")
          scene_render = wf["jobs"]["render"]["steps"][names.index("Render scenes")].get("run", "")
          for marker in ("def shot_filter(i)", "sin(t*0.58", "zoompan=", "ai_security_3d_hero.png", "scene_overlay_", "vignette=PI/5", "saturation=1.10", "colorbalance=", "noise=alls=1.2:allf=t"):
              if marker not in scene_render:
                  raise SystemExit(f"Scene motion/3D overlay is missing: {marker}")
          brand_script = Path("tools/make_brand_assets.py").read_text(encoding="utf-8")
          if "def draw_3d_text" not in brand_script or "draw_3d_text(draw" not in brand_script:
              raise SystemExit("Channel intro has lost its extruded 3D logo/text.")
          if "retention-days: 7" not in Path(".github/workflows/manual.yml").read_text(encoding="utf-8"):
              raise SystemExit("Seven-day recovery artifact retention is missing.")
          research_wf = yaml.load(Path(".github/workflows/daily-content-research.yml").read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          research_names = [step.get("name", "") for step in research_wf["jobs"]["research-and-script"]["steps"]]
          if not any(item.get("cron") == "0 14 * * *" for item in research_wf.get("on", {}).get("schedule", [])):
              raise SystemExit("Daily US topic research schedule is missing.")
          if not all(x in research_names for x in ["Verify free-provider configuration", "Select one US topic from YouTube Data API v3 trend signals, research with Tavily, write and audit script with Groq", "Ask Groq for a topic-specific thumbnail brief and render the preview", "Publish research package artifact for Kokoro voice production"]):
              raise SystemExit("Daily research stages are missing or out of order.")
          if not all(x in Path(".github/workflows/daily-content-research.yml").read_text(encoding="utf-8") for x in ["WORKER_AUTH_TOKEN", "TAVILY_API_KEY", "GROQ_API_KEY", "openai/gpt-oss-20b", "/youtube/access-token"]):
              raise SystemExit("Daily topic workflow is not configured for YouTube v3 + Tavily + Groq.")
          if not all(research_names.index(a) < research_names.index(b) for a,b in zip(research_names[1:], research_names[2:])):
              raise SystemExit("Daily research steps are not ordered.")
          research_code = Path("tools/daily_content_research.py").read_text(encoding="utf-8")
          for marker in ("videos.list", "mostPopular", "Tavily Search API", "research_queries", "hook_score < 7", "previous_video_feedback", "SCRIPT_PACKAGE_READY_FOR_KOKORO_VOICE_PRODUCTION", "YOUTUBE_ACCESS_TOKEN"):
              if marker not in research_code:
                  raise SystemExit(f"Daily research implementation missing: {marker}")
          for marker in ("PERSONAL PERSONA", "unique predictions", "hot takes", "personal opinions", "futuristic theories", "clearly distinguish opinions and forecasts from verified facts"):
              if marker.lower() not in research_code.lower():
                  raise SystemExit(f"Human-sounding, evidence-aware Personal Persona prompt missing: {marker}")
          thumbnail_code = Path("tools/make_premium_thumbnail.py").read_text(encoding="utf-8")
          for marker in ("Python/Pillow only", "cinematic bars", "pop-out", "draw_chip", "draw_shield", "Image.Resampling.LANCZOS"):
              if marker.lower() not in thumbnail_code.lower():
                  raise SystemExit(f"Python/Pillow 3D pop-out thumbnail feature missing: {marker}")
          renderer_text = Path(".github/workflows/manual.yml").read_text(encoding="utf-8")
          if "InferenceClient" in thumbnail_code or "huggingface_hub" in thumbnail_code or "HF_TOKEN:" in renderer_text:
              raise SystemExit("Thumbnail generation must be local Python/Pillow only; no remote image API or token.")
          kokoro_code = Path("tools/generate_kokoro_voice.py").read_text(encoding="utf-8")
          if "KPipeline" not in kokoro_code or "af_heart" not in kokoro_code:
              raise SystemExit("Kokoro American-English voice generator is missing.")
          voice_editor_code = Path("tools/voice_editor.py").read_text(encoding="utf-8")
          sbs_code = Path("tools/convert_video_midas_sbs.py").read_text(encoding="utf-8")
          if "librosa.effects.preemphasis" not in voice_editor_code or "duration_preserved" not in voice_editor_code:
              raise SystemExit("Required duration-preserving librosa voice enhancement is missing.")
          if "deesser=i=0.22:m=0.30:f=0.55" not in voice_editor_code:
              raise SystemExit("Automatic narration must include the validated light de-esser stage.")
          sfx_code = Path("tools/make_transition_sfx.py").read_text(encoding="utf-8")
          manifest_code = Path("tools/write_editing_tool_manifest.py").read_text(encoding="utf-8")
          for marker in ("synthesize_event", "work/transition_sfx_report.json", "no third-party audio samples".lower()):
              if marker.lower() not in sfx_code.lower():
                  raise SystemExit(f"Procedural, royalty-free transition SFX implementation missing: {marker}")
          for marker in ("FLUX.1 [schnell]", "Demucs", "DaVinci Resolve", "not_installed", "editing_tools", "color grade"):
              if marker.lower() not in manifest_code.lower():
                  raise SystemExit(f"Per-video editing tool manifest incomplete: {marker}")
          director_code = Path("tools/scene_director.py").read_text(encoding="utf-8")
          if "word-timestamped clause-aware scene phrases" not in director_code or "target=max(2.4" not in director_code:
              raise SystemExit("Scene director must schedule visual change points around short voice-aligned phrases.")
          transitions_code = Path("tools/render_transitions.py").read_text(encoding="utf-8")
          for marker in ('"pixelize"', '"zoomin"', 'transition_frames_at_30fps'):
              if marker not in transitions_code:
                  raise SystemExit(f"Cinematic short transition option is missing: {marker}")
          for marker in ("CINEMATIC_LUT_URL", "CINEMATIC_LUT_GIT_BLOB_SHA", "cinematic.cube", "cinematic_ffmpeg.cube", "LUT_3D_INPUT_RANGE", "build_rec709_to_cineon_lut", "lut_input_expected", "rec709_to_cineon_transform_applied", "lut3d=file=", "interp=trilinear", "color_grade_applied"):
              if marker not in sbs_code:
                  raise SystemExit(f"Required pinned cinematic LUT integration is missing: {marker}")
          review_code = Path("tools/groq_video_review.py").read_text(encoding="utf-8")
          if '"manual_voice_required": False' not in voice_editor_code or "Kokoro-82M American-English narration" not in review_code:
              raise SystemExit("Voice editor or final QA still expects a manually approved voice.")
          for marker in ("Generate, master and validate Kokoro narration", "manual_voice_approval_required", "quality_gate", "ai-assistant-audio", "work/kokoro_audio_quality.json"):
              if marker not in renderer_text:
                  raise SystemExit(f"Kokoro auto-voice integration missing: {marker}")
          stereo_code = Path("tools/convert_video_3d.py").read_text(encoding="utf-8")
          for marker in ("JulesMellot/2D3D", "PINNED_COMMIT", "frame-packing=3", "fast", "0.015", "0.55", "main_video_untouched", "failed_optional_export", "ANAGLYPH", "SBS", "TB"):
              if marker.lower() not in stereo_code.lower():
                  raise SystemExit(f"Optional 2D3D safe-export integration missing: {marker}")
          stereo_code = Path("tools/convert_video_3d.py").read_text(encoding="utf-8")
          for marker in ("JulesMellot/2D3D", "PINNED_COMMIT", "frame-packing=3", "fast", "0.015", "0.55", "main_video_untouched", "failed_optional_export", "ANAGLYPH", "SBS", "TB", "--require-success"):
              if marker.lower() not in stereo_code.lower():
                  raise SystemExit(f"Required 2D3D conversion safeguard missing: {marker}")
          manual_text = Path(".github/workflows/manual.yml").read_text(encoding="utf-8")
          for marker in ("stereo_output:", "default: SBS", "Convert final master to 3D before YouTube upload", "Save verified 3D upload artifact", "output/AI_TECH_LAB_", "_3D_", "--require-success", "work/stereo_3d_report.json"):
              if marker not in manual_text:
                  raise SystemExit(f"Pre-upload stereoscopic conversion control missing: {marker}")
          manual_names = [step.get("name", "") for step in wf["jobs"]["render"]["steps"]]
          if not manual_names.index("Check existing YouTube upload") < manual_names.index("Convert final master to 3D before YouTube upload") < manual_names.index("Upload video using YouTube Data API"):
              raise SystemExit("3D conversion must finish before the YouTube upload step.")
          upload_step = wf["jobs"]["render"]["steps"][manual_names.index("Upload video using YouTube Data API")].get("run", "")
          expected_video = 'VIDEO="output/AI_TECH_LAB_${CONTENT_ID}_3D_' + chr(36) + '{{ inputs.stereo_output }}.mp4"'
          if expected_video not in upload_step:
              raise SystemExit("YouTube upload must use the 3D output, never the standard 2D source.")
          router_code = Path("tools/groq_video_review.py").read_text(encoding="utf-8")
          for marker in ("qwen/qwen3.8-27b", "video_frame_", "thumbnail_review", "near_black_frame_ratio", "decision", "next_video_rules"):
              if marker not in router_code:
                  raise SystemExit(f"Final video review implementation missing: {marker}")
          if "_LAST_GROQ_START" not in research_code or "61.0 -" not in research_code:
              raise SystemExit("Research Groq requests must be spaced to respect the free-tier token budget.")
          if "Review these two actual sampled frames" not in router_code or 'sampled_frames"][:2]' not in router_code:
              raise SystemExit("Vision review must keep sampled image tokens inside the free-tier budget.")
          if "contents: write" not in Path(".github/workflows/manual.yml").read_text(encoding="utf-8"):
              raise SystemExit("Persisting next-video QA feedback needs repository write permission.")
          if not Path("learning/latest_video_review.json").is_file():
              raise SystemExit("The feedback memory file is missing.")
          import sys
          sys.path.insert(0, "tools")
          import daily_content_research as dcr
          assert abs(dcr.duration_seconds("PT5M12.5S") - 312.5) < 0.01
          assert dcr.extract_json('{"ok":true}')["ok"] is True
          source_fixture = dcr.clean_sources([
              {"title":"Official evidence","url":"https://example.org/a","content":"Evidence A"},
              {"title":"Duplicate","url":"https://example.org/a","content":"Duplicate"},
              {"title":"Not secure","url":"http://example.org/b","content":"B"}])
          assert len(source_fixture) == 1 and source_fixture[0]["title"] == "Official evidence"
          import subprocess, sys, tempfile
          with tempfile.TemporaryDirectory() as td:
              report = Path(td) / "stereo-off.json"
              unused_input = Path(td) / "does-not-exist.mp4"
              unused_output = Path(td) / "must-not-be-created.mp4"
              subprocess.run([sys.executable, "tools/convert_video_3d.py", "--input", str(unused_input), "--output", str(unused_output), "--mode", "OFF", "--report", str(report)], check=True)
              result = __import__("json").loads(report.read_text(encoding="utf-8"))
              assert result["status"] == "disabled" and result["main_video_untouched"] is True
              assert not unused_output.exists()
          print("Static validation passed: research, Groq, thumbnail, audio/visual QA, upload gate, learning, and safe optional 2D3D export.")
          PY

      - name: Smoke-test voice-aligned scene cadence and editing tool manifest
        run: |
          set -euo pipefail
          mkdir -p work output assets
          python - <<'PY'
          import json, re
          from pathlib import Path
          words = ("AI systems need reliable sources for every important claim because small details "
                   "change quickly while clear visuals explain the technology in practice today").split()
          tokens = (words * 6)[:120]
          script = " ".join(word + ("." if (i + 1) % 12 == 0 else ("," if (i + 1) % 6 == 0 else ""))
                             for i, word in enumerate(tokens))
          Path("work/script.txt").write_text(script, encoding="utf-8")
          timestamp_words = [{"start": round(i * 0.5, 3), "end": round(i * 0.5 + 0.4, 3), "text": word}
                             for i, word in enumerate(tokens)]
          Path("work/voice_word_timestamps.json").write_text(json.dumps({
              "duration_seconds": 60.0, "word_count": len(timestamp_words), "words": timestamp_words
          }), encoding="utf-8")
          PY
          python tools/scene_director.py --script work/script.txt --duration 60 --max-scenes 90 --timestamps work/voice_word_timestamps.json
          python - <<'PY'
          import json
          from pathlib import Path
          scene = json.loads(Path("work/scene_director_report.json").read_text(encoding="utf-8"))
          average = scene.get("scene_duration_seconds", {}).get("mean", 99)
          if scene.get("exact_word_timing") is not True or scene.get("planned_visual_scenes", 0) < 12 or average > 4.5:
              raise SystemExit(f"Voice-aligned 3-4 second scene cadence did not pass: {scene}")
          n = int(scene["planned_visual_scenes"])
          Path("work/voice_edit_report.json").write_text(json.dumps({"status":"passed", "timestamped_words":120}),encoding="utf-8")
          Path("work/transitions_report.json").write_text(json.dumps({"scenes":n,"transition":"alternating cinematic xfade","rendered_duration_seconds":60}),encoding="utf-8")
          Path("work/transition_sfx_report.json").write_text(json.dumps({"status":"generated","transition_count":n-1,"cue_lead_seconds":0.22,"source_license":"Original synthesized effects; no third-party audio samples."}),encoding="utf-8")
          Path("work/music_report.json").write_text(json.dumps({"status":"generated","source":"original_synthesized","uses_external_samples":False}),encoding="utf-8")
          Path("work/opencv_visual_qa.json").write_text(json.dumps({"status":"passed","sample_frames":10}),encoding="utf-8")
          Path("work/rendered_scene_assets_report.json").write_text(json.dumps({"status":"passed","rendered_scene_count":n,"evidence_charts_used":0,"transparent_hud_overlay_applied_count":3,"licensed_stock_broll_scene_count":4,"python_pillow_scene_count":n-4}),encoding="utf-8")
          Path("work/asset_reuse_report.json").write_text(json.dumps({"status":"validated","previous_video_reuse":False,"within_video_duplicates":False}),encoding="utf-8")
          Path("work/evidence_charts_report.json").write_text(json.dumps({"charts_created":[],"charts_requested":0}),encoding="utf-8")
          Path("work/stereo_3d_report.json").write_text(json.dumps({"status":"disabled"}),encoding="utf-8")
          Path("work/kokoro_audio_quality.json").write_text(json.dumps({"quality_gate":"passed"}),encoding="utf-8")
          Path("work/thumbnail_brief.json").write_text(json.dumps({"hook":"TEST HOOK"}),encoding="utf-8")
          Path("work/asset_sources.jsonl").write_text("\n".join(json.dumps({"provider":"LicenseFixture", "scene":str(i), "source_url":"https://example.org/"+str(i), "creator":"CI fixture"}) for i in range(4)) + "\n",encoding="utf-8")
          Path("output/manifest-smoke.mp4").write_bytes(b"fixture" * 20000)
          from PIL import Image
          Image.new("RGB",(1280,720),(4,18,36)).save("output/manifest-smoke.jpg",quality=90)
          PY
          python tools/write_editing_tool_manifest.py --content-id 9876 --format SHORT --stereo-output SBS --final-video output/manifest-smoke.mp4 --thumbnail output/manifest-smoke.jpg --output work/editing_tool_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/editing_tool_manifest.json").read_text(encoding="utf-8"))
          if report.get("status") != "passed" or report.get("transition_sfx_count", 0) < 1:
              raise SystemExit(f"Per-video editing manifest did not pass: {report}")
          if report.get("visual_assets", {}).get("planned_voice_aligned_scenes", 0) < 12:
              raise SystemExit(f"Actual visual asset counts were not written: {report}")
          print("Voice-aligned scene cadence and per-video used/skipped-tool manifest smoke test passed.")
          PY

      - name: Smoke-test optional stereoscopic gate without downloading models
        run: |
          set -euo pipefail
          mkdir -p work
