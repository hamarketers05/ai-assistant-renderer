name: Launch researched AI Tech Lab video 21

on:
  push:
    branches: [main]
    paths:
      - "production/launch_ai_tech_lab_content_21.json"

permissions:
  contents: read
  actions: write

concurrency:
  group: launch-ai-tech-lab-content-21
  cancel-in-progress: false

jobs:
  dispatch-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout launch package
        uses: actions/checkout@v4

      - name: Validate fresh research package and schedule
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          FILE=production/launch_ai_tech_lab_content_21.json
          test -s "$FILE"
          jq -e '.content_id == "21" and .content_format == "LONG_VIDEO" and .title and (.script | length > 3000) and .description and .tags and (.sources | length >= 3)' "$FILE" >/dev/null
          WORDS=$(jq -r '.script' "$FILE" | wc -w)
          [ "$WORDS" -ge 850 ] || { echo "Research script too short: $WORDS words"; exit 1; }
          for source in "https://www.aisi.gov.uk/" "https://apnews.com/" "https://www.ncsc.gov.uk/"; do
            jq -e --arg prefix "$source" '[.sources[].url | select(startswith($prefix))] | length > 0' "$FILE" >/dev/null || { echo "Missing required source family: $source"; exit 1; }
          done
          PUBLISH_AT=$(jq -r '.publish_at' "$FILE")
          python3 - "$PUBLISH_AT" <<'PY'
          import sys
          from datetime import datetime, timezone, timedelta
          raw=sys.argv[1].strip()
          try:
              dt=datetime.fromisoformat(raw.replace("Z","+00:00"))
          except ValueError:
              raise SystemExit("publish_at is not valid ISO 8601.")
          if dt.tzinfo is None:
              raise SystemExit("publish_at must include an explicit timezone.")
          dt=dt.astimezone(timezone.utc)
          if dt <= datetime.now(timezone.utc)+timedelta(minutes=5):
              raise SystemExit("Publish time is not safely in the future.")
          if dt.date().isoformat() != "2026-10-13":
              raise SystemExit("Expected the requested public date, October 13, 2026.")
          print("Publish UTC:",dt.isoformat())
          PY
          echo "script_words=$WORDS" >> "$GITHUB_OUTPUT"
          echo "Research package, source coverage and future publish time passed validation."

      - name: Dispatch existing GitHub Actions + FFmpeg production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PACKAGE: production/launch_ai_tech_lab_content_21.json
        shell: bash
        run: |
          set -euo pipefail
          jq '{ref:"main",inputs:{
            content_id:.content_id,
            content_format:.content_format,
            stereo_output:.stereo_output,
            title:.title,
            script:.script,
            description:.description,
            tags:.tags,
            publish_at:.publish_at
          }}' "$PACKAGE" > /tmp/workflow-dispatch.json
          CODE=$(curl -sS --retry 3 --retry-delay 2 --max-time 60 -o /tmp/dispatch-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/workflow-dispatch.json \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/manual.yml/dispatches")
          if [ "$CODE" != "204" ]; then
            echo "Production dispatch failed with HTTP $CODE."
            cat /tmp/dispatch-response.json || true
            exit 1
          fi
          echo "Dispatched existing AI Assistant Renderer for content 21."
          echo "The renderer generates Kokoro narration, renders and QA-checks the video, creates a Pillow thumbnail, converts long-form output to SBS 3D, then uploads and schedules via YouTube API."
