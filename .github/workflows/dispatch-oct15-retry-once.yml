name: One-Time October 15 Renderer Retry

on:
  push:
    branches: [main]
    paths:
      - ".github/run-once/retry-oct15-render.txt"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-render:
    if: ${{ github.event.head_commit.message == 'RETRY-AI-TECH-LAB-OCT15-RENDER-ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch October 15 long-video renderer with current fixes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg ref "main" \
            --arg content_id "23" \
            --arg content_format "LONG_VIDEO" \
            --arg stereo_output "SBS" \
            --arg title "The Dark Side of AI Automation: What You Need to Know" \
            --arg script "What if the very technology meant to make our lives easier and more efficient ends up putting us at risk? As AI agents become more autonomous, the potential risks and consequences of relying on them for critical tasks are growing. With the increasing use of AI agents in various industries, it is essential to consider the potential downsides of automation. Reports from Coursera and other researchers point to benefits as well as risks, including overreliance and weaker human oversight. Cybersecurity experts warn that AI-enabled threats require careful controls. We cannot predict every job robots will do, but workers and businesses can prepare by testing automation carefully and keeping responsibility clear.\n\nA practical way to evaluate an AI system is to ask three questions: can you understand what it does, can you explain why it made a decision, and can you check whether its outcomes are fair? Imagine a company using an AI system to manage its finances. If decisions are opaque, staff may struggle to spot mistakes, explain unusual transactions, or challenge biased outcomes. The answer is not to ban every tool; it is to set limits before handing over important decisions.\n\nStart with a low-risk task and define what a correct result looks like. Compare the system with a trusted baseline, track mistakes as well as time saved, and keep human approval for actions involving money, sensitive information, or customers. Give the system only the access it needs. If an answer cannot be traced to reliable evidence, treat it as a draft rather than a decision. Repeat tests with different inputs before expanding its role.\n\nAI automation may improve efficiency, but benefits depend on the quality of oversight, security, and the task itself. Watch for hidden cleanup work, unreliable outputs, and decisions that are difficult to reverse. Separate verified facts from forecasts, and revisit controls when the system or its permissions change. The key takeaway is simple: automate the repeatable work, measure the results, and keep accountability with people. When you assess an AI system, ask whether it is understandable, explainable, and fair—and do not give it more authority than you can safely supervise." \
            --arg description "AI automation can improve productivity, but it also introduces risks when systems are opaque, over-trusted, or given too much access. This video explains practical ways to evaluate AI agents, protect sensitive decisions, and keep human oversight in place.\n\nKEY TAKEAWAYS\n- Test AI on low-risk tasks first\n- Compare outputs with a trusted baseline\n- Track errors as well as time saved\n- Keep human approval for sensitive decisions\n- Separate verified facts from predictions\n\nSOURCES & FURTHER READING\n- Coursera: Benefits and risks of AI\n- CISA: AI-enabled cybersecurity risks\n- Anthropic: Research on AI and work\n\nSubscribe to AI Tech Lab for clear, practical coverage of AI tools, agents, and future technology." \
            --arg tags "AI Automation,AI Agents,AI Safety,AI Risks,AI Ethics,Human Oversight,Artificial Intelligence,Future of Work,Cybersecurity,AI Tools" \
            --arg category "AI Agents & Automation" \
            --arg publish_at "2026-10-15T16:00:00Z" \
            '{ref:$ref,inputs:{content_id:$content_id,content_format:$content_format,stereo_output:$stereo_output,title:$title,script:$script,description:$description,tags:$tags,editorial_category:$category,publish_at:$publish_at}}' > dispatch.json
          CODE=$(curl -sS --max-time 45 -o response.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @dispatch.json \
            "$GH_API/repos/$GH_REPO/actions/workflows/manual.yml/dispatches")
          if [ "$CODE" != "204" ]; then
            echo "Renderer dispatch failed with HTTP $CODE."
            jq '{message,errors}' response.json || true
            exit 1
          fi
          echo "Accepted renderer dispatch for content 23; target publication 2026-10-15T16:00:00Z."
