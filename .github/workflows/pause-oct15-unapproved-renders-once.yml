name: Pause October 15 render attempts until voice audio is approved

on:
  push:
    branches: [main]
    paths:
      - ".github/run-once/pause-oct15-unapproved-renders.txt"

permissions:
  actions: write
  contents: read

jobs:
  cancel-unapproved-oct15-runs:
    if: ${{ github.event.head_commit.message == 'PAUSE-OCT15-UNTIL-VOICE-APPROVAL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the two unapproved October 15 renderer runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            "38392988469|RUN-AI-TECH-LAB-OCT15-VIDEO23-FULL-QUALITY" \
            "38394392427|RUN-AI-TECH-LAB-OCT15-VIDEO25-FINAL"; do
            run_id="${spec%%|*}"
            expected="${spec#*|}"
            response=$(curl -fsS --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GH_API/repos/$GH_REPO/actions/runs/$run_id")
            name=$(printf '%s' "$response" | jq -r '.name // empty')
            commit=$(printf '%s' "$response" | jq -r '.head_commit.message // empty')
            status=$(printf '%s' "$response" | jq -r '.status // empty')
            if [ "$name" != "AI Assistant Renderer" ] || [ "$commit" != "$expected" ]; then
              echo "Refusing to cancel $run_id: workflow/commit identity mismatch."
              exit 1
            fi
            if [ "$status" = "completed" ]; then
              echo "Run $run_id already completed; no action."
              continue
            fi
            code=$(curl -sS --max-time 30 -o /tmp/cancel.json -w "%{http_code}" \
              -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GH_API/repos/$GH_REPO/actions/runs/$run_id/cancel")
            if [ "$code" != "202" ] && [ "$code" != "409" ] && [ "$code" != "200" ]; then
              echo "Cancel request for run $run_id returned HTTP $code."
              jq '{message,errors}' /tmp/cancel.json || true
              exit 1
            fi
            echo "Cancel request accepted for run $run_id (HTTP $code)."
          done
