name: One-time Main Worker Groq Proxy Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-main-worker-groq-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WORKER_URL: https://dark-sunset-a2a1.hamarketers05.workers.dev
      WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
    steps:
      - name: Probe existing authenticated Main Worker text route (no secrets printed)
        shell: bash
        run: |
          set -euo pipefail
          # Provider JSON mode is omitted; response JSON is validated by the calling script.
          test -n "$WORKER_AUTH_TOKEN"
          printf '%s' '{"messages":[{"role":"system","content":"Return exactly one valid JSON object."},{"role":"user","content":"Return only {\"probe\":\"ok\"}."}],"max_tokens":30,"temperature":0,"response_format":{"type":"json_object"}}' > request.json
          code=$(curl -sS --max-time 45 -o response.json -w "%{http_code}" \
            -X POST "$WORKER_URL/internal/ai/generate" \
            -H "Authorization: Bearer $WORKER_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @request.json)
          echo "MAIN_WORKER_GROQ_PROXY_HTTP=$code"
          if [ "$code" = "200" ]; then
            jq '{ok,provider,model,content:.choices[0].message.content}' response.json
            jq -e '.ok == true and .provider == "groq" and (.choices[0].message.content | length > 0)' response.json >/dev/null
            echo "MAIN_WORKER_GROQ_PROXY=PASS"
          else
            jq '{ok,code,error}' response.json 2>/dev/null || true
            echo "MAIN_WORKER_GROQ_PROXY=FAIL"
            exit 1
          fi

      - name: Verify Cloudflare-native source research (no content/upload)
        shell: bash
        run: |
          set -euo pipefail
          URL="$WORKER_URL/admin/research-self-test?brand=AI_TECH_LAB&q=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("latest AI agent research and product announcements in the United States"))')"
          code=$(curl -sS --max-time 180 -o research.json -w "%{http_code}" \
            -H "Authorization: Bearer $WORKER_AUTH_TOKEN" "$URL")
          echo "CLOUDFLARE_RESEARCH_HTTP=$code"
          if [ "$code" != "200" ]; then
            jq '{ok,error,detail}' research.json 2>/dev/null || true
            echo "CLOUDFLARE_RESEARCH=FAIL"
            exit 1
          fi
          jq '{ok,research_id,evidence_count,verified_claim_count,source_coverage,google_trends_api_status,google_trends_rss_status,warnings,topic_count:(.recommended_topics|length)}' research.json
          jq -e '.ok == true and .checks.research_record_saved == true and .checks.at_least_three_sources == true and .checks.two_independent_publishers == true and .checks.at_least_one_cross_checked_claim == true' research.json >/dev/null
          echo "CLOUDFLARE_RESEARCH=PASS"
