name: One-time Main Worker Groq Proxy Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-main-worker-groq-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WORKER_URL: https://dark-sunset-a2a1.hamarketers05.workers.dev
      WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
    steps:
      - name: Probe existing authenticated Main Worker text route (no secrets printed)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WORKER_AUTH_TOKEN"
          printf '%s' '{"messages":[{"role":"system","content":"Return exactly one valid JSON object."},{"role":"user","content":"Return only {\"probe\":\"ok\"}."}],"max_tokens":30,"temperature":0,"response_format":{"type":"json_object"}}' > request.json
          code=$(curl -sS --max-time 45 -o response.json -w "%{http_code}" \
            -X POST "$WORKER_URL/internal/ai/generate" \
            -H "Authorization: Bearer $WORKER_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @request.json)
          echo "MAIN_WORKER_GROQ_PROXY_HTTP=$code"
          if [ "$code" = "200" ]; then
            jq '{ok,provider,model,content:.choices[0].message.content}' response.json
            jq -e '.ok == true and .provider == "groq" and (.choices[0].message.content | length > 0)' response.json >/dev/null
            echo "MAIN_WORKER_GROQ_PROXY=PASS"
          else
            jq '{ok,code,error}' response.json 2>/dev/null || true
            echo "MAIN_WORKER_GROQ_PROXY=FAIL"
            exit 1
          fi
