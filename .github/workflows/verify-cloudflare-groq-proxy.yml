name: Verify Cloudflare Groq-compatible proxy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-cloudflare-groq-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy-smoke-test:
    name: Test authenticated central AI proxy (no publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Worker token is available without exposing it
        env:
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORKER_AUTH_TOKEN" || { echo "WORKER_AUTH_TOKEN is missing; central proxy test cannot run."; exit 1; }
          echo "WORKER_AUTH_TOKEN is configured."

      - name: Test OpenAI-compatible central Worker route
        env:
          WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          jq -n '{
            model:"openai/gpt-oss-20b",
            messages:[
              {role:"system",content:"Return only valid JSON."},
              {role:"user",content:"Return exactly this JSON object: {\"status\":\"PASS\"}"}
            ],
            temperature:0,
            max_tokens:40
          }' > work/request.json
          CODE=$(curl -sS --max-time 45 -o work/response.json -w "%{http_code}" \
            -X POST "https://dark-sunset-a2a1.hamarketers05.workers.dev/v1/chat/completions" \
            -H "Authorization: Bearer $WORKER_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @work/request.json)
          if [ "$CODE" != "200" ]; then
            echo "Central AI proxy returned HTTP $CODE."
            jq '{error:{message:.error.message,type:.error.type,code:.error.code},ok}' work/response.json 2>/dev/null || true
            exit 1
          fi
          jq -e '.choices[0].message.content | strings | length > 0' work/response.json >/dev/null || {
            echo "Central AI proxy did not return standard chat-completion content."
            jq '{id,model,choices_count:(.choices|length),error}' work/response.json || true
            exit 1
          }
          echo "CENTRAL_AI_PROXY_PASS: authenticated request returned a chat-completion response; no video was uploaded or published."
          jq '{id,model,finish_reason:.choices[0].finish_reason,content_chars:(.choices[0].message.content|length)}' work/response.json
      - name: Archive sanitized smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-groq-proxy-smoke-${{ github.run_id }}
          path: work/response.json
          retention-days: 7
          if-no-files-found: ignore
