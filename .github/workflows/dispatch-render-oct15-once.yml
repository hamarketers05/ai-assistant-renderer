name: One-Time Oct 15 Renderer Dispatch
on:
  push:
    branches: [main]
    paths:
      - ".github/run-once/render-oct15.txt"
permissions:
  actions: write
  contents: read
jobs:
  dispatch-renderers:
    if: ${{ github.event.head_commit.message == 'RUN-RENDER-OCT15-2026-ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch fixed D1 scripts to the existing renderer workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
          LONG_PAYLOAD_B64: ""
          SHORT_PAYLOAD_B64: ""
        run: |
          set -euo pipefail
          FAILED=0
          printf '%s' "$LONG_PAYLOAD_B64" | base64 -d > long.json
          CODE=$(curl -sS --max-time 45 -o long_response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" \
            --data-binary @long.json "$GH_API/repos/$GH_REPO/actions/workflows/manual.yml/dispatches")
          if [ "$CODE" = "204" ]; then echo "Accepted LONG_VIDEO content_id=23 publish_at=2026-10-15T16:00:00Z"; else echo "LONG_VIDEO dispatch failed: HTTP $CODE"; jq '{message,errors}' long_response.json || true; FAILED=1; fi
          printf '%s' "$SHORT_PAYLOAD_B64" | base64 -d > short.json
          CODE=$(curl -sS --max-time 45 -o short_response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" \
            --data-binary @short.json "$GH_API/repos/$GH_REPO/actions/workflows/manual.yml/dispatches")
          if [ "$CODE" = "204" ]; then echo "Accepted SHORT content_id=24 publish_at=2026-10-15T21:00:00Z"; else echo "SHORT dispatch failed: HTTP $CODE"; jq '{message,errors}' short_response.json || true; FAILED=1; fi
          test "$FAILED" -eq 0
