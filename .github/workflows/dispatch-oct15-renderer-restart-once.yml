name: One-time October 15 renderer restart

on:
  push:
    branches: [main]
    paths:
      - ".github/run-once/oct15-renderer-restart.trigger"

permissions:
  contents: write
  actions: write

jobs:
  dispatch-existing-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current validated renderer
        uses: actions/checkout@v4

      - name: Dispatch existing October 15 content rows once and clean up
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          trigger=".github/run-once/oct15-renderer-restart.trigger"
          test -f "$trigger"
          artifact="/tmp/oct15-handoff.zip"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/artifacts/11804562738/zip" \
            -o "$artifact"
          handoff="/tmp/oct15-handoff.json"
          unzip -p "$artifact" auto_handoff_result.json > "$handoff"
          jq -e '.long_dispatch.inputs.content_id == "23" and .short_dispatch.inputs.content_id == "24" and .slot_date == "2026-10-15"' "$handoff" >/dev/null
          dispatch() {
            selector="$1"
            content_id="$2"
            input_json="$(jq -c "$selector" "$handoff")"
            payload="$(jq -cn --arg ref "main" --argjson inputs "$input_json" '{ref:$ref,inputs:$inputs}')"
            code="$(curl --silent --show-error --location -o "/tmp/dispatch-${content_id}.out" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/manual.yml/dispatches")"
            if [[ "$code" != "204" ]]; then
              echo "Dispatch failed for content ${content_id}; HTTP ${code}."
              cat "/tmp/dispatch-${content_id}.out"
              return 1
            fi
            echo "Accepted renderer dispatch for existing content ID ${content_id}; no D1 content is created."
          }
          dispatch '.long_dispatch.inputs' "23"
          dispatch '.short_dispatch.inputs' "24"

          # Remove both one-time dispatch files from main after the two API calls succeed.
          for file in ".github/run-once/oct15-renderer-restart.trigger" ".github/workflows/dispatch-oct15-renderer-restart-once.yml"; do
            file_sha="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPOSITORY}/contents/${file}?ref=main" | jq -r '.sha')"
            payload="$(jq -cn --arg message "chore: remove one-time Oct 15 renderer dispatcher" --arg sha "$file_sha" '{message:$message,sha:$sha,branch:"main"}')"
            code="$(curl --silent --show-error --location -o /tmp/delete-dispatch-helper.out -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.github.com/repos/${GH_REPOSITORY}/contents/${file}")"
            if [[ "$code" != "200" ]]; then
              echo "Could not remove one-time helper ${file}; HTTP ${code}."
              cat /tmp/delete-dispatch-helper.out
              exit 1
            fi
          done
          echo "Both existing renderer jobs were dispatched; one-time helper cleaned up."
