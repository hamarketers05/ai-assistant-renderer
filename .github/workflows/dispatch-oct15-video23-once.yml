          WORDS=$(python3 -c 'import re,sys; print(len(re.findall(r"\\b[\\w-]+\\b", sys.stdin.read())))' < script.txt)
          if [ "$WORDS" -lt 850 ] || [ "$WORDS" -gt 1000 ]; then
            echo "Dispatch stopped: script word count $WORDS outside 850-1000."
            exit 1
          fi
          jq -n --rawfile script script.txt --rawfile description description.txt \
            --arg title "AI Agents Can Act for You—But Who Controls the Risk?" \
            --arg tags "AI Agents,AI Automation,AI Safety,AI Security,Prompt Injection,AI Risk Management,NIST,OWASP,Human Oversight,Artificial Intelligence,Future of Work,Cybersecurity" \
            '{ref:"main",inputs:{content_id:"23",content_format:"LONG_VIDEO",stereo_output:"SBS",title:$title,script:$script,description:$description,tags:$tags,editorial_category:"AI Agents & Automation",publish_at:"2026-10-15T16:00:00Z"}}' > dispatch.json
          CODE=$(curl -sS --max-time 45 -o response.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @dispatch.json \
            "$GH_API/repos/$GH_REPO/actions/workflows/manual.yml/dispatches")
          if [ "$CODE" != "204" ]; then
            echo "Renderer dispatch failed with HTTP $CODE."
            jq '{message,errors}' response.json || true
            exit 1
          fi
          echo "Accepted LONG_VIDEO dispatch for content 23; 2026-10-15T16:00:00Z; word_count=$WORDS."
