name: Verify Cloudflare Free-Source Research
# Re-run this gate after the Main Worker JSON recovery and script pre-save fact-check update.
# Main Worker now conservatively cross-checks shared current headlines across independent publishers.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-cloudflare-research.yml"
  workflow_dispatch:
    inputs:
      query:
        description: "Focused English AI topic for live Cloudflare research verification"
        required: false
        type: string
        default: "latest AI news"
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WORKER_URL: https://dark-sunset-a2a1.hamarketers05.workers.dev
# Main Worker trims both configured and supplied bearer tokens before comparing.
      WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
      RESEARCH_QUERY: ${{ inputs.query || 'latest AI news' }}
    steps:
      - name: Run protected Cloudflare research
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WORKER_AUTH_TOKEN"
          mkdir -p work
          CODE=$(curl -sS --retry 1 --retry-delay 2 --max-time 180 -o work/cloudflare-research.json -w "%{http_code}" \
            -H "Authorization: Bearer $WORKER_AUTH_TOKEN" -H "Accept: application/json" \
            --get --data-urlencode "brand_id=AI_TECH_LAB" --data-urlencode "q=$RESEARCH_QUERY" \
            "$WORKER_URL/research")
          echo "Cloudflare research HTTP status: $CODE"
          test "$CODE" = "200" || { head -c 600 work/cloudflare-research.json; echo; exit 1; }
          jq -e '.ok == true' work/cloudflare-research.json >/dev/null
          jq '{ok,research_id,evidence_count,source_coverage,verification,google_trends_rss_status,google_trends_api_status,topic_recommendation}' work/cloudflare-research.json
          jq -e '(.evidence_count // 0) >= 3 and (.source_coverage.official_primary // 0) >= 1 and (.source_coverage.independent_reporting // 0) >= 2 and .topic_recommendation.topic != "No source-backed candidate" and ((.topic_recommendation.candidates[0].verification_status // "") == "CROSS_CHECKED")' work/cloudflare-research.json >/dev/null || { echo "SAFE BLOCK: no relevant topic with recent cross-publisher support; no script/render/upload requested."; exit 2; }
          CLAIMS=$(jq -r '(.verified_claims // []) | length' work/cloudflare-research.json)
          if [ "$CLAIMS" -lt 1 ]; then
            echo "SAFE BLOCK: sources were retrieved, but no cross-checked claim passed the Worker evidence gate. No script/render/upload was requested."
            exit 2
          fi
          echo "PASS: Cloudflare returned primary sources, independent reporting and at least one cross-checked claim."
          TOPIC=$(jq -r '.topic_recommendation.topic' work/cloudflare-research.json)
          SCRIPT_BODY=$(jq -nc --arg topic "$TOPIC" '{topic:$topic}')
          SCRIPT_CODE=$(curl -sS --retry 1 --retry-delay 2 --max-time 180 -o work/script-package.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $WORKER_AUTH_TOKEN" -H "Content-Type: application/json" \
            --data "$SCRIPT_BODY" "$WORKER_URL/admin/generate-script")
          echo "Protected script generation/fact-check HTTP status: $SCRIPT_CODE"
          jq '{ok,stage,content_id,topic,title,word_count,verified_event,source_count,independent_publishers,fact_check,content_status,next_stage,error,unsupported_claim_count,unsupported_examples}' work/script-package.json
          test "$SCRIPT_CODE" = "200" || { echo "SAFE BLOCK: script generation or fact-check did not pass; no voice/render/upload requested."; exit 2; }
          jq -e '.ok == true and (.word_count >= 850) and (.word_count <= 1000) and (.fact_check.approved == true) and ((.fact_check.unsupported_claim_count // 1) == 0) and .content_status == "WAITING_FOR_VOICE"' work/script-package.json >/dev/null
      - name: Store diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-free-research-${{ github.run_id }}
          path: |
            work/cloudflare-research.json
            work/script-package.json
          if-no-files-found: warn
          retention-days: 3
