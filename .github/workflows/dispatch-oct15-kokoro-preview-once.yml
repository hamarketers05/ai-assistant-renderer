name: One-time October 15 Kokoro Voice Preview Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-oct15-kokoro-preview-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_API: ${{ github.api_url }}
    steps:
      - name: Download the verified October 15 research package
        shell: bash
        run: |
          set -euo pipefail
          gh run download 38404003553 --repo "$GH_REPO" --name ai-tech-lab-research-38404003553 --dir research-artifact
          test -s research-artifact/work/script.txt
          test -s research-artifact/work/title.txt
          test -s research-artifact/work/description.txt
          test -s research-artifact/work/tags.txt
          echo "Research artifact 38404003553 verified; script bytes: $(wc -c < research-artifact/work/script.txt)."

      - name: Dispatch voice-preview-only renderer run
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg content_id "23" \
            --arg content_format "LONG_VIDEO" \
            --arg stereo_output "SBS" \
            --arg title "$(cat research-artifact/work/title.txt)" \
            --arg script "$(cat research-artifact/work/script.txt)" \
            --arg description "$(cat research-artifact/work/description.txt)" \
            --arg tags "$(cat research-artifact/work/tags.txt)" \
            --arg editorial_category "AI Agents & Automation" \
            --arg publish_at "2026-10-15T16:00:00Z" \
            '{ref:"main",inputs:{content_id:$content_id,audio_url:"",content_format:$content_format,stereo_output:$stereo_output,title:$title,script:$script,description:$description,tags:$tags,editorial_category:$editorial_category,publish_at:$publish_at}}' > request.json
          code=$(curl -sS --max-time 45 -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @request.json \
            "$GH_API/repos/$GH_REPO/actions/workflows/manual.yml/dispatches")
          if [ "$code" != "204" ]; then
            echo "Voice preview dispatch failed: HTTP $code"
            jq '{message,errors}' response.json || cat response.json
            exit 1
          fi
          echo "Voice preview dispatch accepted for planned long-video slot 23."
          echo "audio_url is deliberately empty, so production/render/YouTube steps must remain blocked."
