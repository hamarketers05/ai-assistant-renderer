name: CI Workflow Guard

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "tools/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  workflow-guard:
    name: Validate workflow YAML and embedded Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free smoke-test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check PyYAML==6.0.2 numpy scipy pillow

      - name: Smoke-test cinematic renderer components
        run: |
          set -euo pipefail
          python -m py_compile tools/mini_agents.py tools/mini_agent_delivery_report.py tools/scene_director.py tools/render_transitions.py tools/make_transition_sfx.py tools/generate_flux_images.py tools/write_editing_tool_manifest.py tools/make_evidence_charts.py tools/generate_scene_art.py tools/fetch_free_video.py tools/fetch_free_media.py tools/compose_scene_overlays.py tools/visual_budget.py tools/asset_reuse_guard.py tools/daily_content_research.py tools/make_daily_short.py tools/daily_auto_handoff.py
          python tools/mini_agents.py --self-test
          python tools/fetch_free_video.py --self-test
          python tools/seo_source_safety.py
          mkdir -p work scenes output assets
          python tools/generate_flux_images.py --self-test --output work/flux_self_test_report.json
          python tools/fetch_free_media.py --self-test
          python tools/compose_scene_overlays.py --self-test
          python tools/visual_budget.py --self-test
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          report = json.loads(Path("work/flux_self_test_report.json").read_text(encoding="utf-8"))
          with Image.open("work/flux-image-self-test.png") as image:
              assert image.size == (1920, 1080), image.size
          assert report.get("status") == "self_test_passed"
          print("FLUX composition self-test passed with no model request or AI quota use.")
          PY
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=blue:s=640x360:r=30:d=3" -an -c:v libx264 -pix_fmt yuv420p scenes/scene_1.mp4
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=yellow:s=640x360:r=30:d=3" -an -c:v libx264 -pix_fmt yuv420p scenes/scene_2.mp4
          printf '1\t0\t2.75\t2.75\tgenerated\tAI overview\tAI overview\n2\t2.75\t5.5\t2.75\tgenerated\tAI security\tAI security\n' > work/scenes.tsv
          python tools/render_transitions.py --target-duration 5.5 --transition 0.35 --output work/transition-smoke.mp4
          python tools/make_transition_sfx.py --scenes work/scenes.tsv --voice-duration 25.0 --intro-seconds 4 --content-id 9876 --output work/transition-sfx.wav
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=640x360:rate=30:duration=2" -f lavfi -i "sine=frequency=440:sample_rate=44100:duration=2" -vf "eq=contrast=1.10:saturation=1.10:gamma=1.015:brightness=0.004,colorbalance=rs=-0.018:gs=0.000:bs=0.018:rm=-0.008:gm=0.000:bm=0.008:rh=0.016:gh=0.004:bh=-0.014:pl=1,unsharp=5:5:0.45:3:3:0.0,vignette=PI/5,noise=alls=1.2:allf=t,drawbox=x=0:y=0:w=iw:h=44:color=black:t=fill" -af "apulsator=mode=sine:amount=0.75:width=1.5:hz=0.08,deesser=i=0.22:m=0.30:f=0.55,loudnorm=I=-14:TP=-1.0:LRA=11" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -t 2 work/cinematic-filter-smoke.mp4
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 work/cinematic-filter-smoke.mp4 | grep -qx video
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 work/cinematic-filter-smoke.mp4 | grep -qx audio
          test -s work/transition-smoke.mp4
          test -s work/transition-sfx.wav
          test -s work/transition_sfx_report.json
          echo "Cinematic FFmpeg color/audio and transition SFX smoke tests passed."

      - name: Smoke-test voice-timed scene planning and per-video manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          words = ("AI systems need reliable sources for every important claim because small details "
                   "change quickly while clear visuals explain the technology in practice today").split()
          tokens = (words * 6)[:120]
          script = " ".join(word + ("." if (i + 1) % 12 == 0 else ("," if (i + 1) % 6 == 0 else ""))
                             for i, word in enumerate(tokens))
          Path("work/script.txt").write_text(script, encoding="utf-8")
          timestamp_words = [{"start": round(i * 0.5, 3), "end": round(i * 0.5 + 0.4, 3), "text": word}
                             for i, word in enumerate(tokens)]
          Path("work/voice_word_timestamps.json").write_text(json.dumps({
              "duration_seconds": 60.0, "word_count": len(timestamp_words), "words": timestamp_words
          }), encoding="utf-8")
          PY
          python tools/scene_director.py --script work/script.txt --duration 60 --max-scenes 90 --timestamps work/voice_word_timestamps.json
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          scene = json.loads(Path("work/scene_director_report.json").read_text(encoding="utf-8"))
          average = float(scene.get("scene_duration_seconds", {}).get("mean", 99))
          if scene.get("exact_word_timing") is not True or scene.get("planned_visual_scenes", 0) < 12 or average > 4.5:
              raise SystemExit(f"Voice-aligned scene cadence failed: {scene}")
          # Independently exercise the strict long-video scene target using a local,
          # source-free fixture. This makes no AI/API calls and produces no publishable video.
          import subprocess
          short_script = Path("work/script.txt").read_text(encoding="utf-8")
          short_timestamps = Path("work/voice_word_timestamps.json").read_text(encoding="utf-8")
          base_words = ("AI systems need reliable sources for every important claim because small details "
                        "change quickly while clear visuals explain the technology in practice today").split()
          long_tokens = (base_words * 60)[:840]
          long_script = " ".join(
              word + ("." if (i + 1) % 20 == 0 else ("," if (i + 1) % 5 == 0 else ""))
              for i, word in enumerate(long_tokens)
          )
          long_duration = 323.0
          long_words_timing = [
              {"start": round(i * long_duration / len(long_tokens), 4),
               "end": round(min(long_duration, i * long_duration / len(long_tokens) + 0.30), 4),
               "text": word}
              for i, word in enumerate(long_tokens)
          ]
          Path("work/long-video-script-fixture.txt").write_text(long_script, encoding="utf-8")
          Path("work/long-video-timestamps-fixture.json").write_text(json.dumps({
              "duration_seconds": long_duration, "word_count": len(long_words_timing),
              "words": long_words_timing
          }), encoding="utf-8")
          subprocess.run([
              "python", "tools/scene_director.py", "--script", "work/long-video-script-fixture.txt",
              "--duration", str(long_duration), "--max-scenes", "90",
              "--timestamps", "work/long-video-timestamps-fixture.json",
              "--output", "work/long-video-scenes-fixture.tsv"
          ], check=True)
          long_scene = json.loads(Path("work/scene_director_report.json").read_text(encoding="utf-8"))
          long_count = int(long_scene.get("planned_visual_scenes", 0))
          if long_scene.get("exact_word_timing") is not True or not 80 <= long_count <= 90:
              raise SystemExit(f"Long-video 80-90 scene gate fixture failed: {long_scene}")
          if abs(float(long_scene.get("voice_duration_seconds", 0)) - long_duration) > 0.55:
              raise SystemExit(f"Long-video duration alignment fixture failed: {long_scene}")
          print(f"Long-video scene planner fixture passed: {long_count} voice-aligned scenes for {long_duration:.0f}s.")

          # Restore the Short fixture for the following manifest smoke test.
          Path("work/script.txt").write_text(short_script, encoding="utf-8")
          Path("work/voice_word_timestamps.json").write_text(short_timestamps, encoding="utf-8")
          subprocess.run([
              "python", "tools/scene_director.py", "--script", "work/script.txt",
              "--duration", "60", "--max-scenes", "90", "--timestamps", "work/voice_word_timestamps.json"
          ], check=True)
          scene = json.loads(Path("work/scene_director_report.json").read_text(encoding="utf-8"))
          n = int(scene["planned_visual_scenes"])
          if n < 4:
              raise SystemExit(f"Scene-art fixture requires at least four planned scenes, got {n}")
          Path("work/title.txt").write_text("CI scene-art visual QA: AI chip inference and power efficiency", encoding="utf-8")
          subprocess.run(["python", "tools/generate_scene_art.py"], check=True)
          source_art = Path("tools/generate_scene_art.py").read_text(encoding="utf-8")
          if 'caption_text="\\n".join(caption_lines)' not in source_art or 'od.multiline_text((108,906),caption_text' not in source_art:
              raise SystemExit("Lower-third wrapping regression: caption must be laid out as bounded multi-line text.")
          for scene_id in (1, min(2,n), n):
              for path in (Path(f"assets/generated_scene_{scene_id}.png"), Path(f"assets/scene_overlay_{scene_id}.png")):
                  if not path.is_file() or path.stat().st_size < 10_000:
                      raise SystemExit(f"Script-matched scene visual missing/too small: {path}")
                  with Image.open(path) as visual:
                      if visual.size != (1920,1080):
                          raise SystemExit(f"Scene visual is not Full HD: {path} {visual.size}")
                      visual.verify()
          with Image.open("assets/scene_overlay_1.png") as overlay:
              if overlay.mode != "RGBA" or overlay.getchannel("A").getbbox() is None:
                  raise SystemExit("Transparent HUD overlay has no visible alpha content.")
          print(f"Script-matched scene-art/overlay smoke test passed for {n} planned scenes.")
          fixtures = {
              "voice_edit_report.json": {"status":"passed","timestamped_words":120},
              "rubberband_report.json": {"status":"skipped","reason":"Static fixture does not alter voice pitch."},
              "video_review_report.json": {"review_status":"completed","decision":"PASS","overall_score":10,"blocking_issues":[]},
              "transitions_report.json": {"scenes":n,"transition":"alternating cinematic xfade","rendered_duration_seconds":60},
              "transition_sfx_report.json": {"status":"generated","transition_count":n-1,"cue_lead_seconds":0.22,"source_license":"Original synthesized effects; no third-party audio samples."},
              "music_report.json": {"status":"generated","source":"original_synthesized","uses_external_samples":False},
              "opencv_visual_qa.json": {"status":"passed","sample_frames":10},
              "rendered_scene_assets_report.json": {"status":"passed","rendered_scene_count":n,"evidence_charts_used":0,"transparent_hud_overlay_applied_count":4,"chart_overlay_applied_count":0,"licensed_stock_broll_scene_count":4,"cloudflare_flux_image_scene_count":2,"python_pillow_scene_count":n-6,"scenes":[
                  {"scene":str(i),"primary_asset":"assets/fixture_stock_"+str(i)+".mp4","asset_type":"licensed_stock_broll","flux_image_used":False,"hud_overlay_applied":True,"chart_overlay_applied":False,"color_grade":"FFmpeg cinematic contrast/teal-warm balance/soft grain","motion":"Ken Burns/slow drift on scene imagery"}
                  if i<4 else
                  {"scene":str(i),"primary_asset":"assets/generated_scene_"+str(i)+".png","asset_type":"cloudflare_flux_image" if i in {4,5} else "python_pillow_scene","flux_image_used":i in {4,5},"hud_overlay_applied":False,"chart_overlay_applied":False,"color_grade":"FFmpeg cinematic contrast/teal-warm balance/soft grain","motion":"Ken Burns/slow drift on scene imagery"}
                  for i in range(n)]},
              "flux_generation_report.json": {"status":"skipped","generated_count":0,"requested_count":0,"reason":"CI fixture uses local fallback without calling Workers AI","model":"@cf/black-forest-labs/flux-1-schnell","license":"Apache-2.0","license_url":"https://github.com/black-forest-labs/flux/blob/main/model_licenses/LICENSE-FLUX1-schnell"},
              "asset_reuse_report.json": {"status":"validated","previous_video_reuse":False,"within_video_duplicates":False},
              "evidence_charts_report.json": {"charts_created":[],"charts_requested":0},
              "visual_coverage_report.json": {"status":"passed","content_id":"9876","content_format_target":"native 1080x1920 AI Tech Lab Short",
                  "checks":{"native_vertical_output":True,"duration_in_20_to_60_second_window":True,
                            "rendered_scene_count_between_8_and_30":True,"at_least_8_unique_primary_visual_assets":True,
                            "at_least_4_hud_overlays_applied":True,"at_least_2_flux_images_actually_used":True,
                            "at_least_4_vecteezy_assets_verified":True,"caption_file_has_at_least_5_cues":True,
                            "every_rendered_scene_has_primary_asset_record":True},
                  "visual_counts":{"rendered_scene_placements":n,"unique_primary_visual_assets":n,
                                   "hud_overlay_placements":4,"subtitle_cue_placements":8}},
              "visual_media_report.json": {"status":"no_eligible_assets","assets_downloaded":0,"providers":{}},
              "chart_overlay_report.json": {"status":"passed","scenes_considered":n,"evidence_charts_mapped_to_scenes":0,"chart_assignments":[]},
              "stereo_3d_report.json": {"status":"disabled"},
              "kokoro_audio_quality.json": {"quality_gate":"passed"},
              "thumbnail_brief.json": {"hook":"TEST HOOK"},
          }
          for name, obj in fixtures.items():
              Path("work",name).write_text(json.dumps(obj),encoding="utf-8")
          Path("work/asset_sources.jsonl").write_text("\n".join(
              json.dumps({"provider":"Wikimedia Commons","scene":str(i),"asset_id":"fixture-video-"+str(i),
                          "asset_path":"assets/fixture_stock_"+str(i)+".mp4",
                          "source_url":"https://commons.wikimedia.org/wiki/File:Fixture_"+str(i),
                          "creator":"CI fixture","license_label":"CC BY 4.0",
                          "license_url":"https://creativecommons.org/licenses/by/4.0/", "commercial_use_allowed":True})
              for i in range(4))+"\n",encoding="utf-8")
          Path("output/manifest-smoke.mp4").write_bytes(b"fixture" * 20000)
          from PIL import Image, ImageDraw
          image = Image.new("RGB",(1280,720),(4,18,36))
          draw = ImageDraw.Draw(image)
          for i in range(0,1280,8):
              draw.line((i,0,1279-i//3,719),fill=(8+i%32,40+i%48,72+i%64),width=2)
          image.save("output/manifest-smoke.jpg",quality=90)
          import hashlib
          thumb_hash = hashlib.sha256(Path("output/manifest-smoke.jpg").read_bytes()).hexdigest()
          Path("work/thumbnail_imagemagick_report.json").write_text(json.dumps({
              "status":"used","input_sha256":"fixture-before-imagemagick",
              "output_sha256":thumb_hash,"output_changed":True,"dimensions":[1280,720]
          }),encoding="utf-8")
          PY
          python tools/write_editing_tool_manifest.py --content-id 9876 --format SHORT --stereo-output SBS --final-video output/manifest-smoke.mp4 --thumbnail output/manifest-smoke.jpg --output work/editing_tool_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/editing_tool_manifest.json").read_text(encoding="utf-8"))
          if report.get("status") != "passed" or report.get("transition_sfx_count", 0) < 1:
              raise SystemExit(f"Per-video manifest failed: {report}")
          if report.get("visual_assets", {}).get("planned_voice_aligned_scenes", 0) < 12:
              raise SystemExit(f"Actual scene/tool counts missing: {report}")
          print("Voice timing and actual per-video tool manifest smoke test passed.")
          PY

      - name: Lint GitHub Actions workflows with pinned actionlint
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version
          /tmp/actionlint -color

      - name: Parse every workflow and embedded renderer Python
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import re
          from pathlib import Path
          import yaml

          workflow_files = sorted(Path(".github/workflows").glob("*.yml"))
          for path in workflow_files:
              doc = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              if not isinstance(doc, dict) or not doc.get("name") or not isinstance(doc.get("jobs"), dict):
                  raise SystemExit(f"Invalid GitHub Actions workflow structure: {path}")
              print(f"YAML OK: {path}")

          for path in Path("tools").glob("*.py"):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))

          manual = yaml.load(Path(".github/workflows/manual.yml").read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          render = next(step for step in manual["jobs"]["render"]["steps"] if step.get("name") == "Render scenes")
          match = re.search("python - <<'PY'\\n(.*?)\\nPY", render.get("run", ""), re.S)
          if not match:
              raise SystemExit("Could not extract embedded Python from the Render scenes step.")
          ast.parse(match.group(1), filename="manual.yml:Render scenes embedded Python")

          vecteezy = next(step for step in manual["jobs"]["render"]["steps"] if step.get("name") == "Discover and download Vecteezy footage")
          stock_match = re.search("cat > work/fetch_vecteezy.py <<'PY'\\n(.*?)\\nPY", vecteezy.get("run", ""), re.S)
          if not stock_match:
              raise SystemExit("Could not extract embedded Python from the Vecteezy acquisition step.")
          stock_script = stock_match.group(1)
          ast.parse(stock_script, filename="manual.yml:Vecteezy acquisition embedded Python")
          if "relevance_score < 0.45" not in stock_script or "len(matching_terms) < 2" not in stock_script:
              raise SystemExit("Vecteezy relevance safeguards disappeared from the embedded acquisition code.")
          print(f"Embedded scene renderer and Vecteezy acquisition syntax OK; checked {len(workflow_files)} workflows.")
          PY
