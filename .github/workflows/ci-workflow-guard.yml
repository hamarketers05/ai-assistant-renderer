name: CI Workflow Guard

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "tools/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  workflow-guard:
    name: Validate workflow YAML and embedded Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free smoke-test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check PyYAML==6.0.2 numpy scipy pillow

      - name: Smoke-test cinematic renderer components
        run: |
          set -euo pipefail
          python -m py_compile tools/scene_director.py tools/render_transitions.py tools/make_transition_sfx.py tools/write_editing_tool_manifest.py tools/make_evidence_charts.py tools/generate_scene_art.py
          mkdir -p work scenes output assets
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=blue:s=640x360:r=30:d=3" -an -c:v libx264 -pix_fmt yuv420p scenes/scene_1.mp4
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=yellow:s=640x360:r=30:d=3" -an -c:v libx264 -pix_fmt yuv420p scenes/scene_2.mp4
          printf '1\t0\t2.75\t2.75\tgenerated\tAI overview\tAI overview\n2\t2.75\t5.5\t2.75\tgenerated\tAI security\tAI security\n' > work/scenes.tsv
          python tools/render_transitions.py --target-duration 5.5 --transition 0.35 --output work/transition-smoke.mp4
          python tools/make_transition_sfx.py --scenes work/scenes.tsv --voice-duration 25.0 --intro-seconds 4 --content-id 9876 --output work/transition-sfx.wav
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=640x360:rate=30:duration=2" -f lavfi -i "sine=frequency=440:sample_rate=44100:duration=2" -vf "eq=contrast=1.10:saturation=1.10:gamma=1.015:brightness=0.004,colorbalance=rs=-0.018:gs=0.000:bs=0.018:rm=-0.008:gm=0.000:bm=0.008:rh=0.016:gh=0.004:bh=-0.014:pl=1,unsharp=5:5:0.45:3:3:0.0,vignette=PI/5,noise=alls=1.2:allf=t,drawbox=x=0:y=0:w=iw:h=44:color=black:t=fill" -af "apulsator=mode=sine:amount=0.75:width=1.5:hz=0.08,deesser=i=0.22:m=0.30:f=0.55,loudnorm=I=-14:TP=-1.0:LRA=11" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -t 2 work/cinematic-filter-smoke.mp4
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 work/cinematic-filter-smoke.mp4 | grep -qx video
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 work/cinematic-filter-smoke.mp4 | grep -qx audio
          test -s work/transition-smoke.mp4
          test -s work/transition-sfx.wav
          test -s work/transition_sfx_report.json
          echo "Cinematic FFmpeg color/audio and transition SFX smoke tests passed."

      - name: Smoke-test voice-timed scene planning and per-video manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          words = ("AI systems need reliable sources for every important claim because small details "
                   "change quickly while clear visuals explain the technology in practice today").split()
          tokens = (words * 6)[:120]
          script = " ".join(word + ("." if (i + 1) % 12 == 0 else ("," if (i + 1) % 6 == 0 else ""))
                             for i, word in enumerate(tokens))
          Path("work/script.txt").write_text(script, encoding="utf-8")
          timestamp_words = [{"start": round(i * 0.5, 3), "end": round(i * 0.5 + 0.4, 3), "text": word}
                             for i, word in enumerate(tokens)]
          Path("work/voice_word_timestamps.json").write_text(json.dumps({
              "duration_seconds": 60.0, "word_count": len(timestamp_words), "words": timestamp_words
          }), encoding="utf-8")
          PY
          python tools/scene_director.py --script work/script.txt --duration 60 --max-scenes 90 --timestamps work/voice_word_timestamps.json
          python - <<'PY'
          import json
          from pathlib import Path
          scene = json.loads(Path("work/scene_director_report.json").read_text(encoding="utf-8"))
          average = float(scene.get("scene_duration_seconds", {}).get("mean", 99))
          if scene.get("exact_word_timing") is not True or scene.get("planned_visual_scenes", 0) < 12 or average > 4.5:
              raise SystemExit(f"Voice-aligned scene cadence failed: {scene}")
          n = int(scene["planned_visual_scenes"])
          fixtures = {
              "voice_edit_report.json": {"status":"passed","timestamped_words":120},
              "transitions_report.json": {"scenes":n,"transition":"alternating cinematic xfade","rendered_duration_seconds":60},
              "transition_sfx_report.json": {"status":"generated","transition_count":n-1,"cue_lead_seconds":0.22,"source_license":"Original synthesized effects; no third-party audio samples."},
              "music_report.json": {"status":"generated","source":"original_synthesized","uses_external_samples":False},
              "opencv_visual_qa.json": {"status":"passed","sample_frames":10},
              "rendered_scene_assets_report.json": {"status":"passed","rendered_scene_count":n,"evidence_charts_used":0,"transparent_hud_overlay_applied_count":3,"licensed_stock_broll_scene_count":4,"python_pillow_scene_count":n-4},
              "asset_reuse_report.json": {"status":"validated","previous_video_reuse":False,"within_video_duplicates":False},
              "evidence_charts_report.json": {"charts_created":[],"charts_requested":0},
              "stereo_3d_report.json": {"status":"disabled"},
              "kokoro_audio_quality.json": {"quality_gate":"passed"},
              "thumbnail_brief.json": {"hook":"TEST HOOK"},
          }
          for name, obj in fixtures.items():
              Path("work",name).write_text(json.dumps(obj),encoding="utf-8")
          Path("work/asset_sources.jsonl").write_text("\n".join(
              json.dumps({"provider":"LicenseFixture","scene":str(i),"source_url":"https://example.org/"+str(i),"creator":"CI fixture"})
              for i in range(4))+"\n",encoding="utf-8")
          Path("output/manifest-smoke.mp4").write_bytes(b"fixture" * 20000)
          from PIL import Image, ImageDraw
          image = Image.new("RGB",(1280,720),(4,18,36))
          draw = ImageDraw.Draw(image)
          for i in range(0,1280,8):
              draw.line((i,0,1279-i//3,719),fill=(8+i%32,40+i%48,72+i%64),width=2)
          image.save("output/manifest-smoke.jpg",quality=90)
          PY
          python tools/write_editing_tool_manifest.py --content-id 9876 --format SHORT --stereo-output SBS --final-video output/manifest-smoke.mp4 --thumbnail output/manifest-smoke.jpg --output work/editing_tool_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("work/editing_tool_manifest.json").read_text(encoding="utf-8"))
          if report.get("status") != "passed" or report.get("transition_sfx_count", 0) < 1:
              raise SystemExit(f"Per-video manifest failed: {report}")
          if report.get("visual_assets", {}).get("planned_voice_aligned_scenes", 0) < 12:
              raise SystemExit(f"Actual scene/tool counts missing: {report}")
          print("Voice timing and actual per-video tool manifest smoke test passed.")
          PY

      - name: Lint GitHub Actions workflows with pinned actionlint
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version
          /tmp/actionlint -color

      - name: Parse every workflow and embedded renderer Python
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import re
          from pathlib import Path
          import yaml

          workflow_files = sorted(Path(".github/workflows").glob("*.yml"))
          for path in workflow_files:
              doc = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              if not isinstance(doc, dict) or not doc.get("name") or not isinstance(doc.get("jobs"), dict):
                  raise SystemExit(f"Invalid GitHub Actions workflow structure: {path}")
              print(f"YAML OK: {path}")

          for path in Path("tools").glob("*.py"):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))

          manual = yaml.load(Path(".github/workflows/manual.yml").read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          render = next(step for step in manual["jobs"]["render"]["steps"] if step.get("name") == "Render scenes")
          match = re.search("python - <<'PY'\\n(.*?)\\nPY", render.get("run", ""), re.S)
          if not match:
              raise SystemExit("Could not extract embedded Python from the Render scenes step.")
          ast.parse(match.group(1), filename="manual.yml:Render scenes embedded Python")
          print(f"Embedded scene renderer syntax OK; checked {len(workflow_files)} workflows.")
          PY
