name: One-time October 15 Research Preflight Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-oct15-research-preflight-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-research:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch October 15 research package (no production handoff)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"ref":"main","inputs":{"target_date":"2026-10-15"}}' > request.json
          code=$(curl -sS --max-time 45 -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @request.json \
            "$GH_API/repos/$GH_REPO/actions/workflows/daily-content-research.yml/dispatches")
          if [ "$code" != "204" ]; then
            echo "Research dispatch failed: HTTP $code"
            cat response.json
            exit 1
          fi
          echo "October 15 research dispatch accepted. The run label is preflight-only to hold at the voice approval gate."
