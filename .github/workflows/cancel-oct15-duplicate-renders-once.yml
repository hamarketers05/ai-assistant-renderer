name: Cancel duplicate queued Oct 15 renders

on:
  push:
    branches: [main]
    paths:
      - ".github/run-once/cancel-oct15-duplicates.trigger"

permissions:
  contents: read
  actions: write

jobs:
  cancel-duplicates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the two duplicate queued runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f ".github/run-once/cancel-oct15-duplicates.trigger"
          api="https://api.github.com/repos/${GH_REPOSITORY}/actions/runs"
          for run_id in 38385600151 38385603620; do
            body="/tmp/cancel-${run_id}.json"
            code="$(curl --silent --show-error --location -o "$body" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/${run_id}/cancel")"
            if [[ "$code" != "202" && "$code" != "409" ]]; then
              echo "Cancel request for ${run_id} returned HTTP ${code}."
              cat "$body"
              exit 1
            fi
            echo "Cancellation requested only for redundant queued renderer run ${run_id}."
          done
          for run_id in 38385600151 38385603620; do
            verified=false
            for attempt in 1 2 3 4 5; do
              status="$(curl --fail --silent --show-error --location \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/${run_id}" | jq -r '.status + "/" + (.conclusion // "null")')"
              echo "Run ${run_id}: ${status}"
              if [[ "$status" == "completed/cancelled" || "$status" == "completed/success" || "$status" == "completed/failure" ]]; then
                verified=true
                break
              fi
              sleep 3
            done
            [[ "$verified" == true ]] || { echo "Run ${run_id} status did not settle; manual review required."; exit 1; }
          done
          echo "Duplicate queue cleanup complete; the two intended render runs were not cancelled."
