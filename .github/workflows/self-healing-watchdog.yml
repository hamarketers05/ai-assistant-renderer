name: AI Tech Lab Autonomous Self-Healing Watchdog

on:
  push:
    branches: [main]
    paths:
      - "tools/self_healing_rescue.py"
      - "tools/pipeline_catalog.json"
      - "tools/self_healing_pipeline_health.py"
      - "tools/test_self_healing_pipeline_health.py"
      - ".github/workflows/self-healing-watchdog.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows:
      - "AI Tech Lab Autonomous Self-Healing Agent"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: ai-tech-lab-self-healing-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main') }}
    name: Diagnose and recover the recovery controller
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main with history for recovery loop protection
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and run independent recovery watchdog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_TEXT_MODEL: openai/gpt-oss-20b
        run: |
          set -euo pipefail
          python -m py_compile tools/self_healing_rescue.py tools/self_healing_pipeline_health.py tools/test_self_healing_pipeline_health.py
          python tools/test_self_healing_pipeline_health.py
          python tools/self_healing_pipeline_health.py
          python tools/self_healing_rescue.py

      - name: Save machine-readable recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-tech-lab-watchdog-${{ github.run_id }}
          path: work/self_healing_report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sanitized recovery report to Cloudflare D1 dashboard
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python -m py_compile tools/publish_self_heal_report.py
          python tools/publish_self_heal_report.py
