name: AI Tech Lab Autonomous Self-Healing Agent

on:
  push:
    branches: [main]
    paths:
      - "tools/self_healing_agent.py"
      - "tools/publish_self_heal_report.py"
      - "cloudflare/ai-tech-lab-daily-handoff/worker.js"
      - ".github/workflows/ai-self-healing-agent.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows:
      - "AI Tech Lab Daily Research and Script"
      - "AI Tech Lab Automatic Daily Production Handoff"
      - "AI Assistant Renderer"
      - "CI Workflow Guard"
      - "Renderer Static Validation"
      - "Verify Daily Handoff Endpoint (No Upload)"
      - "Midas SBS Validation"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: ai-tech-lab-self-healing
  cancel-in-progress: false

jobs:
  self-heal:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main') }}
    name: Monitor, diagnose, safely recover and report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main with history for duplicate protection
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run autonomous self-healing controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_TEXT_MODEL: openai/gpt-oss-20b
        run: |
          set -euo pipefail
          python -m py_compile tools/self_healing_agent.py
          python tools/self_healing_agent.py

      - name: One-time Workers AI fallback smoke test (never applies a patch)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[fallback-smoke-test]') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from pathlib import Path
          run_id = os.environ['GITHUB_RUN_ID']
          body = {
              'workflow_run_id': run_id,
              'source_run_id': run_id,
              'failed_workflow': 'Fallback smoke test only',
              'failed_job': 'No production failure; safe connectivity probe',
              'target': 'tools/' + 'voice_editor.py',
              'source': 'def voice_edit():\\n    return True\\n',
              'log': 'Synthetic test only. No patch is needed. Return NO_SAFE_PATCH; never invent a change.'
          }
          request = urllib.request.Request(
              'https://ai-tech-lab-daily-handoff.hamarketers05.workers.dev/self-heal/patch',
              data=json.dumps(body).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Content-Type': 'application/json'},
              method='POST'
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode())
                  status = response.status
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode('utf-8', 'replace')[:1000]
              print(f'Workers AI fallback HTTP {exc.code}; sanitized response: {detail}')
              raise SystemExit(1)
          patch_text = str(result.get('patch', ''))
          print(json.dumps({'http_status': status, 'ok': result.get('ok'), 'provider': result.get('provider'), 'model': result.get('model'), 'response_chars': len(patch_text), 'patch_applied': False}))
          if status != 200 or result.get('ok') is not True or result.get('provider') != 'cloudflare_workers_ai' or not patch_text:
              raise SystemExit('Workers AI fallback failed its non-mutating smoke test.')
          PY

      - name: Save machine-readable recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-tech-lab-self-heal-${{ github.run_id }}
          path: work/self_healing_report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sanitized recovery report to Cloudflare D1 dashboard
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python -m py_compile tools/publish_self_heal_report.py
          python tools/publish_self_heal_report.py
