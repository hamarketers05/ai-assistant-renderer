name: AI Tech Lab Autonomous Self-Healing Agent

on:
  push:
    branches: [main]
    paths:
      - "tools/self_healing_agent.py"
      - "tools/test_self_healing_agent.py"
      - "tools/self_healing_ml.py"
      - "tools/test_self_healing_ml.py"
      - "tools/self_healing_incidents_train.jsonl"
      - "tools/self_healing_incidents_eval.jsonl"
      - "tools/publish_self_heal_report.py"
      - "cloudflare/ai-tech-lab-daily-handoff/worker.js"
      - ".github/workflows/ai-self-healing-agent.yml"
      - ".github/workflows/verify-ai-fallback.yml"
      - ".github/workflows/verify-main-worker-chat.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows:
      - "AI Tech Lab Daily Research and Script"
      - "AI Tech Lab Automatic Daily Production Handoff"
      - "AI Assistant Renderer"
      - "CI Workflow Guard"
      - "Verify authenticated AI fallback (no upload)"
      - "Verify Main Worker Health and API Protection (No Publishing)"
      - "Renderer Static Validation"
      - "Verify Daily Handoff Endpoint (No Upload)"
      - "Verify Cloudflare Free-Source Research"
      - "Verify Cloudflare Trend Script (No Publishing)"
      - "Midas SBS Validation"
      - "Self-Healing E2E Repair Test"
      - "Verify and correct Maia 300 YouTube source metadata"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  # Keep each source event/run separate: a burst of unrelated workflow_run events
  # must not replace the one pending run responsible for repairing a real failure.
  group: ai-tech-lab-self-healing-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  self-heal:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.name == 'Verify and correct Maia 300 YouTube source metadata')) }}
    name: Monitor, diagnose, safely recover and report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main with history for duplicate protection
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run autonomous self-healing controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_TEXT_MODEL: openai/gpt-oss-20b
        run: |
          set -euo pipefail
          python -m py_compile tools/self_healing_agent.py tools/test_self_healing_agent.py tools/self_healing_ml.py tools/test_self_healing_ml.py
          python tools/test_self_healing_agent.py
          python tools/test_self_healing_ml.py
          python tools/self_healing_ml.py --train --output work/self_healing_ml_model.json --evaluation-output work/self_healing_ml_evaluation.json
          python tools/self_healing_agent.py

      - name: Save machine-readable recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-tech-lab-self-heal-${{ github.run_id }}
          path: |
            work/self_healing_report.json
            work/self_healing_ml_model.json
            work/self_healing_ml_evaluation.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sanitized recovery report to Cloudflare D1 dashboard
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python -m py_compile tools/publish_self_heal_report.py
          python tools/publish_self_heal_report.py
