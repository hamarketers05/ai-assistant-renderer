name: AI Tech Lab Autonomous Self-Healing Agent

on:
  push:
    branches: [main]
    paths:
      - "tools/self_healing_agent.py"
      - "tools/publish_self_heal_report.py"
      - "cloudflare/ai-tech-lab-daily-handoff/worker.js"
      - ".github/workflows/ai-self-healing-agent.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows:
      - "AI Tech Lab Daily Research and Script"
      - "AI Tech Lab Automatic Daily Production Handoff"
      - "AI Assistant Renderer"
      - "CI Workflow Guard"
      - "Renderer Static Validation"
      - "Verify Daily Handoff Endpoint (No Upload)"
      - "Midas SBS Validation"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: ai-tech-lab-self-healing
  cancel-in-progress: false

jobs:
  self-heal:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main') }}
    name: Monitor, diagnose, safely recover and report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main with history for duplicate protection
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run autonomous self-healing controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_TEXT_MODEL: openai/gpt-oss-20b
        run: |
          set -euo pipefail
          python -m py_compile tools/self_healing_agent.py
          python tools/self_healing_agent.py

      - name: One-time Workers AI fallback connection test (does not apply patches)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Run one-time Workers AI fallback connectivity test')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error, pathlib
          source = pathlib.Path("tools/daily_content_research.py").read_text(encoding="utf-8")[:30000]
          payload = {
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "source_run_id": os.environ["GITHUB_RUN_ID"],
              "failed_workflow": "Self-healing Workers AI smoke test",
              "failed_job": "Connectivity-only test; returned patch will never be applied",
              "target": "tools/daily_content_research.py",
              "source": source,
              "log": "Synthetic test only: no deterministic defect has been demonstrated. Do not invent a fix; NO_SAFE_PATCH is an acceptable response."
          }
          request = urllib.request.Request(
              "https://ai-tech-lab-daily-handoff.hamarketers05.workers.dev/self-heal/patch",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                       "Content-Type": "application/json", "Accept": "application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(request, timeout=35) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              print("Workers AI fallback HTTP failure:", exc.code, exc.read(1000).decode("utf-8", "replace"))
              raise
          if result.get("ok") is not True or result.get("provider") != "cloudflare_workers_ai" or not result.get("patch"):
              raise RuntimeError("Workers AI fallback did not confirm inference.")
          print("Workers AI fallback connected; provider=cloudflare_workers_ai; patch_returned=true; patch_applied=false.")
          PY

      - name: Save machine-readable recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-tech-lab-self-heal-${{ github.run_id }}
          path: work/self_healing_report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sanitized recovery report to Cloudflare D1 dashboard
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python -m py_compile tools/publish_self_heal_report.py
          python tools/publish_self_heal_report.py
