name: One-Time AI Tech Lab October 15 Handoff Dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/run-once/dispatch-oct15-handoff.txt"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-handoff:
    if: ${{ github.event.head_commit.message == 'RUN-AI-TECH-LAB-OCT15-HANDOFF-ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch the real production handoff for the successful research run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -n --arg ref "main" --arg source_run_id "38383055932" \
            '{ref:$ref,inputs:{source_run_id:$source_run_id,dry_run:false}}' > dispatch.json
          CODE=$(curl -sS --max-time 45 -o response.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @dispatch.json \
            "$GH_API/repos/$GH_REPO/actions/workflows/daily-auto-production.yml/dispatches")
          if [ "$CODE" != "204" ]; then
            echo "Real production handoff dispatch failed with HTTP $CODE."
            jq '{message,errors}' response.json || true
            exit 1
          fi
          echo "Accepted real production handoff for research run 38383055932; dry_run=false."
