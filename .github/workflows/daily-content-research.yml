name: AI Tech Lab Daily Research and Script

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      seed_topic:
        description: "Optional search direction; if live evidence is sparse, use the scheduled category evergreen fallback without claiming it is trending"
        required: false
        type: string
      target_date:
        description: "US Eastern production date (YYYY-MM-DD); defaults to tomorrow"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-tech-lab-daily-research-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  cloudflare-research-and-script:
    name: Cloudflare live-trend recovery or scheduled-category explainer to Groq script
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WORKER_AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
      WORKER_URL: https://dark-sunset-a2a1.hamarketers05.workers.dev
      SEED_TOPIC: ${{ inputs.seed_topic }}
      TARGET_DATE: ${{ inputs.target_date }}
    steps:
      - name: Checkout for the existing production handoff contract
        uses: actions/checkout@v4

      - name: Request authentic category-aware research with bounded YouTube recovery and evergreen fallback
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WORKER_AUTH_TOKEN" || { echo "Missing WORKER_AUTH_TOKEN repository secret."; exit 1; }
          mkdir -p work
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(TZ=America/New_York date -d tomorrow +%F)
          fi
          date -d "$TARGET_DATE" +%F >/dev/null
          BODY=$(jq -cn --arg d "$TARGET_DATE" --arg q "$SEED_TOPIC" '{target_date:$d} + (if $q != "" then {category_query:$q} else {} end)')
          CODE=$(curl -sS --max-time 300 -o work/cloudflare_trend_script.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $WORKER_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY" \
            "$WORKER_URL/editorial/trend-script")
          if [ "$CODE" != "200" ]; then
            echo "Cloudflare trend-to-script route returned HTTP $CODE; fail closed."
            jq '{ok,stage,error,detail,editorial_category,trend_verification,audit}' work/cloudflare_trend_script.json || true
            exit 1
          fi
          jq -e '
            .ok == true and
            .stage == "cloudflare_trend_script_ready" and
            ((.trend_verification.gate == "PASS" and .trend_verification.distinct_video_count >= 3 and .qa.trend_category_gate == "PASS") or (.trend_verification.gate == "SCHEDULED_ROTATION_FALLBACK" and .trend_verification.fallback == "scheduled_category_evergreen_explainer" and .trend_verification.selected_current_trend == false and .qa.trend_category_gate == "SCHEDULED_ROTATION_FALLBACK")) and
            (.script_word_count >= 850 and .script_word_count <= 1000) and
            (.hook_audit.score >= 7 and .hook_audit.human_voice_score >= 7) and
            (.qa.human_voice_audit == "PASS" and (.qa.unsupported_current_claims // 0) == 0) and
            (.category_rotation.date_us_eastern == .target_date or .category_rotation.date_us_eastern == null or .category_rotation.date_us_eastern == .category_decision.date_us_eastern)
          ' work/cloudflare_trend_script.json >/dev/null
          jq --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
            generated_at_utc:$generated,
            target_audience:.target_audience,
            brand:.brand,
            primary_ai:"Groq",
            research_provider:.research_provider,
            trend_provider:"YouTube Data API v3",
            editorial_category:.editorial_category,
            category_rotation:.category_rotation,
            category_decision:.category_decision,
            title:.title,
            hook:((.script | split(" ") | .[0:24] | join(" ")) + "..."),
            hook_audit:.hook_audit,
            human_voice_qa:{score:.hook_audit.human_voice_score,decision:"PASS"},
            script_word_count:.script_word_count,
            script:.script,
            description:.description,
            tags:.tags,
            trend_basis:(.trend_basis + {gate:.trend_verification.gate,fallback:.trend_verification.fallback,selected_current_trend:(.trend_verification.selected_current_trend != false)}),
            trend_verification:.trend_verification,
            trend_mode:.trend_mode,
            state_store_mode:.state_store_mode,
            sources:.sources,
            claims_review:[],
            visual_direction:[],
            chapters:[],
            warnings:(["Tavily is disabled for this pipeline. YouTube Data API v3 provides category trend signals; official/independent RSS and arXiv provide research context."] + (if .trend_mode == "SCHEDULED_ROTATION_FALLBACK" then ["Evergreen fallback used because no reliable three-video category trend sample was found; do not describe this package as a live trend."] else [] end)),
            previous_video_learning_applied:{}
          }' work/cloudflare_trend_script.json > work/daily_content_package.json
          jq '{
            provider:.research_provider,
            topic:.trend_topic,
            category:.editorial_category,
            trend_verification:.trend_verification,
            sources:.sources,
            research_record_id:.research_record_id
          }' work/cloudflare_trend_script.json > work/research_evidence.json
          jq -r '.script' work/daily_content_package.json > work/script.txt
          jq -r '.title' work/daily_content_package.json > work/title.txt
          jq -r '.description' work/daily_content_package.json > work/description.txt
          jq -r '(.tags // []) | join(",")' work/daily_content_package.json > work/tags.txt
          jq '{score:.hook_audit.score,human_voice_score:.hook_audit.human_voice_score,decision:"PASS",notes:.hook_audit.notes}' work/daily_content_package.json > work/hook_audit.json
          jq '{status:(if .trend_mode == "LIVE_TREND" then "CLOUDFLARE_TREND_SCRIPT_READY" else "CLOUDFLARE_EVERGREEN_FALLBACK_READY" end),title,script_words:.script_word_count,category:.editorial_category,category_date:.category_rotation.date_us_eastern,trend_mode:.trend_mode,distinct_trending_videos:.trend_verification.distinct_video_count,source_context_count:(.sources|length),hook_score:.hook_audit.score,human_voice_score:.hook_audit.human_voice_score,provider:.provider,research_provider:.research_provider,state_store_mode:.state_store_mode}' work/cloudflare_trend_script.json > work/research_summary.json
          jq '{editorial_category,category_rotation,category_decision,trend_basis,trend_verification}' work/daily_content_package.json > work/topic_brief.json
          jq '{category:.editorial_category,trend_verification:.trend_verification,videos:.trend_verification.videos}' work/daily_content_package.json > work/youtube_trend_signals.json
          jq '{stage:"research_and_script",status:"completed",provider:.provider,research_provider:.research_provider,trend_verification:.trend_verification,hook_audit:.hook_audit}' work/cloudflare_trend_script.json > work/mini_agent_execution_report.json
          cat work/research_summary.json

      - name: Publish category-verified script package for automatic voice production
        uses: actions/upload-artifact@v4
        with:
          name: ai-tech-lab-research-${{ github.run_id }}
          path: |
            work/daily_content_package.json
            work/research_summary.json
            work/youtube_trend_signals.json
            work/research_evidence.json
            work/topic_brief.json
            work/hook_audit.json
            work/mini_agent_execution_report.json
            work/script.txt
            work/title.txt
            work/description.txt
            work/tags.txt
            work/cloudflare_trend_script.json
          if-no-files-found: error
          retention-days: 7
